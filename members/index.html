  function gatePassed(){
    try { return sessionStorage.getItem('goatAdminGate') === '1'; } catch(e){ return false; }
  }
  function setGatePassed(){
    try { sessionStorage.setItem('goatAdminGate', '1'); } catch(e){}
  }
  function clearGate(){
    try { sessionStorage.removeItem('goatAdminGate'); } catch(e){}
  }
  function renderAdminGate(){
    stopListeners();
    show(
    '<div class="panel login-panel">' +
      '<h1 class="login-title">ADMIN</h1>' +
      '<div class="login-rule"></div>' +
      '<p class="login-sub">Enter the first code</p>' +
      '<input class="f-field" id="ag-code1" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4 digits">' +
      '<button class="big" id="ag-next">Continue</button>' +
      '<p class="m-note f-msg" id="ag-msg"></p>' +
      '<p style="text-align:center;margin-top:14px"><button class="linklike" id="ag-back">Back to login</button></p>' +
    '</div>');
    setTimeout(function(){
      var back=$('#ag-back');
      if(back) back.onclick=function(){ if(window.GOAT){ GOAT.clearCode(); if(GOAT.clearIdentity) GOAT.clearIdentity(); } code=''; profile=null; identity=null; clearGate(); renderLogin(''); };
      var next=$('#ag-next');
      if(next) next.onclick=function(){
        var v=(document.getElementById('ag-code1')||{}).value||'';
        v=String(v).trim();
        var msg=$('#ag-msg');
        // Verify against Firestore (hashed lookup — the admin codes are
        // never in this page).
        var checked = (window.GOAT && GOAT.verifyAdminCode) ? GOAT.verifyAdminCode(v, 1) : Promise.resolve(false);
        checked.then(function(ok){
          if(!ok){ if(msg) msg.textContent='Wrong code.'; return; }
          show(
          '<div class="panel login-panel">' +
            '<h1 class="login-title">ADMIN</h1>' +
            '<div class="login-rule"></div>' +
            '<p class="login-sub">First code correct. Enter the second code.</p>' +
            '<input class="f-field" id="ag-code2" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4 digits">' +
            '<button class="big" id="ag-unlock">Unlock</button>' +
            '<p class="m-note f-msg" id="ag-msg2"></p>' +
            '<p style="text-align:center;margin-top:14px"><button class="linklike" id="ag-back2">Back to login</button></p>' +
          '</div>');
          setTimeout(function(){
            var back2=$('#ag-back2');
            if(back2) back2.onclick=function(){ if(window.GOAT) GOAT.clearCode(); code=''; profile=null; identity=null; clearGate(); renderLogin(''); };
            var un=$('#ag-unlock');
            if(un) un.onclick=function(){
              var v2=(document.getElementById('ag-code2')||{}).value||'';
              v2=String(v2).trim();
              var msg2=$('#ag-msg2');
              var checked2 = (window.GOAT && GOAT.verifyAdminCode) ? GOAT.verifyAdminCode(v2, 2) : Promise.resolve(false);
              checked2.then(function(ok2){
                if(!ok2){ if(msg2) msg2.textContent='Wrong code.'; return; }
                setGatePassed();
                renderDashboard();
              }).catch(function(){
                if(msg2) msg2.textContent='Couldn\u2019t verify right now \u2014 try again.';
              });
            };
          }, 220);
        }).catch(function(){
          if(msg) msg.textContent='Couldn\u2019t verify right now \u2014 try again.';
        });
      };
    }, 220);
  }

  function renderDashboard(){
    stopListeners();
    if(!profile) return renderLogin('');
    var isAdmin = !!(identity && identity.admin);
    show(
    '<div class="m-nav"><a href="/thewall/">&larr; The Wall</a><span class="m-nav-dot">&#9670;</span></div>' +
    '<div class="panel">' +
      '<div class="m-top"><h1 style="font-size:40px">Hello, '+esc(profile.name)+'</h1>' +
      '<button class="linklike" id="logout">Log out</button></div>' +
      '<div class="rule"></div>' +
      '<div class="goat-stage" id="goat-stage"></div>' +
      '<p class="flip-caption">Tap the card to flip it &nbsp;<b>\u21bb</b></p>' +

      '<div class="m-sec"><h2>Your test scores</h2><div id="scores"><p class="m-note">Loading\u2026</p></div>' +
      '<a class="big" href="/test/">Take the test</a></div>' +

      '<div class="m-sec"><h2>Request a change</h2>' +
      '<label class="f-label" for="req-details">Your request</label>' +
      '<textarea class="f-field" id="req-details" placeholder="Request to add people, change something on your card, or anything."></textarea>' +
      '<button class="big" id="req-send">Send request</button>' +
      '<p class="m-note f-msg" id="req-msg"></p></div>' +

      '<div class="m-sec"><h2>Notifications</h2><div id="notes"><p class="m-note">Loading\u2026</p></div></div>' +

      (isAdmin ? '<div class="m-sec"><h2>Requests for you</h2><div id="admin-reqs"><p class="m-note">Loading\u2026</p></div></div>' : '') +
      (isAdmin ? '<div class="m-sec"><h2>Manage people</h2><div id="manage-people"><p class="m-note">Loading\u2026</p></div></div>' : '') +
    '</div>');
    setTimeout(function(){
      var stage=$('#goat-stage');
      var g = cardFor(profile.name);
      if (stage && g) {
        try { stage.appendChild(buildCard(g)); } catch(e){ if(window.console) console.warn('[members] card build failed:', e && e.message); }
      }
      var lo=$('#logout');
      if(lo) lo.onclick=function(){ stopListeners(); if(window.GOAT){ GOAT.clearCode(); if(GOAT.clearIdentity) GOAT.clearIdentity(); } code=''; profile=null; identity=null; clearGate(); renderLogin(''); };
      var send=$('#req-send');
      if(send) send.onclick=sendRequest;
      startCardLive();
      startScores();
      startNotes();
      if(isAdmin) startAdmin();
      if(isAdmin) startManagePeople();
    }, 220);
  }

  /* ---------- LIVE HP ON THE CARD (wall-live.js pattern) ---------- */
  function startCardLive(){
    if(dbDown()) return;
    try{
      var unsub = GOAT.db.collection('scores').onSnapshot(function(snap){
        snap.forEach(function(doc){
          var d = doc.data() || {};
          if (!d.taken) return;
          if (doc.id !== profile.name) return;
          var n = Math.round(Number(d.overall));
          if (!isFinite(n)) return;
          var card = document.querySelector('[data-name="'+profile.name+'"]');
          if (!card) return;
          var hp = card.querySelector('[data-hp]');
          if (hp && hp.textContent !== String(n)) hp.textContent = String(n);
        });
      }, function(){});
      unsubs.push(unsub);
    }catch(e){}
  }

  function startScores(){
    var box=$('#scores'); if(!box) return;
    // ajchapa's HP stays "???" by design — he doesn't take the test.
    if(identity && identity.admin){
      box.innerHTML='<p class="m-note">Your HP stays &ldquo;???&rdquo; &mdash; you don&rsquo;t take the test.</p>';
      return;
    }
    if(dbDown()){ box.innerHTML='<p class="m-note">Couldn\u2019t reach the database yet. Your scores will show once it\u2019s up.</p>'; return; }
    try{
      var unsub = GOAT.db.collection('scores').doc(profile.name).onSnapshot(function(doc){
        var b=$('#scores'); if(!b) return;
        var d = doc.exists ? (doc.data()||{}) : null;
        if(!d || !d.taken){
          b.innerHTML='<p class="m-note">You haven\u2019t taken the test yet. Your HP updates on the wall as soon as you finish it.</p>';
          return;
        }
        var bar=function(label,v){
          var val = Math.round(Number(v)||0);
          return '<div class="sc-row"><div class="sc-top"><span>'+label+'</span><b>'+val+'</b></div>'
            + '<div class="sc-track"><i data-w="'+val+'"></i></div></div>';
        };
        b.innerHTML = bar('SPEED',d.speed)+bar('MEMORY',d.memory)+bar('REASONING',d.reasoning)
          + '<div class="sc-plaque">'
          + '<div class="num">'+Math.round(Number(d.overall)||0)+'</div>'
          + '<div class="sub">This is the number on your card.</div></div>';
        setTimeout(function(){
          var bars = b.querySelectorAll('.sc-track i');
          for (var i=0;i<bars.length;i++){ bars[i].style.width = bars[i].getAttribute('data-w') + '%'; }
        }, 60);
      }, function(){
        var b=$('#scores'); if(b) b.innerHTML='<p class="m-note">Couldn\u2019t load scores right now.</p>';
      });
      unsubs.push(unsub);
    }catch(e){ box.innerHTML='<p class="m-note">Couldn\u2019t load scores right now.</p>'; }
  }

  function startNotes(){
    var box=$('#notes'); if(!box) return;
    if(dbDown()){ box.innerHTML='<p class="m-note">Notifications need the database.</p>'; return; }
    try{
      var unsub = GOAT.db.collection('notifications').orderBy('createdAt','desc').limit(30).onSnapshot(function(snap){
        var b=$('#notes'); if(!b) return;
        var items=[];
        snap.forEach(function(doc){
          var d=doc.data()||{};
          if((identity && identity.admin) || d.name===profile.name) items.push({id:doc.id, d:d});
        });
        if(!items.length){ b.innerHTML='<p class="m-note">No notifications yet.</p>'; return; }
        b.innerHTML = items.map(function(it){
          var d=it.d;
          return '<div class="notif-item">'+esc(d.message||'')+'<button class="notif-del" data-id="'+esc(it.id)+'" aria-label="Delete notification">&times;</button><div class="cnt">'+esc(fmtTime(d.createdAt))+'</div></div>';
        }).join('');
        // Seen handling: mark shown notifications as read (with when they
        // were seen), and delete ones seen more than 2 days ago.
        items.forEach(function(it){
          var d=it.d;
          var ref=GOAT.db.collection('notifications').doc(it.id);
          if(!d.read){
            ref.update({read:true, readAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
          } else if(d.readAt && d.readAt.toDate){
            var seen=d.readAt.toDate();
            if(seen && (Date.now()-seen.getTime()) > 2*24*60*60*1000){
              ref.delete().catch(function(){});
            }
          }
        });
      }, function(){
        var b=$('#notes'); if(b) b.innerHTML='<p class="m-note">Couldn\u2019t load notifications right now.</p>';
      });
      unsubs.push(unsub);
      box.addEventListener('click', function(ev){
        var btn = ev.target && ev.target.closest ? ev.target.closest('.notif-del') : null;
        if(!btn) return;
        var id = btn.getAttribute('data-id');
        if(!id) return;
        btn.disabled=true;
        GOAT.db.collection('notifications').doc(id).delete().catch(function(e){
          if(window.console) console.warn('[members] delete notification failed:', e && e.message);
          btn.disabled=false;
        });
      });
    }catch(e){ box.innerHTML='<p class="m-note">Couldn\u2019t load notifications right now.</p>'; }
  }

  function startAdmin(){
    var box=$('#admin-reqs'); if(!box) return;
    if(dbDown()){ box.innerHTML='<p class="m-note">Requests need the database.</p>'; return; }
    try{
      var unsub = GOAT.db.collection('requests').orderBy('createdAt','desc').limit(50).onSnapshot(function(snap){
        var b=$('#admin-reqs'); if(!b) return;
        var items=[];
        snap.forEach(function(doc){
          var d=doc.data()||{};
          if(d.status==='pending') items.push({id:doc.id, d:d});
        });
        if(!items.length){ b.innerHTML='<p class="m-note">No pending requests.</p>'; return; }
        b.innerHTML = items.map(function(it){
          var who = it.d.name || 'Someone';
          return '<div class="m-req"><div class="cnt">'+esc(who)+' \u00b7 '+esc(fmtTime(it.d.createdAt))+'</div>' +
            '<p>'+esc(it.d.details||'')+'</p>' +
            '<div class="actions">' +
              '<button class="btn-ghost" data-decide="approved" data-id="'+esc(it.id)+'" data-name="'+esc(it.d.name||'')+'">Approve</button>' +
              '<button class="btn-danger" data-decide="denied" data-id="'+esc(it.id)+'" data-name="'+esc(it.d.name||'')+'">Deny</button>' +
            '</div></div>';
        }).join('');
        [].slice.call(b.querySelectorAll('[data-decide]')).forEach(function(btn){
          btn.onclick=function(){ decideRequest(btn.getAttribute('data-id'), btn.getAttribute('data-name'), btn.getAttribute('data-decide'), btn); };
        });
      }, function(){
        var b=$('#admin-reqs'); if(b) b.innerHTML='<p class="m-note">Couldn\u2019t load requests right now.</p>';
      });
      unsubs.push(unsub);
    }catch(e){ box.innerHTML='<p class="m-note">Couldn\u2019t load requests right now.</p>'; }
  }

  function decideRequest(id, requesterName, status, btn){
    if(dbDown()) return;
    if(btn) btn.disabled=true;
    GOAT.ensureAuth().then(function(){
      return GOAT.db.collection('requests').doc(id).update({ status: status });
    }).then(function(){
      var msg = status==='approved' ? 'The request was approved.' : 'The request was denied.';
      return GOAT.notify(msg, status==='approved' ? 'request_approved' : 'request_denied', requesterName || '');
    }).catch(function(e){
      if(window.console) console.warn('[members] decide failed:', e && e.message);
      if(btn) btn.disabled=false;
    });
  }

  /* ---------- MANAGE PEOPLE (admin only; the two-code gate is at login) ---------- */
  var manageOverrides={};
  var manageScores={};
  var manageOpen={};
  function startManagePeople(){
    // No gate here — the admin already passed the two codes at login.
    renderPeopleList();
  }

  function renderPeopleList(){
    var box=$('#manage-people'); if(!box) return;
    if(dbDown()){ box.innerHTML='<p class="m-note">Manage people needs the database.</p>'; return; }
    box.innerHTML='<p class="m-note">Loading people\u2026</p>';
    try{
      var unsub = GOAT.db.collection('people').onSnapshot(function(snap){
        manageOverrides={};
        snap.forEach(function(doc){ manageOverrides[doc.id]=doc.data()||{}; });
        drawPeopleList();
      }, function(){
        var b=$('#manage-people'); if(b) b.innerHTML='<p class="m-note">Couldn\u2019t load people right now.</p>';
      });
      unsubs.push(unsub);
      // Scores, so each row shows their HP (or "-" if they haven't taken the test).
      var unsub2 = GOAT.db.collection('scores').onSnapshot(function(snap){
        manageScores={};
        snap.forEach(function(doc){
          var d=doc.data()||{};
          if(d.taken && typeof d.overall==='number') manageScores[doc.id]=d.overall;
        });
        drawPeopleList();
      }, function(){});
      unsubs.push(unsub2);
    }catch(e){ box.innerHTML='<p class="m-note">Couldn\u2019t load people right now.</p>'; }
  }

  function drawPeopleList(){
    var box=$('#manage-people'); if(!box) return;
    // Roster from the CARDS data (names/titles/photos are public).
    // People and scores are keyed by NAME, never by access code.
    var roster=CARDS.map(function(g){ return {name:g.name, title:g.title, photo:g.photo}; });
    if(!roster.length){ box.innerHTML='<p class="m-note">No people found.</p>'; return; }
    box.innerHTML = roster.map(function(p){
      var c=p.name;
      var ov=manageOverrides[c]||{};
      var removed=!!ov.removed;
      var name=(typeof ov.name==='string' && ov.name) ? ov.name : (p.name||c);
      var title=(typeof ov.title==='string' && ov.title) ? ov.title : (p.title||'');
      var photo=(typeof ov.photo==='string' && ov.photo) ? ov.photo : (p.photo||'');
      var hp = (c==='ajchapa') ? '???' : (typeof manageScores[c]==='number' ? manageScores[c] : '-');
      var open = !!manageOpen[c];
      return '<div class="m-req" data-pname="'+esc(c)+'">' +
        '<div class="m-req-head"><span class="chev">'+(open?'▾':'▸')+'</span><div class="cnt">'+esc(name)+' · '+esc(title)+' · HP '+esc(String(hp))+(removed?' · REMOVED':'')+'</div></div>' +
        '<div class="m-req-body" style="display:'+(open?'block':'none')+'">' +
        '<label class="f-label">Name</label>' +
        '<input class="f-field" data-f="name" value="'+esc(name)+'">' +
        '<label class="f-label">Title</label>' +
        '<input class="f-field" data-f="title" value="'+esc(title)+'">' +
        '<label class="f-label">Photo</label>' +
        '<input class="f-field" data-f="photo" value="'+esc(photo)+'" placeholder="/photo.jpg">' +
        '<div class="actions">' +
          '<button class="btn-ghost" data-act="save">Save changes</button>' +
          (removed
            ? '<button class="btn-ghost" data-act="restore">Restore to the wall</button>'
            : '<button class="btn-danger" data-act="remove">Remove from the wall</button>') +
        '</div>' +
        '<div class="actions"><button class="btn-ghost" data-act="reset">Reset test</button></div>' +
        '<p class="m-note f-msg" data-msg></p>' +
        '</div>' +
      '</div>';
    }).join('');
    [].slice.call(box.querySelectorAll('.m-req-head')).forEach(function(head){
      head.onclick=function(){
        var wrap=head.closest ? head.closest('[data-pname]') : null;
        if(!wrap) return;
        var c=wrap.getAttribute('data-pname');
        var body=wrap.querySelector('.m-req-body');
        var chev=head.querySelector('.chev');
        if(!body) return;
        var open = body.style.display==='block';
        body.style.display = open ? 'none' : 'block';
        if(chev) chev.textContent = open ? '▸' : '▾';
        manageOpen[c] = !open;
      };
    });
    [].slice.call(box.querySelectorAll('[data-act]')).forEach(function(btn){
      btn.onclick=function(){
        var wrap=btn.closest ? btn.closest('[data-pname]') : null;
        if(!wrap) return;
        var c=wrap.getAttribute('data-pname');
        var act=btn.getAttribute('data-act');
        var msgEl=wrap.querySelector('[data-msg]');
        function say(t){ if(msgEl) msgEl.textContent=t; }
        if(dbDown()){ say('The database isn’t reachable right now.'); return; }
        btn.disabled=true;
        GOAT.ensureAuth().then(function(){
          if(act==='reset'){
            try { localStorage.removeItem('goatTaken_'+c); } catch (e) {}
            return GOAT.db.collection('scores').doc(c).delete().then(function(){ say('Test reset. They can take it again.'); });
          }
          var ref=GOAT.db.collection('people').doc(c);
          if(act==='remove'){
            return ref.set({removed:true}, {merge:true}).then(function(){ say('Removed from the wall.'); });
          }
          if(act==='restore'){
            return ref.set({removed:false}, {merge:true}).then(function(){ say('Restored to the wall.'); });
          }
          if(act==='save'){
            var name=(wrap.querySelector('[data-f="name"]')||{}).value||'';
            var title=(wrap.querySelector('[data-f="title"]')||{}).value||'';
            var photo=(wrap.querySelector('[data-f="photo"]')||{}).value||'';
            var data={};
            if(String(name).trim()) data.name=String(name).trim();
            if(String(title).trim()) data.title=String(title).trim();
            if(String(photo).trim()) data.photo=String(photo).trim();
            return ref.set(data, {merge:true}).then(function(){ say('Saved. The wall updates live.'); });
          }
        }).catch(function(e){
          say('Couldn’t save that right now. Try again.');
          if(window.console) console.warn('[members] manage people failed:', e && e.message);
        }).then(function(){ btn.disabled=false; });
      };
    });
  }
  function sendRequest(){
    var detEl=$('#req-details'), msgEl=$('#req-msg'), btn=$('#req-send');
    if(!detEl || !msgEl) return;
    var details=(detEl.value||'').trim();
    if(!details){ msgEl.textContent='Write what you want first.'; return; }
    if(dbDown()){ msgEl.textContent='The database isn\u2019t reachable right now \u2014 try again once it\u2019s set up.'; return; }
    btn.disabled=true;
    GOAT.ensureAuth().then(function(){
      return GOAT.db.collection('requests').add({
        name: profile.name,
        type: 'other',
        details: details,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(function(){
      detEl.value='';
      msgEl.textContent='Request sent for review.';
      var who=profile.name;
      return GOAT.notify(who+' sent a request.', 'request_created', 'ajchapa');
    }).catch(function(e){
      msgEl.textContent='Couldn\u2019t send that right now. Try again.';
      if(window.console) console.warn('[members] sendRequest failed:', e && e.message);
    }).then(function(){ btn.disabled=false; });
  }

  /* ---------- BOOT ---------- */

  (function boot(){
    try{
      var id = (window.GOAT && GOAT.getIdentity && GOAT.getIdentity()) || null;
      if(id && id.name){
        code=id.code||''; profile={name:id.name, title:id.title, photo:id.photo}; identity=id;
        GOAT.ensureAuth();
        // Admin auto-login still needs the two codes if not yet passed.
        if(id.admin && !gatePassed()){ renderAdminGate(); return; }
        renderDashboard();
      }else{
        renderLogin('');
      }
    }catch(e){ renderLogin(''); }
  })();
})();
</script>
</body>
