<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEMBERS</title>
<link rel="icon" type="image/png" href="/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Mulish:wght@400;600;800&family=Anton&display=swap" rel="stylesheet">

<style>
/* ================= the wall's card CSS, verbatim ================= */
    :root {
      --border:#ebebeb; --text-main:#111; --text-muted:#888;
      --font:'Mulish',sans-serif;
      --serif:'Instrument Serif',Georgia,serif;
      --mono:Menlo,Monaco,Consolas,monospace;
      --foil:#d9c48f; --gold:#c9a227; --gold-deep:#a8842f; --gold-pale:#f1dfa8;
      --ox1:#9a1826; --ox2:#5a0c15; --ox3:#3b060c;
      --wrap:1100px; --gutter:32px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    ::selection{background:#f3e3b3}
    html{background:#fff}
    body{
      background:radial-gradient(1100px 420px at 50% -10%,rgba(217,196,143,.13),transparent 65%),#fff;
      color:var(--text-main);font-family:var(--font);font-size:14px;line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    body.locked{overflow:hidden}
    a{color:inherit;text-decoration:none}
    #page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip}

    .col{width:100%;max-width:var(--wrap);margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}

    /* nav: full width. back link hugs the far left, clock hugs the far right */
    #nav{height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 24px}
    #nav-back{font-size:13px;color:var(--text-muted);letter-spacing:.02em;transition:color .2s ease}
    #nav-back:hover{color:var(--text-main)}
    #nav-time{font-size:11px;color:var(--text-muted);font-family:var(--mono)}

    /* ================= hero ================= */
    #hero{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:10px}
    h1#title{
      font-family:var(--serif);font-weight:400;
      font-size:clamp(32px,4.2vw,50px);letter-spacing:-.015em;line-height:1;cursor:default;
    }
    .kword{display:inline-block;white-space:nowrap}
    .kmask{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
    .kl{
      display:inline-block;opacity:0;transform:translateY(110%);
      animation:
        kin .9s cubic-bezier(.19,.7,.22,1) forwards var(--d,0ms),
        sweep 11s ease-in-out infinite calc(var(--d,0ms) + 3.5s);
      background:linear-gradient(105deg,#111 42%,#c9a227 50%,#111 58%);
      background-size:280% 100%;background-position:0% 0;
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    @keyframes kin{to{opacity:1;transform:translateY(0)}}
    @keyframes sweep{0%,82%{background-position:0% 0}100%{background-position:100% 0}}

    /* ================= handbook ================= */
    #handbook-btn{
      display:flex;align-items:center;gap:10px;
      padding:10px 13px;border:0;background:none;cursor:pointer;
      color:var(--ox2);font-family:var(--serif);font-size:23px;
      transition:transform .25s ease;
    }
    #handbook-btn:hover{transform:translateY(-2px)}
    #handbook-btn svg{width:29px;height:29px}
    #handbook-btn:focus-visible{outline:2px solid var(--ox2);outline-offset:5px}

    /* handbook modal */
    #handbook-modal{
      position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:center;padding:20px;
      background:rgba(15,12,12,.65);
      visibility:hidden;opacity:0;transition:opacity .3s ease,visibility .3s ease;
    }
    #handbook-modal.open{visibility:visible;opacity:1}
    .handbook{
      position:relative;width:100%;max-width:430px;
      padding:45px 42px 38px;background:#fff;border-radius:5px;
      box-shadow:0 25px 80px rgba(0,0,0,.22);
      transform:translateY(18px) scale(.98);opacity:0;
      transition:transform .4s cubic-bezier(.2,.7,.25,1),opacity .35s ease;
    }
    #handbook-modal.open .handbook{transform:translateY(0) scale(1);opacity:1}
    #handbook-close{
      position:absolute;top:17px;right:17px;width:32px;height:32px;
      border:1px solid var(--border);border-radius:50%;background:#fff;color:#555;
      font-size:20px;cursor:pointer;transition:background .2s,transform .2s;
    }
    #handbook-close:hover{background:#f5f3f2;transform:rotate(90deg)}
    .heading{margin-bottom:34px}
    .heading h2{margin:0;font-family:var(--serif);font-size:53px;line-height:1;font-weight:400;color:var(--text-main)}
    .heading-line{width:38px;height:3px;margin-top:17px;background:var(--ox1)}
    .rules{list-style:none;margin:0;padding:0}
    .rules li{display:grid;grid-template-columns:35px 1fr;align-items:start;gap:12px;padding:19px 0;border-bottom:1px solid var(--border)}
    .rules li:first-child{border-top:1px solid var(--border)}
    .rule-number{padding-top:4px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ox1)}
    .rule-text{font-family:var(--serif);font-size:29px;line-height:1.15;color:var(--text-main)}
    .enter-code{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:30px;padding:16px 18px;background:var(--ox2);color:#fff;border-radius:3px;
      font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:1px;text-decoration:none;
      transition:background .2s,transform .2s;
    }
    .enter-code:hover{background:var(--ox3);transform:translateY(-2px)}
    .enter-code span{font-size:19px;font-weight:400}
    .heading,.rules,.enter-code{animation:appear .5s both}
    .rules{animation-delay:.1s}
    .enter-code{animation-delay:.2s}
    @keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:480px){
      .handbook{padding:42px 27px 29px}
      .heading h2{font-size:47px}
      .rule-text{font-size:26px}
    }

    /* ================= the wall: a gallery wall ================= */
    #body{flex:1;padding-top:18px;padding-bottom:90px}
    #wall{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));
      gap:40px 24px;perspective:1400px;padding-top:50px;align-items:start;
    }
    .card:nth-child(even){margin-top:16px}
    .card:nth-child(3n){margin-top:7px}
    /* noel sits level with mijo (7px, from the 3n stagger rule) */
    .card:nth-child(8){margin-top:7px}
    /* kelketra sits level with helen (0 — no stagger, same as card 7) */
    .card:nth-child(9){margin-top:0}
    .card:nth-child(10){margin-top:7px}

    .hang{position:absolute;left:0;right:0;top:-40px;height:40px;pointer-events:none;z-index:0;
      opacity:0;animation:fade .6s ease .6s forwards}
    @keyframes fade{to{opacity:1}}
    .hang svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .hang line{stroke:rgba(var(--ac-rgb),.7);stroke-width:1;vector-effect:non-scaling-stroke}
    .hang i{
      position:absolute;left:50%;top:-4px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff6d4,var(--ac) 55%,var(--ac-deep));
      box-shadow:0 2px 3px rgba(0,0,0,.28);
    }

    .c-gold {--ac:#c9a227;--ac-deep:#a8842f;--ac-pale:#f1dfa8;--ac-rgb:201,162,39;--ac-wash:#fcf7e6;--ac-line:#d9c48f}
    .c-blue {--ac:#2f86ee;--ac-deep:#1d5fb8;--ac-pale:#cfe4ff;--ac-rgb:47,134,238;--ac-wash:#eef5ff;--ac-line:#a9c8f0}
    .c-green{--ac:#21a35a;--ac-deep:#187a43;--ac-pale:#c9eed8;--ac-rgb:33,163,90;--ac-wash:#eefaf2;--ac-line:#a5d9b9}
    .c-pink {--ac:#ff3d9a;--ac-deep:#c2185b;--ac-pale:#ffd1e8;--ac-rgb:255,61,154;--ac-wash:#fff0f7;--ac-line:#f6a8cd}
    .c-money{--ac:#5b8a3c;--ac-deep:#2f5a1f;--ac-pale:#d8e8c0;--ac-rgb:91,138,60;--ac-wash:#f3f8ea;--ac-line:#b5cf98}
    /* golf: kelketra's fire-orange palette — pushed orange, away from ajchapa's gold */
    .c-golf{--ac:#f97316;--ac-deep:#c2410c;--ac-pale:#fed7aa;--ac-rgb:249,115,22;--ac-wash:#fff4e8;--ac-line:#fdba74}
    /* "Goat of Golf With Friends" is long, so his title runs a little smaller */
    .c-golf .plate .title{font-size:13px}
    /* style: noel's burgundy wine palette */
    .c-style{--ac:#a3223f;--ac-deep:#6e0f26;--ac-pale:#f5c9d3;--ac-rgb:163,34,63;--ac-wash:#fdf1f3;--ac-line:#e3a5b3}
    /* noel's name: wine red with a champagne shine sweeping across */
    .c-style .plate .name,.c-style .b-name{
      background:linear-gradient(100deg,#4a0a1a 0%,#6e0f26 30%,#a3223f 44%,#f3dfa2 50%,#a3223f 56%,#6e0f26 70%,#4a0a1a 100%);
      background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
      animation:wineflow 6s linear infinite;
    }
    @keyframes wineflow{to{background-position:-240% 0}}
    /* host: banananana's teal palette */
    .c-host{--ac:#0f9d94;--ac-deep:#0b6b66;--ac-pale:#c6efeb;--ac-rgb:15,157,148;--ac-wash:#eefaf9;--ac-line:#9fd8d3}
    .c-host .plate .name,.c-host .b-name{color:#0b4f4b}
    /* "Banananana" is long, so her name runs a little smaller on the front */
    .c-host .plate .name{font-size:22px;line-height:30px}
    .c-host .b-name{font-size:21px}
    /* dlc: the one dark card. it also switches to a mono voice inside the card */
    .c-dlc{
      --ac:#9b6bff;--ac-deep:#c4abff;--ac-pale:#e1d3f7;--ac-rgb:155,107,255;--ac-wash:#1d1233;--ac-line:#3a2a5c;
      --ink:#120a1f;--ink2:#1d1233;--paper:#f4eeff;
      --mono:'Space Mono',Menlo,Monaco,Consolas,monospace;--font:var(--mono);--serif:var(--mono);
    }

    .card{position:relative;aspect-ratio:5/6.7;opacity:0;animation:rise .7s ease forwards;cursor:pointer}
    .card[data-fx="aim"]{cursor:crosshair}
    .card:focus{outline:none}
    .card:focus-visible .face{outline:2px solid var(--text-main);outline-offset:4px}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .card.locked{cursor:default}
    .card.locked .flip-hint{display:none}

    .flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.25,1)}
    .card.flipped .flipper{transform:rotateY(180deg)}
    .tilter{position:absolute;inset:0;transform-style:preserve-3d}
    .card:hover .tilter{will-change:transform}

    .face{
      position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
      border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--ac-line);
      box-shadow:0 1px 2px rgba(0,0,0,.05),0 20px 40px -22px rgba(0,0,0,.24);
    }
    .face.back{transform:rotateY(180deg)}
    .keyline{position:absolute;inset:8px;border:1px solid rgba(var(--ac-rgb),.5);border-radius:12px;pointer-events:none;z-index:6}

    .photo-wrap{position:relative;height:67%;overflow:hidden;background:var(--ac-wash)}
    .photo-wrap img{
      width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 25%);display:block;
      transform:scale(var(--zoom,1));transform-origin:var(--pos,50% 25%);
      -webkit-user-drag:none;user-select:none;
    }
    .photo-wrap::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;pointer-events:none;
      background:linear-gradient(to top,rgba(0,0,0,.14),transparent)}
    .sheen{
      position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s ease;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.3),transparent 55%),
        linear-gradient(115deg,transparent calc(var(--mx,50%) - 22%),rgba(var(--ac-rgb),.2) var(--mx,50%),transparent calc(var(--mx,50%) + 22%));
    }
    .card:hover .sheen,body.gyro .sheen{opacity:1}
    .photo-wrap.empty{
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(120% 90% at 50% 20%,#fff,var(--ac-wash));
    }
    .photo-wrap.empty::after{display:none}
    .photo-wrap .initial{font-family:var(--serif);font-style:italic;font-size:110px;line-height:1;color:rgba(var(--ac-rgb),.5)}

    /* ---------- name plate: the same layout on every card ----------
       row 1: name on the left, flip badge on the right
       row 2: title, always one line, never grows past the card
       the padding is lopsided on purpose (a bit more at the bottom) so the
       title sits clear of the keyline instead of crowding the card edge */
    .plate{
      position:relative;height:33%;padding:2px 18px 8px;display:flex;flex-direction:column;justify-content:center;gap:6px;
      background:linear-gradient(180deg,#fff,var(--ac-wash));border-top:1px solid rgba(var(--ac-rgb),.35);
    }
    .plate .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
    .plate .name{font-family:var(--serif);font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .plate .title{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.1;color:var(--ac-deep);
    }
    .plate .title::before{content:"";width:5px;height:5px;background:var(--ac);transform:rotate(45deg);flex-shrink:0}
    .plate .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

    .flip-hint{
      flex-shrink:0;display:flex;align-items:center;gap:5px;
      font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ac-deep);
      opacity:.85;transition:opacity .3s ease,transform .3s ease;
    }
    .flip-hint b{
      display:grid;place-items:center;width:19px;height:19px;border-radius:50%;font-weight:400;font-style:normal;font-size:11px;
      border:1px solid rgba(var(--ac-rgb),.6);background:#fff;animation:nudge 3.6s ease-in-out infinite;
    }
    @keyframes nudge{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(180deg)}}
    .card:hover .flip-hint{opacity:1;transform:translateX(-2px)}

    /* ================= CARD BACK: refined ability layout ================= */

        .face.back {
          display: flex;
          flex-direction: column;
          padding: 19px 17px 16px;
          background:
            radial-gradient(ellipse at 50% 0%, var(--ac-wash), transparent 72%),
            #fff;
        }

        .face.back::before {
          content: "";
          position: absolute;
          inset: 0;
          pointer-events: none;
          background:
            linear-gradient(
              135deg,
              rgba(var(--ac-rgb), .055),
              transparent 42%,
              rgba(var(--ac-rgb), .035)
            );
        }

        /* A single soft sheen when the card is revealed */
        .face.back::after {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 5;
          pointer-events: none;
          opacity: 0;
          background: linear-gradient(
            110deg,
            transparent 25%,
            rgba(255, 255, 255, .5) 45%,
            rgba(var(--ac-rgb), .08) 50%,
            transparent 68%
          );
          transform: translateX(-120%);
        }

        .card.flipped .face.back::after {
          animation: back-sheen .85s ease-out .38s 1 both;
        }

        @keyframes back-sheen {
          0% {
            opacity: 0;
            transform: translateX(-120%);
          }
          20% {
            opacity: .8;
          }
          100% {
            opacity: 0;
            transform: translateX(120%);
          }
        }


        .face.back > * {
          position: relative;
        }

        .face.back > .keyline {
          position: absolute;
        }

        .b-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          min-width: 0;
        }

        .b-name {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-family: var(--serif);
          font-size: 27px;
          line-height: 1.05;
        }

        /* ---------- exotic score number (cosmic) ---------- */
        .b-hp { position: relative; flex: none; line-height: 1; }

        .b-hp b {
          position: relative;
          display: inline-block;
          font-family: "Anton", Impact, "Arial Narrow Bold", sans-serif;
          font-weight: 400;
          font-size: 20px;
          line-height: 1;
          letter-spacing: .03em;
          font-variant-numeric: lining-nums;
          transform: skewX(-6deg);
          color: #7a5cff;
          -webkit-text-stroke: .5px #1a0b4d;
          background:
            radial-gradient(1.5px 1.5px at 18% 24%, #fff 98%, transparent),
            radial-gradient(1.5px 1.5px at 62% 16%, #fff 98%, transparent),
            radial-gradient(1.5px 1.5px at 36% 60%, #fff 98%, transparent),
            radial-gradient(1.5px 1.5px at 80% 68%, #fff 98%, transparent),
            radial-gradient(1.5px 1.5px at 52% 88%, #fff 98%, transparent),
            linear-gradient(165deg, #8fe9ff 0%, #6a7bff 28%, #a24dff 55%, #ff4fb0 80%, #ffb347 100%);
          -webkit-background-clip: text;
                  background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 3px rgba(150,120,255,.9))
                  drop-shadow(0 0 10px color-mix(in srgb, var(--ac, #8a5cff) 60%, transparent));
        }




        .back-title {
          margin-top: 5px;
          font-family: var(--serif);
          font-style: italic;
          font-size: 14px;
          line-height: 1.2;
          color: var(--ac-deep);
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
        }

        .back-rule {
          display: flex;
          align-items: center;
          gap: 8px;
          height: 1px;
          flex-shrink: 0;
          margin: 15px 0 16px;
          background: rgba(var(--ac-rgb), .24);
        }

        /* Three abilities occupy equal vertical space */
        .moves {
          list-style: none;
          display: grid;
          grid-template-rows: repeat(3, minmax(0, 1fr));
          gap: 0;
          flex: 1;
          min-height: 0;
        }

        .moves li {
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-width: 0;
          padding: 9px 0 10px;
          border-bottom: 1px solid rgba(var(--ac-rgb), .13);
        }

        .moves li:last-child {
          border-bottom: 0;
        }

        .m-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          min-width: 0;
        }

        .m-name {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-family: var(--serif);
          font-size: 19px;
          line-height: 1.15;
        }

        /* Long ability names step down a size and may wrap to a second line,
           so the full name always stays inside the card */
        .moves li.long .m-name {
          font-size: 16px;
          white-space: normal;
          line-height: 1.1;
        }

        .m-pow {
          flex-shrink: 0;
          font: 700 13px var(--mono);
          font-variant-numeric: tabular-nums;
          color: var(--text-main);
        }

        /* Clean, contained power meter */
        .m-bar {
          position: relative;
          width: 100%;
          height: 4px;
          flex-shrink: 0;
          margin-top: 9px;
          background: rgba(var(--ac-rgb), .13);
          border-radius: 99px;
          overflow: hidden;
        }

        .m-bar i {
          display: block;
          width: 100%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(
            90deg,
            var(--ac-deep),
            var(--ac),
            var(--ac-pale)
          );
          transform: scaleX(0);
          transform-origin: left center;
          transition: transform .7s cubic-bezier(.2, .7, .25, 1);
        }

        /* Bars fill after the card turns, with a small stagger */
        .card.flipped .m-bar i {
          transform: scaleX(var(--w));
          transition-delay: calc(.48s + var(--k) * .12s);
        }

        /* Maximum power: 100/100 */
        .moves li.max .m-pow {
          color: var(--ac-deep);
        }

        .moves li.max .m-bar i {
          background: linear-gradient(
            90deg,
            var(--ac),
            var(--ac-pale),
            #fff
          );
          box-shadow: 0 0 5px rgba(var(--ac-rgb), .35);
        }

        /* Overpowered ability: reserved red treatment */
        .moves li.over .m-name,
        .moves li.over .m-pow {
          color: #d83c2e;
        }

        .moves li.over .m-bar {
          background: rgba(216, 60, 46, .12);
        }

        .moves li.over .m-bar i {
          background: linear-gradient(90deg, #d83c2e, #ff795b);
          box-shadow: 0 0 8px rgba(216, 60, 46, .22);
        }

        /* Unknown ability: dashed meter and question mark */
        .moves li.mystery .m-name {
          color: var(--text-muted);
          font-style: italic;
        }

        .moves li.mystery .m-pow {
          color: #aaa;
        }

        .moves li.mystery .m-bar {
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: visible;
          background: transparent;
          border: 1px dashed rgba(var(--ac-rgb), .55);
          border-radius: 99px;
        }

        .moves li.mystery .m-bar::after {
          content: "?";
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          padding: 0 5px;
          background: #fff;
          color: var(--ac-deep);
          font: 700 9px var(--mono);
          line-height: 1;
        }

        .moves li.mystery .m-bar i {
          display: none;
        }

        /* Small screens */
        @media (max-width: 640px) {
          .face.back {
            padding: 15px 13px 12px;
          }

          .b-name {
            font-size: 22px;
          }

          .b-hp b {
            font-size: 18px;
          }

          .back-title {
            font-size: 12px;
          }

          .back-rule {
            margin: 11px 0 10px;
          }

          .moves li {
            padding: 7px 0 8px;
          }

          .m-name {
            font-size: 16px;
          }

          .m-pow {
            font-size: 12px;
          }

          .m-bar {
            margin-top: 7px;
            height: 3px;
          }
        }

        /* ================================================================
       PER-CARD EFFECTS: always running. hover makes them react.
       ================================================================ */
    .fx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}

    /* ---------- ajchapa: crown, halo, embers, foil sweep ---------- */
    .crown{
      position:absolute;z-index:8;left:50%;top:-21px;width:54px;height:41px;margin-left:-27px;
      pointer-events:none;filter:drop-shadow(0 6px 8px rgba(120,84,10,.35));
      transition:transform .6s cubic-bezier(.2,.7,.25,1),opacity .3s ease;
      animation:float 4s ease-in-out infinite;
    }
    @keyframes float{50%{margin-top:-4px}}
    .crown svg{width:100%;height:100%;display:block}
    .card:hover .crown{transform:translateY(-8px) rotate(-3deg) scale(1.08)}
    .card.flipped .crown{opacity:0}
    .halo{
      position:absolute;inset:-14px;z-index:-1;pointer-events:none;
      opacity:.9;transform:scale(1);transition:transform .6s cubic-bezier(.2,.7,.25,1);
    }
    .card:hover .halo{transform:scale(1.07)}
    .halo::before{
      content:"";position:absolute;inset:10px;border-radius:30px;
      background:conic-gradient(from 20deg,#fff1bd,#e0a82e,#c9a227,#ffe9a0,#d9a83a,#fff1bd);
      filter:blur(22px);opacity:.42;animation:aura 3.4s ease-in-out infinite;
    }
    @keyframes aura{50%{opacity:.78;transform:scale(1.05)}}
    .ember{
      position:absolute;bottom:4%;left:var(--x);width:4px;height:4px;border-radius:50%;
      background:#f6d77a;box-shadow:0 0 8px 2px rgba(246,215,122,.85);opacity:0;
      animation:ember var(--t) linear infinite;animation-delay:var(--dl);
    }
    @keyframes ember{
      0%{opacity:0;transform:translate(0,0) scale(1)}
      15%{opacity:1}
      100%{opacity:0;transform:translate(var(--dx),-240px) scale(.3)}
    }
    .fx-aura::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 90% at 50% 100%,rgba(255,214,102,.3),transparent 60%);
    }
    .fx-aura .foil{
      position:absolute;top:-10%;bottom:-10%;width:42%;left:-60%;
      background:linear-gradient(100deg,transparent,rgba(255,236,170,.5),transparent);
      transform:skewX(-14deg);animation:foil 5s ease-in-out infinite;
    }
    .card:hover .fx-aura .foil{animation-duration:2.4s}
    @keyframes foil{0%{left:-60%}40%,100%{left:130%}}

    /* ---------- alex: game HUD, auto-playing ---------- */
    .fx-aim .agrid{
      position:absolute;inset:0;
      background-image:
        linear-gradient(rgba(var(--ac-rgb),.5) 1px,transparent 1px),
        linear-gradient(90deg,rgba(var(--ac-rgb),.5) 1px,transparent 1px);
      background-size:30px 30px;
      -webkit-mask-image:radial-gradient(circle 80px at var(--fx,50%) var(--fy,50%),#000 0%,transparent 100%);
      mask-image:radial-gradient(circle 80px at var(--fx,50%) var(--fy,50%),#000 0%,transparent 100%);
    }
    .fx-aim::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 36px rgba(var(--ac-rgb),.4)}
    .reticle{
      position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;
      transition:transform .7s cubic-bezier(.4,0,.2,1);will-change:transform;color:#fff;
      filter:drop-shadow(0 0 3px rgba(var(--ac-rgb),.95));
    }
    .reticle.live{transition:transform .09s linear}
    .reticle svg{width:100%;height:100%;display:block;animation:lock 2.4s ease-in-out infinite}
    @keyframes lock{50%{transform:scale(.86)}}
    .hud{position:absolute;left:12px;right:12px;bottom:12px;display:grid;gap:5px}
    .hud .bar{height:6px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden;transform:skewX(-18deg)}
    .hud .bar i{display:block;height:100%;width:100%;transform-origin:left;animation:fill 1.4s cubic-bezier(.2,.7,.25,1) both}
    .hud .shield i{background:linear-gradient(90deg,#4aa3ff,#9fd0ff)}
    .hud .hp i{background:linear-gradient(90deg,#34c76f,#8ef0b4);animation-delay:.2s}
    @keyframes fill{from{transform:scaleX(0)}}
    .burst{
      position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
      border:2px solid var(--ac);animation:burst .55s ease-out forwards;
    }
    @keyframes burst{to{transform:scale(7);opacity:0}}
    .hit{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;animation:hit .5s ease-out forwards}
    .hit::before,.hit::after{
      content:"";position:absolute;left:50%;top:50%;width:22px;height:2px;margin:-1px 0 0 -11px;
      background:#fff;box-shadow:0 0 5px var(--ac);
    }
    .hit::before{transform:rotate(45deg)}
    .hit::after{transform:rotate(-45deg)}
    @keyframes hit{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
    .feed{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .feed-item{
      font:800 9px var(--font);letter-spacing:.14em;text-transform:uppercase;color:#fff;
      background:rgba(18,56,128,.8);padding:4px 8px;border-left:2px solid #8ec2ff;
      animation:feed 1.8s ease forwards;
    }
    @keyframes feed{
      0%{opacity:0;transform:translateX(18px)}
      12%{opacity:1;transform:none}
      80%{opacity:1}
      100%{opacity:0}
    }

    /* ---------- kush: live spreadsheet, auto-running ---------- */
    .fx-sheet{font-family:var(--mono);font-size:9px;color:var(--ac-deep)}
    .sh-bar{
      position:absolute;left:0;right:0;top:0;height:20px;display:flex;align-items:center;gap:6px;padding:0 6px;
      background:rgba(255,255,255,.86);border-bottom:1px solid rgba(var(--ac-rgb),.5);
    }
    .sh-name{min-width:30px;padding:1px 6px;border:1px solid rgba(var(--ac-rgb),.5);background:#fff;text-align:center;color:#12432a}
    .sh-fxl{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ac-deep)}
    .sh-formula{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#12432a}
    .sh-cols{
      position:absolute;left:20px;right:0;top:20px;height:16px;display:flex;overflow:hidden;
      background:rgba(244,252,247,.78);border-bottom:1px solid rgba(var(--ac-rgb),.5);
    }
    .sh-cols span{flex:0 0 40px;text-align:center;line-height:16px;border-right:1px solid rgba(var(--ac-rgb),.35)}
    .sh-rows{
      position:absolute;left:0;top:20px;bottom:0;width:20px;overflow:hidden;padding-top:16px;
      background:rgba(244,252,247,.78);border-right:1px solid rgba(var(--ac-rgb),.5);
    }
    .sh-rows span{display:block;height:26px;line-height:26px;text-align:center;border-bottom:1px solid rgba(var(--ac-rgb),.35)}
    .sh-cols span.on,.sh-rows span.on{background:var(--ac-pale);color:#0d3a21;font-weight:700}
    .sh-grid{
      position:absolute;left:20px;top:36px;right:0;bottom:0;
      background-image:
        linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
      background-size:40px 26px;
    }
    .sh-sel{
      position:absolute;left:20px;top:36px;width:40px;height:26px;border:2px solid var(--ac);
      background:rgba(var(--ac-rgb),.26);transition:transform .18s ease-out;
    }
    .sh-sel::after{content:"";position:absolute;right:-4px;bottom:-4px;width:6px;height:6px;background:var(--ac);border:1px solid #fff}
    .sh-chart{
      position:absolute;right:8px;bottom:8px;height:42px;display:flex;align-items:flex-end;gap:4px;
      padding:6px 8px;background:rgba(255,255,255,.82);border:1px solid rgba(var(--ac-rgb),.5);border-radius:6px;
    }
    .sh-chart i{
      display:block;width:7px;height:var(--h);background:linear-gradient(180deg,var(--ac),var(--ac-deep));border-radius:2px 2px 0 0;
      transform-origin:bottom;animation:grow 3.2s cubic-bezier(.2,.7,.25,1) infinite;
      animation-delay:calc(var(--k) * .12s);
    }
    @keyframes grow{0%{transform:scaleY(.15)}30%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}

    /* ---------- mae: crafts — glitter, stitching, tape, and a felt orangutan ---------- */
    .c-pink .face{box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 44px -20px rgba(255,61,154,.55),0 0 0 1px rgba(255,255,255,.6) inset}
    /* mae's name: solid deep pink, no sweep */
    .c-pink .plate .name,.c-pink .b-name{color:#c2185b}

    .fx-craft::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 80% at 50% 100%,rgba(var(--ac-rgb),.28),transparent 62%);
      box-shadow:inset 0 0 34px rgba(var(--ac-rgb),.28);
    }
    .fx-craft .glit{
      position:absolute;inset:0;
      background-image:
        radial-gradient(circle,#fff 0 1.1px,transparent 1.8px),
        radial-gradient(circle,#ffd1e8 0 1.1px,transparent 1.8px),
        radial-gradient(circle,#fff3bd 0 1.1px,transparent 1.8px);
      background-size:31px 29px,43px 41px,57px 53px;
      background-position:3px 5px,17px 22px,29px 9px;
      animation:glit 2.2s ease-in-out infinite;
    }
    .fx-craft .glit.b{
      background-size:37px 33px,47px 45px,59px 51px;
      background-position:19px 17px,5px 8px,41px 31px;
      animation-delay:-1.1s;
    }
    .card:hover .fx-craft .glit{animation-duration:1s}
    @keyframes glit{0%,100%{opacity:.1}50%{opacity:.85}}
    .fx-craft .dust{
      position:absolute;left:var(--x);top:-4%;width:4px;height:4px;border-radius:50%;
      background:#fff;box-shadow:0 0 6px 2px rgba(255,61,154,.6);opacity:0;
      animation:dust var(--t) linear infinite;animation-delay:var(--dl);
    }
    .fx-craft .dust.gold{box-shadow:0 0 6px 2px rgba(240,190,60,.75);background:#fff6c9}
    @keyframes dust{
      0%{opacity:0;transform:translate(0,0)}
      10%{opacity:1}
      50%{transform:translate(8px,130px)}
      90%{opacity:1}
      100%{opacity:0;transform:translate(-6px,260px)}
    }
    .fx-craft .stitch{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 3px rgba(255,61,154,.8))}
    .fx-craft .stitch rect{
      width:calc(100% - 14px);height:calc(100% - 14px);
      fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 6;
      animation:stitchmove 1.6s linear infinite;
    }
    @keyframes stitchmove{to{stroke-dashoffset:-24}}
    .fx-craft .tape{
      position:absolute;width:74px;height:20px;z-index:4;
      background:repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 5px,rgba(255,61,154,.62) 5px 10px);
      box-shadow:0 2px 4px rgba(120,10,60,.25);
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 4px,#000 calc(100% - 4px),transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 4px,#000 calc(100% - 4px),transparent 100%);
    }
    .fx-craft .tape.t1{top:12px;left:-18px;transform:rotate(-38deg)}
    .fx-craft .tape.t2{bottom:12px;right:-18px;transform:rotate(-38deg)}
    .fx-craft .spk{
      position:absolute;left:var(--x);top:var(--y);
      width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      background:radial-gradient(circle,#fff 0 25%,#ffd1e8 60%,#ff3d9a 100%);
      clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
      pointer-events:none;
    }
    .fx-craft .spk.gold{background:radial-gradient(circle,#fff 0 25%,#fff0b0 55%,#e0a82e 100%)}
    .fx-craft .spk.twinkle{animation:twinkle 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
    .fx-craft .spk.pop{animation:pop .85s ease-out forwards}
    @keyframes pop{
      0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}
      100%{transform:translate(var(--dx,0),var(--dy,18px)) scale(1) rotate(200deg);opacity:0}
    }

    /* the felt orangutan, hanging off the top edge of mae's card */
    .orang{
      position:absolute;z-index:8;top:-6px;right:0px;width:66px;height:89px;pointer-events:none;
      transform-origin:69% 6.5%;
      animation:swing 3.6s ease-in-out infinite;
      filter:drop-shadow(0 8px 7px rgba(120,20,60,.35));
      transition:opacity .3s ease;
    }
    .orang svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .orang{animation-duration:1.5s}
    .card.flipped .orang{opacity:0}
    @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .orang .f{fill:#f07a1c;stroke:#a8480b;stroke-width:2.2;stroke-linejoin:round}
    .orang .s{fill:none;stroke:#ffe0b8;stroke-width:1;stroke-dasharray:3 2.6;stroke-linecap:round}
    .orang .belly{fill:#ffa24d;stroke:#ffe0b8;stroke-width:1;stroke-dasharray:3 2.6}
    .orang .fur{stroke:#ffe0b8;stroke-width:1;stroke-linecap:round;fill:none}
    .orang .eye{fill:#3b1a08;transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
    .orang .waveL{transform-origin:28px 62px}
    .card:hover .orang .waveL{animation:wave .55s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
    .orang .legs{transform-origin:42px 90px;animation:kick 3.6s ease-in-out infinite}
    @keyframes kick{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}

    @media (prefers-reduced-motion:reduce){
      .c-pink .plate .name,.c-pink .b-name,.fx-craft .stitch rect,.fx-craft .spk.twinkle,.fx-craft .glit,
      .orang,.orang .eye,.orang .legs,.card:hover .orang .waveL{animation:none}
      .fx-craft .spk.twinkle{transform:none;opacity:1}
      .fx-craft .glit{opacity:.5}
      .fx-craft .dust{display:none}
    }
    @media (prefers-reduced-motion:reduce){
      .c-money .plate .name,.c-money .b-name,.fx-money .bill,.fx-money .coin,
      .c-style .plate .name,.c-style .b-name,.fx-drink .wave,.fx-drink .bub,.fx-drink .glint,
      .pistol,.book,.pot,.tee,.tee .flame,.martini,.martini .liq{animation:none}
      .fx-money .bill,.fx-money .coin{display:none}
      .fx-golf .glow,.fx-golf .fly,.fx-golf .arc,.fx-golf .ball,.fx-golf .arc::before{animation:none}
      .fx-golf .fly{display:none}
      .fx-drink .bub{display:none}
      .fx-drink .glint{transform:none;opacity:1}
    }

    /* ================================================================
       MIJO: money — dollar-bill olive + gold, falling bills, coins,
       and a little pistol riding the top edge like the crown.
       ================================================================ */
    /* mijo's name: deep green with a light sweep (no gold — that's ajchapa's) */
    /* the J's descender needs room, but the name must sit EXACTLY where every
       other card's name sits: padding opens space inside the clip box, and the
       negative margin pulls the layout box back by the same amount, so the
       position doesn't move a pixel */
    /* mijo's name: solid deep green, no sweep */
    .c-money .plate .name,.c-money .b-name{
      color:#1f3d12;
      padding-bottom:.12em;margin-bottom:-.12em; /* room for the J's descender */
    }

    /* ajchapa's name: the same dark ink as every other card's name (#111),
       with a gold light sweeping across — his signature, front and back.
       includes the invisible descender room so the j never clips. */
    .c-gold .plate .name,.c-gold .b-name{
      background:linear-gradient(100deg,#111 0%,#111 42%,#ffe9a3 47%,#fffbe8 50%,#ffe9a3 53%,#111 58%,#111 100%);
      background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
      animation:goldshine 6s linear infinite;
      padding-bottom:.12em;margin-bottom:-.12em;
    }
    @keyframes goldshine{from{background-position:100% 0}to{background-position:0% 0}}
    @media (prefers-reduced-motion:reduce){
      .c-gold .plate .name,.c-gold .b-name{animation:none}
    }

    .fx-money::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 80% at 50% 100%,rgba(201,162,39,.28),transparent 62%);
      box-shadow:inset 0 0 34px rgba(var(--ac-rgb),.28);
    }
    .fx-money .bill{
      position:absolute;left:var(--x);top:-12%;width:34px;height:16px;border-radius:2px;opacity:0;
      display:grid;place-items:center;
      background:linear-gradient(135deg,#a9cd88,#5b8a3c);border:1px solid #2f5a1f;
      box-shadow:0 2px 4px rgba(20,50,10,.28);
      animation:billfall var(--t) ease-in-out infinite;animation-delay:var(--dl);
    }
    .fx-money .bill::before{content:"";position:absolute;inset:2px;border:1px solid rgba(255,255,255,.4);border-radius:1px}
    .fx-money .bill b{position:relative;font:700 9px var(--mono);color:#1f3d12}
    @keyframes billfall{
      0%{opacity:0;transform:translate(0,0) rotate(0)}
      10%{opacity:.95}
      50%{transform:translate(calc(var(--dx) * -.6),120px) rotate(calc(var(--r) * .5))}
      90%{opacity:.9}
      100%{opacity:0;transform:translate(var(--dx),270px) rotate(var(--r))}
    }
    .fx-money .coin{
      position:absolute;left:var(--x);top:-8%;width:15px;height:15px;border-radius:50%;opacity:0;
      background:radial-gradient(circle at 35% 30%,#fff3b8,#e0a82e 60%,#a8842f);border:1px solid #8a6a1f;
      box-shadow:0 0 6px 1px rgba(246,215,122,.6);
      animation:coinfall var(--t) linear infinite;animation-delay:var(--dl);
    }
    @keyframes coinfall{
      0%{opacity:0;transform:translate(0,0) perspective(80px) rotateY(0)}
      10%{opacity:1}
      90%{opacity:1}
      100%{opacity:0;transform:translate(var(--dx),270px) perspective(80px) rotateY(1080deg)}
    }
    .card:hover .fx-money .bill,.card:hover .fx-money .coin{animation-duration:calc(var(--t) * .55)}
    .fx-money .cpop{
      position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff3b8,#e0a82e 60%,#a8842f);border:1px solid #8a6a1f;
      animation:cpop .9s ease-out forwards;
    }
    @keyframes cpop{
      0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}
      100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(540deg);opacity:0}
    }

    /* the little pistol: sits on the top edge, like the crown */
    .pistol{
      position:absolute;z-index:8;left:50%;top:-26px;width:66px;height:46px;margin-left:-33px;pointer-events:none;
      filter:drop-shadow(0 6px 7px rgba(20,25,15,.38));
      transform-origin:30% 80%;
      transition:transform .6s cubic-bezier(.2,.7,.25,1),opacity .3s ease;animation:gunfloat 4s ease-in-out infinite;
    }
    @keyframes gunfloat{50%{margin-top:-5px}}
    .pistol svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .pistol{transform:translateY(-8px) rotate(-8deg) scale(1.1)}
    .card.flipped .pistol{opacity:0}

    /* ================================================================
       GARYBOY: the DLC card. dark, mono, sharp corners, its own species.
       everything here is scoped to .c-dlc so the GOAT cards are untouched.
       ================================================================ */
    .c-dlc .face{
      border-radius:18px;
      background:radial-gradient(120% 70% at 50% 0%,var(--ink2),var(--ink) 70%);
      box-shadow:0 1px 2px rgba(0,0,0,.08),0 26px 44px -22px rgba(60,20,130,.55);
    }

    
    .brk{position:absolute;inset:8px;pointer-events:none;z-index:7}
    .brk i{position:absolute;width:12px;height:12px;border:0 solid rgba(var(--ac-rgb),.85)}
    .brk i:nth-child(1){left:0;top:0;border-width:1px 0 0 1px}
    .brk i:nth-child(2){right:0;top:0;border-width:1px 1px 0 0}
    .brk i:nth-child(3){left:0;bottom:0;border-width:0 0 1px 1px}
    .brk i:nth-child(4){right:0;bottom:0;border-width:0 1px 1px 0}

    
    .c-dlc .photo-wrap{background:var(--ink2);isolation:isolate}
    .c-dlc .photo-wrap img{
      filter:saturate(.9) contrast(1.06) drop-shadow(0 0 0 rgba(255,0,120,0)) drop-shadow(0 0 0 rgba(0,200,255,0));
    }
    .c-dlc .photo-wrap::before{
      content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(160deg,rgba(var(--ac-rgb),.55),rgba(50,14,110,.45));mix-blend-mode:soft-light;
    }
    .c-dlc .photo-wrap::after{height:34%;z-index:2;background:linear-gradient(to top,var(--ink),transparent)}
    .c-dlc .sheen{
      z-index:4;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 55%),
        linear-gradient(115deg,transparent calc(var(--mx,50%) - 22%),rgba(var(--ac-rgb),.3) var(--mx,50%),transparent calc(var(--mx,50%) + 22%));
    }
    .c-dlc .photo-wrap.empty{background:radial-gradient(120% 90% at 50% 20%,var(--ac-line),var(--ink))}
    .c-dlc .photo-wrap.empty::before,.c-dlc .photo-wrap.empty::after{display:none}
    .c-dlc .photo-wrap .initial{font-style:normal;color:rgba(var(--ac-rgb),.55)}
    .c-dlc:hover .photo-wrap img{animation:split .5s steps(3) 1}
    @keyframes split{
      0%{filter:saturate(.9) contrast(1.06) drop-shadow(4px 0 0 rgba(255,0,120,.55)) drop-shadow(-4px 0 0 rgba(0,200,255,.55))}
      45%{filter:saturate(.9) contrast(1.06) drop-shadow(-3px 0 0 rgba(255,0,120,.45)) drop-shadow(3px 0 0 rgba(0,200,255,.45))}
      100%{filter:saturate(.9) contrast(1.06) drop-shadow(0 0 0 rgba(255,0,120,0)) drop-shadow(0 0 0 rgba(0,200,255,0))}
    }
    .c-dlc .chip{
      position:absolute;top:15px;left:15px;z-index:5;font:800 9px var(--font);letter-spacing:.16em;text-transform:uppercase;
      padding:4px 8px;line-height:1;background:var(--ac);color:var(--ink);
    }

    /* front: plate */
    .c-dlc .plate{background:none}
    .c-dlc .plate .name{font-size:28px;letter-spacing:-.02em;color:var(--paper);line-height:1.3;padding-bottom:.05em}
    .c-dlc .plate .title{font-style:normal;font-size:10px;letter-spacing:.02em;text-transform:uppercase;line-height:1.2}
    .c-dlc .plate .title::before{transform:none}
    .c-dlc .meta{display:flex;justify-content:flex-end;align-items:center;font:700 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
    .c-dlc .meta .hint{display:flex;align-items:center;gap:5px;color:var(--ac-deep);transition:color .3s ease}
    .c-dlc .meta .hint b{font-weight:700;font-size:10px;display:inline-block;animation:nudge 3.6s ease-in-out infinite}
    .c-dlc:hover .meta .hint{color:#fff}
    /* lift just the flip hint a breath — the name and title don't move a pixel */
    .c-dlc .meta{transform:translateY(-4px)}

    /* back: scanlines, mono type, segmented bars */
    .c-dlc .face.back{
      padding:20px 17px 15px;
      background:radial-gradient(120% 70% at 50% 0%,var(--ink2),var(--ink) 70%);
    }
    .c-dlc .face.back::before{background:repeating-linear-gradient(to bottom,rgba(var(--ac-rgb),.05) 0 1px,transparent 1px 3px)}
    .c-dlc .face.back::after{
      background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 45%,rgba(var(--ac-rgb),.18) 50%,transparent 68%);
    }
    .c-dlc .face.back > .brk{position:absolute}
    .c-dlc .b-name{font-size:22px;letter-spacing:-.02em;color:var(--paper);line-height:1.3;padding-bottom:.05em}
    .c-dlc .back-title{margin-top:5px;font-style:normal;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase}
    .c-dlc .back-rule{margin:14px 0 6px;background:rgba(var(--ac-rgb),.3)}
    .c-dlc .moves li{padding:8px 0 9px;border-bottom-color:rgba(var(--ac-rgb),.14)}
    .c-dlc .m-name{font-size:14px;letter-spacing:.04em;color:var(--paper)}
    .c-dlc .m-name em{
      font:700 7.5px var(--mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle;
      margin-left:8px;padding:2px 5px;color:#ff8fa0;border:1px solid rgba(255,143,160,.55);
    }
    .c-dlc .m-pow{color:var(--paper)}
    .seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:8px}
    .seg i{position:relative;height:5px;background:rgba(var(--ac-rgb),.17)}
    .seg i.on::after{content:"";position:absolute;inset:0;background:var(--ac);opacity:0;transition:opacity .15s ease}
    .card.flipped .seg i.on::after{opacity:1;transition-delay:calc(.5s + var(--k) * .14s + var(--s) * .03s)}
    .c-dlc .moves li.max .m-pow{color:var(--ac-pale)}
    .c-dlc .moves li.max .seg i.on::after{background:var(--ac-pale)}
    .c-dlc .moves li.bug .m-pow{color:#ff8fa0}
    .c-dlc .moves li.bug .seg i.on::after{background:#ff6b81}

    /* ---------- garyboy: purple haze + scanlines, auto-running ---------- */
    .fx-haze{opacity:.9;transition:opacity .5s ease,transform .8s cubic-bezier(.2,.7,.25,1)}
    .fx-haze::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(var(--ac-rgb),.28),transparent 65%);
    }
    .fx-haze .puff{
      position:absolute;left:var(--x);top:var(--y);width:70%;height:50%;border-radius:50%;
      background:radial-gradient(closest-side,rgba(var(--ac-rgb),.7),rgba(var(--ac-rgb),.22) 55%,transparent);
      filter:blur(18px);opacity:.35;mix-blend-mode:screen;
      animation:haze var(--t) ease-in-out infinite;animation-delay:var(--dl);
    }
    @keyframes haze{
      0%,100%{transform:translate(0,0) scale(.9);opacity:.2}
      50%{transform:translate(var(--dx),-14%) scale(1.15);opacity:.6}
    }
    .fx-haze .scan{
      position:absolute;inset:0;
      background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);
    }
    .fx-haze .scan::after{
      content:"";position:absolute;left:0;right:0;top:0;height:28%;
      background:linear-gradient(to bottom,transparent,rgba(var(--ac-rgb),.3),transparent);
      animation:scanmove 6.5s linear infinite;
    }
    @keyframes scanmove{from{transform:translateY(-100%)}to{transform:translateY(380%)}}
    .c-dlc:hover .fx-haze{opacity:1;transform:scale(1.05)}
    .c-dlc:hover .fx-haze .scan::after{animation-duration:2.4s}

    /* ================================================================
       HELEN: ember palette on the dlc skeleton. her card carries both
       c-ember (her colors) and c-dlc (the dark-card structure), so every
       dlc rule applies and only the palette vars need overriding here.
       (this block sits after .c-dlc so her vars win)
       ================================================================ */
    .c-ember{--ac:#ff7a45;--ac-deep:#ffb08a;--ac-pale:#ffe0d0;--ac-rgb:255,122,69;--ac-wash:#2a140c;--ac-line:#5c2e1c;
      --ink:#1a0d08;--ink2:#2a140c;--paper:#fff1e8;
      --mono:'Space Mono',Menlo,Monaco,Consolas,monospace;--font:var(--mono);--serif:var(--mono)}
    /* keep garyboy's back exactly as it was — the shared long-name rule must not shrink his moves */
    .c-dlc .moves li.long .m-name{font-size:14px;white-space:nowrap;line-height:1.15;letter-spacing:.04em}
    /* long move names step down a size so they always fit (ember only — garyboy untouched) */
    .c-ember .moves li.long .m-name{font-size:11px;letter-spacing:.02em}
    /* no "known issue" tag on helen's card */
    .c-ember .m-name em{display:none}
    /* no pink low-stat value either — gluten's 0 matches her other stats */
    .c-ember .moves li.bug .m-pow{color:var(--paper)}

    /* the book: small, bottom right of the photo area, gently floating */
    .book{
      position:absolute;right:16px;bottom:18px;width:40px;height:44px;
      filter:drop-shadow(0 0 8px rgba(var(--ac-rgb),.55));
      animation:bookfloat 4.5s ease-in-out infinite;
      transition:transform .5s cubic-bezier(.2,.7,.25,1);
    }
    .book svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .book{transform:rotate(-8deg) scale(1.1)}
    @keyframes bookfloat{50%{translate:0 -5px}}

    /* the weed pot: small, bottom right of the photo area, gently floating */
    .pot{
      position:absolute;right:16px;bottom:18px;width:40px;height:46px;
      filter:drop-shadow(0 0 8px rgba(var(--ac-rgb),.55));
      animation:potfloat 4.5s ease-in-out infinite;
      transition:transform .5s cubic-bezier(.2,.7,.25,1);
    }
    .pot svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .pot{transform:rotate(-6deg) scale(1.1)}
    @keyframes potfloat{50%{translate:0 -5px}}

    /* ── kelketra: flying golden balls, on fire ── */
    .fx-golf::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 80% at 50% 100%,rgba(249,115,22,.3),transparent 62%);
      box-shadow:inset 0 0 34px rgba(var(--ac-rgb),.28);
    }
    .fx-golf .glow{
      position:absolute;left:-20%;right:-20%;height:45%;bottom:-10%;filter:blur(18px);opacity:.5;
      background:radial-gradient(closest-side,rgba(255,120,30,.9),transparent);animation:glow 5s ease-in-out infinite alternate;
    }
    @keyframes glow{to{transform:translateY(-18%) scale(1.15);opacity:.8}}
    .fx-golf .fly{
      position:absolute;left:0;top:var(--y);opacity:0;
      animation:fly var(--t) linear infinite;animation-delay:var(--dl);
    }
    @keyframes fly{
      0%{transform:translateX(-70px);opacity:0}
      8%{opacity:1}
      92%{opacity:1}
      100%{transform:translateX(380px);opacity:0}
    }
    .fx-golf .arc{
      display:block;position:relative;width:var(--s);height:var(--s);
      animation:arc var(--t) linear infinite;animation-delay:var(--dl);
    }
    @keyframes arc{
      0%{transform:translateY(0);animation-timing-function:ease-out}
      50%{transform:translateY(calc(var(--h) * -1));animation-timing-function:ease-in}
      100%{transform:translateY(0)}
    }
    .fx-golf .ball{
      position:absolute;inset:0;border-radius:50%;
      background:
        radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 14%,transparent 30%),
        radial-gradient(circle,rgba(160,60,0,.45) 0 1px,transparent 1.3px) 0 0/4px 4px,
        radial-gradient(circle at 40% 35%,#ffe4c2,#ff8c1a 55%,#c2410c);
      box-shadow:0 0 8px 2px rgba(255,120,30,.8);
      animation:spin .5s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .fx-golf .arc::before{
      content:"";position:absolute;right:60%;top:50%;width:calc(var(--s) * 3.2);height:calc(var(--s) * .9);margin-top:calc(var(--s) * -.45);
      border-radius:50% 0 0 50%;
      background:linear-gradient(to left,rgba(255,235,200,.95),rgba(255,120,30,.85) 35%,rgba(220,60,10,.5) 70%,transparent);
      filter:blur(2px);transform-origin:right center;animation:flicker .18s ease-in-out infinite alternate;
    }
    @keyframes flicker{from{transform:scaleY(.8) scaleX(.92)}to{transform:scaleY(1.2) scaleX(1.05)}}
    .card:hover .fx-golf .fly,.card:hover .fx-golf .arc{animation-duration:calc(var(--t) * .55)}
    /* fire sparks on click */
    .fx-golf .spark{
      position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;
      background:radial-gradient(circle,#ffe9c9,#ff8c1a 55%,#d93a0a);box-shadow:0 0 8px 2px rgba(255,110,20,.8);
      animation:spark .8s ease-out forwards;
    }
    @keyframes spark{
      0%{transform:translate(0,0) scale(.4);opacity:1}
      100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}
    }

    /* ornament on the top edge: golf ball on a tee, with a little flame */
    .tee{
      position:absolute;z-index:8;left:50%;top:-30px;width:46px;height:52px;margin-left:-23px;pointer-events:none;
      filter:drop-shadow(0 6px 7px rgba(120,60,0,.35));
      transition:transform .6s cubic-bezier(.2,.7,.25,1),opacity .3s ease;animation:teefloat 4s ease-in-out infinite;
    }
    @keyframes teefloat{50%{margin-top:-5px}}
    .tee svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .tee{transform:translateY(-8px) rotate(-5deg) scale(1.1)}
    .card.flipped .tee{opacity:0}
    .tee .flame{transform-origin:23px 16px;animation:flame .35s ease-in-out infinite alternate}
    @keyframes flame{from{transform:scale(.92,.95) skewX(-3deg)}to{transform:scale(1.06,1.08) skewX(3deg)}}

    /* ================================================================
       NOEL: style + drinks. wine fills the card, bubbles rise, glasses clink.
       ================================================================ */
    .fx-drink::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 80% at 50% 100%,rgba(var(--ac-rgb),.22),transparent 62%);
      box-shadow:inset 0 0 34px rgba(var(--ac-rgb),.22);
    }
    /* the wine level: two sloshing waves */
    .fx-drink .liquid{position:absolute;left:0;right:0;bottom:0;height:34%}
    .fx-drink .liquid::after{
      content:"";position:absolute;left:0;right:0;top:16px;bottom:0;
      background:linear-gradient(180deg,rgba(163,34,63,.5),rgba(110,15,38,.7));
    }
    .fx-drink .wave{position:absolute;left:0;top:0;width:200%;height:20px;animation:slosh 6s linear infinite}
    .fx-drink .wave svg{width:100%;height:100%;display:block}
    .fx-drink .wave path{fill:rgba(163,34,63,.5)}
    .fx-drink .wave.w2{top:3px;animation-duration:9s;animation-direction:reverse}
    .fx-drink .wave.w2 path{fill:rgba(130,20,48,.55)}
    @keyframes slosh{to{transform:translateX(-50%)}}
    .card:hover .fx-drink .wave{animation-duration:2.8s}
    .card:hover .fx-drink .wave.w2{animation-duration:4s}
    /* champagne bubbles rising */
    .fx-drink .bub{
      position:absolute;left:var(--x);bottom:-8px;width:var(--s);height:var(--s);border-radius:50%;opacity:0;
      background:radial-gradient(circle at 32% 30%,#fff,rgba(255,236,190,.55) 55%,rgba(255,255,255,.1));
      border:1px solid rgba(255,255,255,.8);box-shadow:0 0 6px rgba(255,230,170,.7);
      animation:rise-b var(--t) ease-in infinite;animation-delay:var(--dl);
    }
    @keyframes rise-b{
      0%{opacity:0;transform:translate(0,0) scale(.6)}
      12%{opacity:.95}
      50%{transform:translate(var(--dx),-120px) scale(1)}
      88%{opacity:.9}
      100%{opacity:0;transform:translate(calc(var(--dx) * -.5),-250px) scale(1.15)}
    }
    .card:hover .fx-drink .bub{animation-duration:calc(var(--t) * .55)}
    /* little champagne glints */
    .fx-drink .glint{
      position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      background:radial-gradient(circle,#fff 0 25%,#fff3c4 60%,#e6c36a 100%);
      clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
      animation:tw 3s ease-in-out infinite;animation-delay:var(--dl);
    }
    @keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
    /* click = champagne pop: bubbles and gold glints burst out */
    .fx-drink .pop{
      position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;
      background:radial-gradient(circle at 32% 30%,#fff,rgba(255,236,190,.6) 60%,rgba(255,255,255,.15));
      border:1px solid rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,230,170,.8);
      animation:pop .9s ease-out forwards;
    }
    .fx-drink .pop.gold{background:radial-gradient(circle,#fff,#f3dfa2 60%,#c9a227);border-color:#e6c36a}
    @keyframes pop{
      0%{transform:translate(0,0) scale(.3);opacity:1}
      100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}
    }
    /* ================================================================
       BANANANANA: host — teal. auggie's paw prints walk up the card,
       and clicking the photo pops a paw-print burst.
       ================================================================ */
    .fx-host::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 100%,rgba(var(--ac-rgb),.26),transparent 62%);box-shadow:inset 0 0 34px rgba(var(--ac-rgb),.24)}
    /* Auggie's paw prints walking up the card: four toes plus the gold extra one */
    .fx-host .pp{position:absolute;left:var(--x);top:var(--y);width:24px;height:24px;margin:-12px 0 0 -12px;transform:rotate(var(--r));opacity:0;color:rgba(255,255,255,.92);animation:step 7.2s ease-in-out infinite;animation-delay:var(--dl);filter:drop-shadow(0 1px 2px rgba(7,81,77,.45))}
    .fx-host .pp svg{width:100%;height:100%;display:block}
    @keyframes step{0%{opacity:0;transform:rotate(var(--r)) scale(.6)}8%{opacity:1;transform:rotate(var(--r)) scale(1)}55%{opacity:.9}80%,100%{opacity:0;transform:rotate(var(--r)) scale(1)}}
    .card:hover .fx-host .pp{animation-duration:3.6s}
    .fx-host .cpop{position:absolute;width:var(--w);height:var(--w);margin:calc(var(--w) / -2) 0 0 calc(var(--w) / -2);color:var(--c);animation:cpop-paw .9s ease-out forwards}
    .fx-host .cpop svg{width:100%;height:100%;display:block}
    @keyframes cpop-paw{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
    /* ornament on the top edge: a martini with an olive, sloshing */
    .martini{
      position:absolute;z-index:8;left:50%;top:-32px;width:54px;height:62px;margin-left:-27px;pointer-events:none;
      filter:drop-shadow(0 6px 7px rgba(90,15,35,.35));
      transform-origin:50% 90%;
      transition:transform .6s cubic-bezier(.2,.7,.25,1),opacity .3s ease;animation:martinifloat 4s ease-in-out infinite;
    }
    @keyframes martinifloat{50%{margin-top:-5px}}
    .martini svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .martini{transform:translateY(-8px) rotate(-9deg) scale(1.1)}
    .card.flipped .martini{opacity:0}
    .martini .liq{transform-origin:27px 30px;animation:tilt 3.2s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    .card:hover .martini .liq{animation-duration:.9s}

    /* Auggie: peeks over the top edge, white paws gripping the card */
    .cat{position:absolute;z-index:8;left:auto;right:-8px;top:-32px;width:96px;height:72px;transform:rotate(5deg);transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 7px 7px rgba(8,40,38,.35));animation:catfloat 4.2s ease-in-out infinite;transition:opacity .3s ease}
    .cat svg{width:100%;height:100%;display:block;overflow:visible}
    @keyframes catfloat{50%{margin-top:-4px}}
    .card.flipped .cat{opacity:0}
    .cat .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .cat .ear-r{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 6s ease-in-out infinite}
    @keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(4deg)}}
    /* the extra toes: a gold glint, so they read as the special part */
    .cat .glint{transform-box:fill-box;transform-origin:center;animation:glint 2.8s ease-in-out infinite}
    .cat .glint.g2{animation-delay:-1.4s}
    @keyframes glint{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
    /* her back is custom: Auggie's portrait sits in the "Love for Auggie" row */
    .moves.has-love{grid-template-rows:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
    .moves.has-love li{padding:5px 0 6px}
    .moves.has-love .m-bar{margin-top:6px}
    .c-host .back-rule{margin:11px 0 6px}
    .moves li.love{flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}
    .love-main{flex:1;min-width:0}
    .bust-wrap{position:relative;flex-shrink:0}
    .bust{position:relative;width:46px;height:46px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff,var(--ac-pale));border:1.5px solid var(--ac);box-shadow:0 0 0 3px rgba(var(--ac-rgb),.14)}
    .bust img{position:absolute;width:170px;max-width:none;left:-86px;top:-3px;display:block}
    .badge{position:absolute;right:-5px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid rgba(229,54,95,.45);display:grid;place-items:center}
    .heart{width:11px;height:11px;fill:#e5365f;animation:beat 1.7s ease-in-out infinite}
    @keyframes beat{0%,38%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1.05)}}
    .moves li.love .m-name{white-space:normal;font-size:16px;line-height:1.05;color:#d6325c}
    .moves li.love .m-pow{color:#d6325c}
    .moves li.love .m-bar{background:rgba(229,54,95,.14)}
    .moves li.love .m-bar i{background:linear-gradient(90deg,#e5365f,#ff8fa8,#ffd1dc);box-shadow:0 0 7px rgba(229,54,95,.4)}
    /* under-construction tape: caution stripes framing a yellow UNDER CONSTRUCTION band */
    .ctape{position:absolute;z-index:5;left:-14%;width:128%;top:46%;padding:5px 0;transform:rotate(12deg);background:repeating-linear-gradient(-45deg,#111 0 10px,#f2c230 10px 20px);box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none}
    .ctape span{display:block;background:#f2c230;color:#111;font:800 11px var(--font);letter-spacing:.14em;text-align:center;padding:3px 0;white-space:nowrap}
    .ctape.ctape2{z-index:4;transform:rotate(-12deg);height:28px;background:repeating-linear-gradient(45deg,#111 0 10px,#f2c230 10px 20px)}
    .ctape-edge{position:absolute;z-index:5;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(-45deg,#111 0 8px,#f2c230 8px 16px);pointer-events:none}
    /* ================= tune mode (?tune) ================= */
    body.tune .card{cursor:grab}

    /* ===== phone fix: stop the front's effects showing through the back ===== */
    .face *{-webkit-backface-visibility:hidden;backface-visibility:hidden}

    .face.front{visibility:visible;transition:visibility 0s 0s}
    .card.flipped .face.front{visibility:hidden;transition:visibility 0s .12s}

    /* back: hidden until the flip starts, hidden again once flipped back */
    .face.back{visibility:hidden;transition:visibility 0s .12s}

    .card.flipped .fx{pointer-events:none}

  /* ---------- build one wall-identical card ---------- */
  function buildCard(g){
    var dlc = g.color === "dlc" || g.color === "ember";

    card.dataset.fx = g.fx || "";
    card.dataset.name = g.name;

      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", g.name + ", " + g.title + ". Activate to flip.");
    } else {
      card.setAttribute("aria-label", g.name + ", " + g.title + ". Under construction.");
    }

    var fx = fxMarkup(g.fx);
    var chip = dlc ? '<span class="chip">DLC</span>' : "";
    var tape = g.locked ? '<div class="ctape ctape2" aria-hidden="true"></div><div class="ctape" aria-hidden="true"><span>\u26a0 UNDER CONSTRUCTION \u26a0 UNDER CONSTRUCTION \u26a0</span></div>' : "";

      ? '<div class="photo-wrap"><img src="'+esc(g.photo)+'" alt="'+esc(g.name)+'" decoding="async" draggable="false">'

      : '<div class="photo-wrap empty"><div class="initial">'+esc(g.name[0])+'</div>'+fx+chip+tape+'</div>';

    var moves = (g.moves || []).map(function(m, k){
      var n = m[0], p = m[1], kind = m[2];
      if (kind === "love") {
        var width = clamp(Number(p) || 0, 0, 100);
        return ''
        + '<li class="love'+(Number(p) === 100 ? " max" : "")+'" style="--k:'+k+'">'
        + '<div class="bust-wrap">'+BUST+'<span class="badge">'+HEART+'</span></div>'
        + '<div class="love-main"><div class="m-row"><span class="m-name">'+esc(n)+'</span><span class="m-pow">'+p+'</span></div>'
        + '<div class="m-bar"><i style="--w:'+(width / 100)+'"></i></div></div></li>';
      }
      var mystery = n === "???";
      var over = !mystery && Number(p) > 100;
      var maximum = !mystery && !over && Number(p) === 100;
      var w = clamp(Number(p) || 0, 0, 100);
      var classes = [
        mystery ? "mystery" : "",
        maximum ? "max" : "",
        over ? "over" : "",
        n.length > 17 ? "long" : ""
      ].filter(Boolean).join(" ");
      return ''
        + '<li class="'+classes+'" style="--k:'+k+'">'
        + '<div class="m-row"><span class="m-name">'+esc(n)+'</span><span class="m-pow">'+(mystery ? "?" : p)+'</span></div>'
        + '<div class="m-bar"><i style="--w:'+(w / 100)+'"></i></div>'
        + '</li>';
    }).join("");

    var SEGS = 20;
    var dlcMoves = dlc ? (g.moves || []).map(function(m, k){
      var n = m[0], p = m[1];
      var isNum = p !== "—" && p !== "" && Number.isFinite(Number(p));
      var power = isNum ? clamp(Number(p), 0, 100) : 0;
      var lit = Math.round(power / 100 * SEGS);
      var bug = isNum && power <= 10;
      var cls = [power === 100 ? "max" : "", bug ? "bug" : "", !isNum ? "pending" : "", n.length > 9 ? "long" : ""].filter(Boolean).join(" ");
      var segs = Array.from({ length: SEGS }, function(_, s){ return '<i class="'+(s < lit ? "on" : "")+'" style="--s:'+s+'"></i>'; }).join("");
      return ''
        + '<li class="'+cls+'" style="--k:'+k+'">'
        + '<div class="m-row"><span class="m-name">'+esc(n)+(bug ? "<em>known issue</em>" : "")+'</span><span class="m-pow">'+p+'</span></div>'
        + '<div class="seg">'+segs+'</div>'
        + '</li>';
    }).join("") : "";

    card.innerHTML = dlc ? ''
      + '<div class="flipper"><div class="tilter">'
      + '<div class="face front">'

      + '<div class="plate"><div class="name">'+esc(g.name)+'</div>'
      + '<div class="title"><span>'+esc(g.title)+'</span></div>'

      + '<div class="b-top"><div class="b-name">'+esc(g.name)+'</div><div class="b-hp"><b data-hp>'+(g.hp == null ? "\u2014" : g.hp)+'</b></div></div>'

      + (g.fx === "golf" && !reduceMotion ? TEE : "")
      + (g.fx === "drink" && !reduceMotion ? MARTINI : "")

      + '<div class="face front">'
      + '<div class="keyline"></div>'+photo
      + '<div class="plate">'
      + '<div class="row"><div class="name">'+esc(g.name)+'</div>'
      + '<div class="flip-hint"><b>\u21bb</b>flip</div></div>'
      + '<div class="title"><span>'+esc(g.title)+'</span></div>'
      + tapeEdge
      + '</div></div>'
      + '<div class="face back">'
      + '<div class="keyline"></div>'
      + '<div class="b-top"><div class="b-name">'+esc(g.name)+'</div>'
      + '<div class="b-hp"><b data-hp>'+(g.hp == null ? "\u2014" : g.hp)+'</b></div></div>'
      + '<div class="back-title">'+esc(g.title)+'</div>'

        img.replaceWith(d);

    var flip = function(){ if (!g.locked) card.classList.toggle("flipped"); };

      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }

    bindFx(card, g.fx);
    bindMoney(card, g.fx);

  /* ---------- a gentle 3D tilt on the hero card (mouse only) ---------- */
  function addTilt(card){
    if (reduceMotion || !matchMedia('(pointer:fine)').matches) return;
    var tilter = card.querySelector('.tilter');
    if (!tilter) return;
    tilter.style.transition = 'transform .18s ease-out';
    card.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - .5;
      var y = (e.clientY - r.top) / r.height - .5;
      tilter.style.transform = 'rotateY(' + (x * 7).toFixed(2) + 'deg) rotateX(' + (-y * 7).toFixed(2) + 'deg)';
    });
    card.addEventListener('pointerleave', function(){ tilter.style.transform = ''; });
  }

  /* ---------- fx interactions (from the wall) ---------- */
  var FEED = ["Eliminated", "Headshot", "Clutch", "Victory"];
  function bindFx(card, kind) {
    var wrap = card.querySelector(".photo-wrap");
    var fx = card.querySelector(".fx");
    if (!fx || reduceMotion) return;

    if (kind === "aim") {
      var ret = fx.querySelector(".reticle");
      var feed = fx.querySelector(".feed");
      var hovering = false, n = 0, lx = 0, ly = 0;
      var move = function(x, y){
        lx = x; ly = y;
        ret.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        fx.style.setProperty("--fx", x + "px");
        fx.style.setProperty("--fy", y + "px");
      };
      var shoot = function(x, y){
        ["burst", "hit"].forEach(function(cls){
          var b = document.createElement("i");
          b.className = cls; b.style.left = x + "px"; b.style.top = y + "px";
          fx.appendChild(b);
          b.addEventListener("animationend", function(){ b.remove(); });
        });
        var item = document.createElement("div");
        item.className = "feed-item";
        item.textContent = FEED[n++ % FEED.length];
        feed.appendChild(item);
        while (feed.children.length > 3) feed.firstChild.remove();
        item.addEventListener("animationend", function(){ item.remove(); });
      };
      var size = function(){ return wrap.getBoundingClientRect(); };
      var t = 0;
      move(size().width * .5, size().height * .4);
      setInterval(function(){
        if (hovering || document.hidden) return;
        var r = size(); t++;
        move(r.width * (.2 + Math.random() * .6), r.height * (.2 + Math.random() * .55));
        if (t % 2 === 0) setTimeout(function(){ if (!hovering) shoot(lx, ly); }, 750);
      }, 1700);
      wrap.addEventListener("pointerenter", function(){ hovering = true; ret.classList.add("live"); });
      wrap.addEventListener("pointerleave", function(){ hovering = false; ret.classList.remove("live"); });
      wrap.addEventListener("pointermove", function(e){
        var r = size(); move(e.clientX - r.left, e.clientY - r.top);
      });
      wrap.addEventListener("click", function(e){
        var r = size(); shoot(e.clientX - r.left, e.clientY - r.top);
      });
    }

    if (kind === "sheet") {
      var sel = fx.querySelector(".sh-sel");
      var nameEl = fx.querySelector(".sh-name");
      var formula = fx.querySelector(".sh-formula");
      var colEls = Array.prototype.slice.call(fx.querySelectorAll(".sh-cols span"));
      var rowEls = Array.prototype.slice.call(fx.querySelectorAll(".sh-rows span"));
      var lc = -1, lr = -1, hov = false;
      var setCell = function(c, rw){
        if (c === lc && rw === lr) return;
        if (lc >= 0) { colEls[lc].classList.remove("on"); rowEls[lr].classList.remove("on"); }
        lc = c; lr = rw;
        colEls[c].classList.add("on"); rowEls[rw].classList.add("on");
        sel.style.transform = 'translate(' + (c * 40) + 'px,' + (rw * 26) + 'px)';
        var addr = LETTERS[c] + (rw + 1);
        nameEl.textContent = addr;
        formula.textContent = '=VLOOKUP(' + addr + ',Wall,2,0)';
      };
      var dims = function(){
        var r = wrap.getBoundingClientRect();
        return { r: r, maxC: Math.max(1, Math.floor((r.width - 20) / 40)), maxR: Math.max(1, Math.floor((r.height - 36) / 26)) };
      };
      setCell(1, 1);
      setInterval(function(){
        if (hov || document.hidden) return;
        var d = dims();
        setCell(Math.floor(Math.random() * d.maxC), Math.floor(Math.random() * d.maxR));
      }, 1000);
      wrap.addEventListener("pointerenter", function(){ hov = true; });
      wrap.addEventListener("pointerleave", function(){ hov = false; });
      wrap.addEventListener("pointermove", function(e){
        var d = dims();
        setCell(
          clamp(Math.floor((e.clientX - d.r.left - 20) / 40), 0, d.maxC - 1),
          clamp(Math.floor((e.clientY - d.r.top - 36) / 26), 0, d.maxR - 1)
        );
      });
    }

    if (kind === "craft") {
      var orang = card.querySelector(".orang");
      var sparkle = function(x, y, o){
        var el = document.createElement("i");
        el.className = "spk pop" + (o.gold ? " gold" : "");
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.setProperty("--s", o.s + "px");
        el.style.setProperty("--dx", o.dx + "px");
        el.style.setProperty("--dy", o.dy + "px");
        fx.appendChild(el);
        el.addEventListener("animationend", function(){ el.remove(); });
      };
      var last = 0;
      wrap.addEventListener("pointermove", function(e){
        var now = performance.now();
        if (now - last < 45) return;
        last = now;
        var r = wrap.getBoundingClientRect();
        sparkle(e.clientX - r.left, e.clientY - r.top,
          { s: rnd(6, 13), dx: rnd(-12, 12), dy: rnd(14, 30), gold: Math.random() < .35 });
      });
      wrap.addEventListener("click", function(e){
        var r = wrap.getBoundingClientRect();
        for (var i = 0; i < 16; i++) {
          sparkle(e.clientX - r.left, e.clientY - r.top,
            { s: rnd(9, 21), dx: rnd(-60, 60), dy: rnd(-60, 60), gold: Math.random() < .4 });
        }
      });
      card.addEventListener("click", function(){
        if (!orang) return;
        var pr = wrap.getBoundingClientRect();
        var or = orang.getBoundingClientRect();
        var ox = or.left - pr.left + or.width / 2;
        var oy = or.top - pr.top + or.height * .55;
        for (var j = 0; j < 18; j++) {
          sparkle(ox + rnd(-16, 16), oy + rnd(-8, 12),
            { s: rnd(7, 15), dx: rnd(-40, 40), dy: rnd(70, 190), gold: Math.random() < .5 });
        }
      });
    }
  }

        }).join('') +
      '</div>' +

        down ? '<p class="m-note" style="text-align:center">The members database is not reachable right now. You can still log in and see your card, but scores, requests, and notifications need the database.</p>' : '') +

  function bindPin(){
    var pins=[].slice.call(app.querySelectorAll('.pin-box'));
    var er=$('#er');
    if(!pins.length) return;
    var submitting=false;
    var value=function(){ return pins.map(function(p){return p.value;}).join(''); };
    var clearWrong=function(){ pins.forEach(function(p){p.classList.remove('wrong');}); };
    var syncFilled=function(){ pins.forEach(function(p){ p.classList.toggle('filled', !!p.value); }); };
    var tryIt=function(){
      if(submitting) return;
      if(!window.GOAT){
        er.textContent='Members scripts didn\u2019t load. Refresh and try again.';
        return;
      }
      var v=value();
      if(v.length!==4) return;
      submitting=true;
      // Verify the code against Firestore (hashed lookup — the code list
      // is never in this page). Resolves the identity or null for a wrong
      // code; rejects when the database is down.
      var verified = (GOAT.verifyCode) ? GOAT.verifyCode(v) : Promise.resolve(null);
      verified.then(function(id){
        if(id){
          GOAT.ensureAuth();
          code=v; profile={name:id.name, title:id.title, photo:id.photo}; identity=id;
          // Admin login needs the two extra codes before the dashboard.
          if(id.admin && !gatePassed()){ renderAdminGate(); return; }
          renderDashboard();
        }else{
          pins.forEach(function(p){p.classList.add('wrong');});
          er.textContent='Wrong code \u2014 try again.';
          setTimeout(function(){
            pins.forEach(function(p){p.value='';p.classList.remove('wrong');});
            er.textContent=''; submitting=false; syncFilled(); pins[0].focus();
          },750);
        }
      }).catch(function(){
        er.textContent='Couldn\u2019t verify right now \u2014 check your connection and try again.';
        setTimeout(function(){
          pins.forEach(function(p){p.value='';p.classList.remove('wrong');});
          er.textContent=''; submitting=false; syncFilled(); pins[0].focus();
        },1500);
      });
    };
    pins.forEach(function(p,i){
      p.oninput=function(){
        p.value=p.value.replace(/\D/g,'').slice(-1);
        clearWrong(); syncFilled();
        if(p.value&&i<3) pins[i+1].focus();
        if(i===3&&p.value) tryIt();
      };
      p.onkeydown=function(e){
        if(e.key==='Backspace'&&!p.value&&i>0){ pins[i-1].focus(); pins[i-1].value=''; syncFilled(); e.preventDefault(); }
        if(e.key==='Enter') tryIt();
        if(e.key==='ArrowLeft'&&i>0) pins[i-1].focus();
        if(e.key==='ArrowRight'&&i<3) pins[i+1].focus();
      };
      p.onpaste=function(e){
        e.preventDefault();
        var pasted=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,4);
        if(!pasted) return;
        clearWrong();
        pasted.split('').forEach(function(digit,j){ if(pins[j]) pins[j].value=digit; });
        syncFilled();
        if(pasted.length===4) tryIt(); else pins[Math.min(pasted.length,3)].focus();
      };
    });
    pins[0].focus();
  }
