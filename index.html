<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ajchapa</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #ffffff;
      --border:     #ebebeb;
      --text-main:  #000000;
      --text-muted: #888888;
      --font:       'Mulish', sans-serif;
      --mono:       Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    #page {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #nav {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      flex-shrink: 0;
    }
    #nav-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

    #body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 48px 24px 0;
      min-height: 0;
    }

    #hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      padding-bottom: 48px;
      align-items: center;
      min-height: 0;
    }

    #left {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #name {
      font-size: clamp(56px, 10vw, 96px);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.05em;
      color: var(--text-main);
      margin-bottom: 40px;
    }

    #links {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-main);
      transition: padding 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s;
    }
    .link-row:hover {
      background: #f9f9f9;
      padding-left: 12px;
      padding-right: 12px;
      margin: 0 -12px;
    }
    .link-row:hover .link-arrow { transform: translate(3px, -3px); color: var(--text-main); }
    .link-row:last-child:hover .link-arrow { transform: translate(4px, 0px); }

    .link-left  { display: flex; align-items: center; gap: 14px; }
    .link-index { font-size: 11px; font-family: var(--mono); color: #cccccc; width: 20px; }
    .link-name  { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
    .link-handle{ font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

    .link-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cccccc;
      transition: transform 0.3s, color 0.3s;
    }

    #right {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #particle-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      #hero {
        grid-template-columns: 1fr;
        gap: 0;
        padding-bottom: 0;
        flex: none;
      }
      #body {
        padding: 10px 16px 0;
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #right {
        order: -1;
        height: 30vh;
        min-height: 160px;
        max-height: 240px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #left {
        justify-content: flex-start;
        padding-bottom: 12px;
      }
      #name {
        font-size: clamp(40px, 13vw, 64px);
        margin-bottom: 14px;
        text-align: center;
      }
      .link-row { padding: 11px 0; }
      #nav { padding: 0 16px; }
    }
  </style>
</head>
<body>
<div id="page">

  <nav id="nav">
    <span id="nav-time">—</span>
  </nav>

  <div id="body">
    <div id="hero">

      <div id="left">
        <h1 id="name">ajchapa</h1>
        <div id="links">
          <a class="link-row" href="https://www.instagram.com/aapplejuce/" target="_blank" rel="noopener">
            <div class="link-left">
              <span class="link-index">01</span>
              <div>
                <div class="link-name">instagram</div>
                <div class="link-handle">@aapplejuce</div>
              </div>
            </div>
            <span class="link-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
          <a class="link-row" href="https://www.linkedin.com/in/aj-chapagain/" target="_blank" rel="noopener">
            <div class="link-left">
              <span class="link-index">02</span>
              <div>
                <div class="link-name">linkedin</div>
                <div class="link-handle">/aj-chapagain</div>
              </div>
            </div>
            <span class="link-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
          <a class="link-row" href="https://steamcommunity.com/profiles/76561198343184351/" target="_blank" rel="noopener">
            <div class="link-left">
              <span class="link-index">03</span>
              <div>
                <div class="link-name">steam</div>
                <div class="link-handle">profile</div>
              </div>
            </div>
            <span class="link-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
          <a class="link-row" href="archive.html">
            <div class="link-left">
              <span class="link-index">04</span>
              <div>
                <div class="link-name">archive</div>
                <div class="link-handle"><span id="archive-num">7</span> frames</div>
              </div>
            </div>
            <span class="link-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </a>
        </div>
      </div>

      <div id="right">
        <canvas id="particle-canvas"></canvas>
      </div>

    </div>
  </div>

</div>

<script>
  /* CLOCK */
  function tick() {
    document.getElementById('nav-time').textContent =
      new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }
  tick();
  setInterval(tick, 1000);

  /* ARCHIVE 7 PULSE */
  (function () {
    const el = document.getElementById('archive-num');
    if (!el) return;
    const BEAT = 1.2;
    let lastTs = null, t = 0;

    function heartbeat(t) {
      const p = t % BEAT;
      if (p < 0.12) return Math.sin((p / 0.12) * Math.PI);
      if (p > 0.22 && p < 0.34) return Math.sin(((p - 0.22) / 0.12) * Math.PI) * 0.5;
      return 0;
    }

    function pulse(ts) {
      requestAnimationFrame(pulse);
      if (!lastTs) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;
      t += dt;
      const beat = heartbeat(t);
      const r = Math.round(210 + beat * 30);
      const opacity = 0.45 + beat * 0.55;
      el.style.color = `rgba(${r}, 10, 10, ${opacity})`;
      el.style.fontWeight = beat > 0.05 ? '800' : '700';
    }
    requestAnimationFrame(pulse);
  })();

  /* PARTICLE ENGINE */
  (function () {
    const canvas = document.getElementById('particle-canvas');
    const ctx    = canvas.getContext('2d');

    const isMobile = window.innerWidth <= 700;

    // Bigger figure on desktop, well-proportioned on mobile
    const SCALE   = isMobile ? 1.0 : 1.38;
    const W       = isMobile ? 320 : 500;
    const H       = isMobile ? 400 : 640;
    canvas.width  = W;
    canvas.height = H;

    const SPACING       = isMobile ? 5 : 6;
    const RADIUS        = isMobile ? 1.1 : 1.4;
    const BEAT_INTERVAL = 1.2;

    let particles = [];
    let time      = 0;
    let lastTs    = null;

    const heartCX = W / 2 - (isMobile ? 22 : 32);
    const heartCY = H / 2 + (isMobile ? 10 : 14);

    function createProceduralHuman() {
      const off  = document.createElement('canvas');
      off.width  = W;
      off.height = H;
      const octx = off.getContext('2d');
      octx.fillStyle = '#000000';

      octx.translate(W / 2, H / 2);
      octx.scale(SCALE, SCALE);
      octx.translate(-W / 2, -H / 2);

      // Head
      octx.beginPath();
      octx.arc(W / 2, H / 2 - 100, 35, 0, Math.PI * 2);
      octx.fill();

      // Body
      octx.beginPath();
      octx.moveTo(W / 2 - 15, H / 2 - 65);
      octx.quadraticCurveTo(W / 2 - 110, H / 2 - 10, W / 2 - 140, H / 2 + 180);
      octx.lineTo(W / 2 + 140, H / 2 + 180);
      octx.quadraticCurveTo(W / 2 + 110, H / 2 - 10, W / 2 + 15, H / 2 - 65);
      octx.fill();

      return off;
    }

    function initParticles() {
      const offCanvas = createProceduralHuman();
      const octx = offCanvas.getContext('2d');
      const { data } = octx.getImageData(0, 0, W, H);
      particles = [];

      for (let y = 0; y < H; y += SPACING) {
        for (let x = 0; x < W; x += SPACING) {
          const i = (y * W + x) * 4;
          if (data[i + 3] > 128) {
            const dx = x - heartCX;
            const dy = y - heartCY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            particles.push({
              ox: x, oy: y, x, y,
              isHeart: dist < 25,
              distToHeart: dist || 0.01,
              phaseX: Math.random() * Math.PI * 2,
              phaseY: Math.random() * Math.PI * 2,
              driftSpeed: 0.5 + Math.random() * 0.5,
            });
          }
        }
      }
    }

    function getHeartbeat(t) {
      const p = t % BEAT_INTERVAL;
      if (p < 0.12) return Math.sin((p / 0.12) * Math.PI);
      if (p > 0.22 && p < 0.34) return Math.sin(((p - 0.22) / 0.12) * Math.PI) * 0.5;
      return 0;
    }

    function animate(ts) {
      requestAnimationFrame(animate);
      if (!lastTs) lastTs = ts || 0;
      const dt = Math.min(((ts || 0) - lastTs) / 1000, 0.05);
      lastTs = ts || 0;
      time += dt;

      ctx.clearRect(0, 0, W, H);
      if (!particles.length) return;

      const beat = getHeartbeat(time);

      // Body
      ctx.beginPath();
      ctx.fillStyle = 'rgba(15, 15, 15, 0.82)';
      particles.forEach(p => {
        if (p.isHeart) return;
        const driftX = Math.sin(time * p.driftSpeed + p.phaseX) * 1.7;
        const driftY = Math.cos(time * p.driftSpeed + p.phaseY) * 1.7;
        let pushX = 0, pushY = 0;
        if (beat > 0) {
          const force = Math.max(0, 1 - (p.distToHeart / 175));
          const dx = p.ox - heartCX;
          const dy = p.oy - heartCY;
          const pushAmt = beat * force * 4.5;
          pushX = (dx / p.distToHeart) * pushAmt;
          pushY = (dy / p.distToHeart) * pushAmt;
        }
        p.x = p.ox + driftX + pushX;
        p.y = p.oy + driftY + pushY;
        ctx.moveTo(p.x + RADIUS, p.y);
        ctx.arc(p.x, p.y, RADIUS, 0, Math.PI * 2);
      });
      ctx.fill();

      // Heart
      ctx.beginPath();
      ctx.fillStyle = `rgba(210, 10, 10, ${0.6 + beat * 0.4})`;
      particles.forEach(p => {
        if (!p.isHeart) return;
        const dx = p.ox - heartCX;
        const dy = p.oy - heartCY;
        const expand = beat * 4.8;
        p.x = p.ox + (dx / p.distToHeart) * expand;
        p.y = p.oy + (dy / p.distToHeart) * expand;
        const r = RADIUS + beat * 0.9;
        ctx.moveTo(p.x + r, p.y);
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      });
      ctx.fill();
    }

    initParticles();
    requestAnimationFrame(animate);
  })();
</script>
</body>
</html>
