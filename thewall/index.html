      <path d="M13 22 L31 22 L28 43 Q27 45 24 45 L13 45 Q10 45 10.5 42 Z" fill="#5a3a1c" stroke="#2b1a0a" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M14 28 L28 28 M13.5 33 L27 33 M13 38 L26 38" stroke="#2b1a0a" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>
      <path d="M34 22 L34 30 Q34 35 39 35 Q44 35 44 30 L44 22" fill="none" stroke="#1d2027" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M39 22 L38 29" stroke="url(#gg)" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="3" y="6" width="58" height="16" rx="3" fill="url(#gm)" stroke="#12141a" stroke-width="1.2"/>
      <rect x="3" y="12" width="58" height="2.4" fill="url(#gg)" opacity=".9" clip-path="url(#slideclip)"/>
      <rect x="26" y="8" width="14" height="3.4" rx="1" fill="#12141a" opacity=".75"/>
      <path d="M8 6 L8 2.5 L12 2.5 L12 6" fill="#1d2027"/>
      <path d="M55 6 L55 3 L58 3 L58 6" fill="#1d2027"/>
      <circle cx="61" cy="14" r="2.1" fill="#0b0c10"/>
    </svg></div>`;

    // ── build the cards
    GOATS.forEach((g, i) => {
      const dlc = g.color === "dlc" || g.color === "ember";
      const card = document.createElement("article");
      card.className = "card c-" + (g.color || "gold") + (g.color === "ember" ? " c-dlc" : "");
      card.dataset.fx = g.fx || "";
      card.style.animationDelay = (i * 110) + "ms";
      card.style.setProperty("--pos", g.pos || "50% 25%");
      card.style.setProperty("--zoom", g.zoom || 1);
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", g.name + ", " + g.title + ". Activate to flip.");

      const fx = fxMarkup(g.fx);
      const chip = dlc ? `<span class="chip">DLC</span>` : "";
      const photo = g.photo
        ? `<div class="photo-wrap"><img src="${g.photo}" alt="${g.name}" decoding="async" draggable="false">
             <div class="sheen"></div>${fx}${chip}</div>`
        : `<div class="photo-wrap empty"><div class="initial">${g.name[0]}</div>${fx}${chip}</div>`;

      const moves = (g.moves || []).map(([n, p], k) => {
        const mystery = n === "???";
        const over = !mystery && Number(p) > 100;
        const maximum = !mystery && !over && Number(p) === 100;

        // Keep the displayed number accurate, but never let the bar
        // extend beyond the width of its track.
        const width = clamp(Number(p) || 0, 0, 100);

        const classes = [
          mystery ? "mystery" : "",
          maximum ? "max" : "",
          over ? "over" : "",
          n.length > 17 ? "long" : ""
        ].filter(Boolean).join(" ");

        return `
          <li class="${classes}" style="--k:${k}">
            <div class="m-row">
              <span class="m-name">${n}</span>
              <span class="m-pow">${mystery ? "?" : p}</span>
            </div>
            <div class="m-bar">
              <i style="--w:${width / 100}"></i>
            </div>
          </li>
        `;
      }).join("");

      // dlc moves: 20-block segmented meters, plus a red tag when a stat is 10 or below
      const SEGS = 20;
      const dlcMoves = dlc ? (g.moves || []).map(([n, p], k) => {
        const isNum = p !== "—" && p !== "" && Number.isFinite(Number(p));
        const power = isNum ? clamp(Number(p), 0, 100) : 0;
        const lit = Math.round(power / 100 * SEGS);
        const bug = isNum && power <= 10;
        const cls = [power === 100 ? "max" : "", bug ? "bug" : "", !isNum ? "pending" : "", n.length > 9 ? "long" : ""].filter(Boolean).join(" ");
        const segs = Array.from({ length: SEGS }, (_, s) => `<i class="${s < lit ? "on" : ""}" style="--s:${s}"></i>`).join("");
        return `
          <li class="${cls}" style="--k:${k}">
            <div class="m-row"><span class="m-name">${n}${bug ? "<em>known issue</em>" : ""}</span><span class="m-pow">${p}</span></div>
            <div class="seg">${segs}</div>
          </li>`;
      }).join("") : "";

      card.innerHTML = dlc ? `
        <div class="flipper"><div class="tilter">
          <div class="face front">
            ${BRK}${photo}
            <div class="plate">
              <div class="name">${g.name}</div>
              <div class="title"><span>${g.title}</span></div>
              <div class="meta"><span class="hint"><b>↻</b>flip</span></div>
            </div>
          </div>
          <div class="face back">
            ${BRK}
            <div class="b-top"><div class="b-name">${g.name}</div><div class="b-hp">HP<b>${g.hp ?? "—"}</b></div></div>
            <div class="back-title">${g.title}</div>
            <div class="back-rule"></div>
            <ul class="moves">${dlcMoves}</ul>
          </div>
        </div></div>` : `
        ${g.fx === "aura" && !reduceMotion ? haloMarkup() : ""}${g.fx === "craft" && !reduceMotion ? orangMarkup() : ""}${g.fx === "money" && !reduceMotion ? PISTOL : ""}${g.fx === "golf" && !reduceMotion ? TEE : ""}${g.fx === "drink" && !reduceMotion ? MARTINI : ""}
        <div class="flipper"><div class="tilter">
          <div class="face front">
            <div class="keyline"></div>${photo}
            <div class="plate">
              <div class="row">
                <div class="name">${g.name}</div>
                <div class="flip-hint"><b>↻</b>flip</div>
              </div>
              <div class="title"><span>${g.title}</span></div>
            </div>
          </div>
          <div class="face back">
            <div class="keyline"></div>
            <div class="b-top">
              <div class="b-name">${g.name}</div>
              <div class="b-hp">HP<b>${g.hp ?? "—"}</b></div>
            </div>
            <div class="back-title">${g.title}</div>
            <div class="back-rule"></div>
            <ul class="moves">${moves}</ul>
          </div>
        </div></div>`;

      const img = card.querySelector(".photo-wrap img");
      if (img) {
        let tried = false;
        const giveUp = () => {
          img.parentElement.classList.add("empty");
          img.replaceWith(Object.assign(document.createElement("div"), { className: "initial", textContent: g.name[0] }));
        };
        img.addEventListener("error", async () => {
          if (!tried && /\.heic$/i.test(g.photo)) {
            tried = true;
            try { img.src = await heicToUrl(g.photo); return; } catch (_) {}
          }
          giveUp();
        });
      }

      const flip = () => { if (!TUNE) card.classList.toggle("flipped"); };
      card.addEventListener("click", flip);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      wall.appendChild(card);
      if (!TUNE) bindFx(card, g.fx);
      bindMoney(card, g.fx);
      bindGolf(card, g.fx);
      bindDrink(card, g.fx);
    });

    // ── mijo's money effect: click = coin burst
    function bindMoney(card, kind) {
      const wrap = card.querySelector(".photo-wrap");
      const fx = card.querySelector(".fx");
      if (kind !== "money" || !fx || reduceMotion) return;
      const pop = (x, y, s, dx, dy) => {
        const el = document.createElement("i");
        el.className = "cpop";
        el.style.left = x + "px"; el.style.top = y + "px";
        el.style.setProperty("--s", s + "px");
        el.style.setProperty("--dx", dx + "px");
        el.style.setProperty("--dy", dy + "px");
        fx.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      };
      wrap.addEventListener("click", (e) => {
        const r = wrap.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        for (let i = 0; i < 14; i++) pop(x, y, rnd(10, 18), rnd(-70, 70), rnd(-80, 50));
      });
    }

    // ── kelketra's golf effect: click = fire sparks burst out
    function bindGolf(card, kind) {
      const wrap = card.querySelector(".photo-wrap");
      const fx = card.querySelector(".fx");
      if (kind !== "golf" || !fx || reduceMotion) return;
      wrap.addEventListener("click", (e) => {
        const r = wrap.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        for (let i = 0; i < 14; i++) {
          const el = document.createElement("i");
          el.className = "spark";
          el.style.left = x + "px"; el.style.top = y + "px";
          el.style.setProperty("--s", rnd(6, 14) + "px");
          el.style.setProperty("--dx", rnd(-70, 70) + "px");
          el.style.setProperty("--dy", rnd(-80, 40) + "px");
          fx.appendChild(el);
          el.addEventListener("animationend", () => el.remove());
        }
      });
    }

    // ── noel's drink effect: click the photo = champagne pop
    function bindDrink(card, kind) {
      const wrap = card.querySelector(".photo-wrap");
      const fx = card.querySelector(".fx");
      if (kind !== "drink" || !fx || reduceMotion) return;
      wrap.addEventListener("click", (e) => {
        const r = wrap.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        for (let i = 0; i < 16; i++) {
          const el = document.createElement("i");
          el.className = "pop" + (Math.random() < .35 ? " gold" : "");
          el.style.left = x + "px"; el.style.top = y + "px";
          el.style.setProperty("--s", rnd(6, 15) + "px");
          el.style.setProperty("--dx", rnd(-70, 70) + "px");
          el.style.setProperty("--dy", rnd(-90, 30) + "px");
          fx.appendChild(el);
          el.addEventListener("animationend", () => el.remove());
        }
      });
    }

    // ── effects: they run on their own, and take over when you hover
    const FEED = ["Eliminated", "Headshot", "Clutch", "Victory"];
    function bindFx(card, kind) {
      const wrap = card.querySelector(".photo-wrap");
      const fx = card.querySelector(".fx");
      if (!fx || reduceMotion) return;

      if (kind === "aim") {
        const ret = fx.querySelector(".reticle");
        const feed = fx.querySelector(".feed");
        let hovering = false, n = 0, lx = 0, ly = 0;
        const move = (x, y) => {
          lx = x; ly = y;
          ret.style.transform = `translate(${x}px,${y}px)`;
          fx.style.setProperty("--fx", x + "px");
          fx.style.setProperty("--fy", y + "px");
        };
        const shoot = (x, y) => {
          ["burst", "hit"].forEach((cls) => {
            const b = document.createElement("i");
            b.className = cls; b.style.left = x + "px"; b.style.top = y + "px";
            fx.appendChild(b);
            b.addEventListener("animationend", () => b.remove());
          });
          const item = document.createElement("div");
          item.className = "feed-item";
          item.textContent = FEED[n++ % FEED.length];
          feed.appendChild(item);
          while (feed.children.length > 3) feed.firstChild.remove();
          item.addEventListener("animationend", () => item.remove());
        };
        const size = () => wrap.getBoundingClientRect();
        let t = 0;
        move(size().width * .5, size().height * .4);
        setInterval(() => {
          if (hovering || document.hidden) return;
          const r = size(); t++;
          move(r.width * (.2 + Math.random() * .6), r.height * (.2 + Math.random() * .55));
          if (t % 2 === 0) setTimeout(() => { if (!hovering) shoot(lx, ly); }, 750);
        }, 1700);

        wrap.addEventListener("pointerenter", () => { hovering = true; ret.classList.add("live"); });
        wrap.addEventListener("pointerleave", () => { hovering = false; ret.classList.remove("live"); });
        wrap.addEventListener("pointermove", (e) => {
          const r = size(); move(e.clientX - r.left, e.clientY - r.top);
        });
        wrap.addEventListener("click", (e) => {
          const r = size(); shoot(e.clientX - r.left, e.clientY - r.top);
        });
      }

      if (kind === "sheet") {
        const sel = fx.querySelector(".sh-sel");
        const nameEl = fx.querySelector(".sh-name");
        const formula = fx.querySelector(".sh-formula");
        const colEls = [...fx.querySelectorAll(".sh-cols span")];
        const rowEls = [...fx.querySelectorAll(".sh-rows span")];
        let lc = -1, lr = -1, hovering = false;
        const setCell = (c, rw) => {
          if (c === lc && rw === lr) return;
          if (lc >= 0) { colEls[lc].classList.remove("on"); rowEls[lr].classList.remove("on"); }
          lc = c; lr = rw;
          colEls[c].classList.add("on"); rowEls[rw].classList.add("on");
          sel.style.transform = `translate(${c * 40}px,${rw * 26}px)`;
          const addr = LETTERS[c] + (rw + 1);
          nameEl.textContent = addr;
          formula.textContent = `=VLOOKUP(${addr},Wall,2,0)`;
        };
        const dims = () => {
          const r = wrap.getBoundingClientRect();
          return { r, maxC: Math.max(1, Math.floor((r.width - 20) / 40)), maxR: Math.max(1, Math.floor((r.height - 36) / 26)) };
        };
        setCell(1, 1);
        setInterval(() => {
          if (hovering || document.hidden) return;
          const { maxC, maxR } = dims();
          setCell(Math.floor(Math.random() * maxC), Math.floor(Math.random() * maxR));
        }, 1000);

        wrap.addEventListener("pointerenter", () => { hovering = true; });
        wrap.addEventListener("pointerleave", () => { hovering = false; });
        wrap.addEventListener("pointermove", (e) => {
          const { r, maxC, maxR } = dims();
          setCell(
            clamp(Math.floor((e.clientX - r.left - 20) / 40), 0, maxC - 1),
            clamp(Math.floor((e.clientY - r.top - 36) / 26), 0, maxR - 1)
          );
        });
      }

      if (kind === "craft") {
        const orang = card.querySelector(".orang");
        const rnd = (a, b) => a + Math.random() * (b - a);
        const sparkle = (x, y, o) => {
          const el = document.createElement("i");
          el.className = "spk pop" + (o.gold ? " gold" : "");
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--s", o.s + "px");
          el.style.setProperty("--dx", o.dx + "px");
          el.style.setProperty("--dy", o.dy + "px");
          fx.appendChild(el);
          el.addEventListener("animationend", () => el.remove());
        };
        let last = 0;
        wrap.addEventListener("pointermove", (e) => {
          const now = performance.now();
          if (now - last < 45) return;
          last = now;
          const r = wrap.getBoundingClientRect();
          sparkle(e.clientX - r.left, e.clientY - r.top,
            { s: rnd(6, 13), dx: rnd(-12, 12), dy: rnd(14, 30), gold: Math.random() < .35 });
        });
        wrap.addEventListener("click", (e) => {
          const r = wrap.getBoundingClientRect();
          for (let i = 0; i < 16; i++) {
            sparkle(e.clientX - r.left, e.clientY - r.top,
              { s: rnd(9, 21), dx: rnd(-60, 60), dy: rnd(-60, 60), gold: Math.random() < .4 });
          }
        });
        card.addEventListener("click", () => {
          if (!orang) return;
          const pr = wrap.getBoundingClientRect();
          const or = orang.getBoundingClientRect();
          const ox = or.left - pr.left + or.width / 2;
          const oy = or.top - pr.top + or.height * .55;
          for (let i = 0; i < 18; i++) {
            sparkle(ox + rnd(-16, 16), oy + rnd(-8, 12),
              { s: rnd(7, 15), dx: rnd(-40, 40), dy: rnd(70, 190), gold: Math.random() < .5 });
          }
        });
      }
    }

    // ── tune mode: drag a photo to place it, scroll or +/- to zoom
    if (TUNE) {
      const panel = document.createElement("div");
      panel.id = "tuner";
      panel.innerHTML = `<h3>photo tuner</h3>
        <p>drag a photo to position it. use − / + (or scroll) to zoom. when it looks right, copy the line into your GOATS list.</p>
        <div id="t-rows"></div>`;
      document.body.appendChild(panel);
      const rowsEl = panel.querySelector("#t-rows");
      const cardEls = [...document.querySelectorAll(".card")];

      GOATS.forEach((g, i) => {
        const card = cardEls[i];
        const wrap = card.querySelector(".photo-wrap");
        let [px, py] = (g.pos || "50% 25%").split(" ").map((v) => parseFloat(v));
        let z = g.zoom || 1;
        const row = document.createElement("div");
        row.className = "t-row";
        row.innerHTML = `<button data-d="-1" aria-label="zoom out">−</button><button data-d="1" aria-label="zoom in">+</button><code></code>`;
        rowsEl.appendChild(row);
        const code = row.querySelector("code");
        const apply = () => {
          card.style.setProperty("--pos", `${px.toFixed(0)}% ${py.toFixed(0)}%`);
          card.style.setProperty("--zoom", z.toFixed(2));
          code.textContent = `${g.name}: pos:"${px.toFixed(0)}% ${py.toFixed(0)}%", zoom:${z.toFixed(2)}`;
        };
        apply();

        let drag = null;
        wrap.addEventListener("pointerdown", (e) => {
          drag = { x: e.clientX, y: e.clientY, px, py };
          wrap.setPointerCapture(e.pointerId);
          card.style.cursor = "grabbing";
        });
        wrap.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const r = wrap.getBoundingClientRect();
          px = clamp(drag.px - ((e.clientX - drag.x) / r.width) * 100, 0, 100);
          py = clamp(drag.py - ((e.clientY - drag.y) / r.height) * 100, 0, 100);
          apply();
        });
        const end = () => { drag = null; card.style.cursor = ""; };
        wrap.addEventListener("pointerup", end);
        wrap.addEventListener("pointercancel", end);
        wrap.addEventListener("wheel", (e) => {
          e.preventDefault();
          z = clamp(z - e.deltaY * 0.002, 1, 3); apply();
        }, { passive: false });
        row.addEventListener("click", (e) => {
          const d = e.target.dataset && e.target.dataset.d;
          if (!d) return;
          z = clamp(z + Number(d) * 0.1, 1, 3); apply();
        });
      });
    }

    // ── kinetic title
    const titleEl = document.getElementById("title");
    ["The", "Wall"].forEach((w, wi) => {
      const word = document.createElement("span");
      word.className = "kword";
      word.setAttribute("aria-hidden", "true");
      [...w].forEach((ch, ci) => {
        const mask = document.createElement("span"); mask.className = "kmask";
        const l = document.createElement("span"); l.className = "kl"; l.textContent = ch;
        l.style.setProperty("--d", ((wi * 4 + ci) * 55) + "ms");
        mask.appendChild(l); word.appendChild(mask);
      });
      titleEl.appendChild(word);
      titleEl.appendChild(document.createTextNode(" "));
    });

    // ── card tilt: one rAF loop that only runs while something is moving
    const cards = [...document.querySelectorAll(".card")];
    const state = cards.map((c) => ({
      tx:0, ty:0, cx:0, cy:0, lift:0, liftT:0, active:false,
      tilter: c.querySelector(".tilter"), sheen: c.querySelector(".sheen"), dirty:false
    }));
    let running = false;
    function kick() { if (!running) { running = true; requestAnimationFrame(step); } }
    function step() {
      let busy = false;
      state.forEach((s) => {
        const dx = s.tx - s.cx, dy = s.ty - s.cy, dl = s.liftT - s.lift;
        if (Math.abs(dx) < .0008 && Math.abs(dy) < .0008 && Math.abs(dl) < .03) {
          if (s.dirty) {
            s.cx = s.tx; s.cy = s.ty; s.lift = s.liftT;
            s.tilter.style.transform = s.liftT || s.tx || s.ty
              ? `translateY(${s.lift}px) rotateY(${s.cx * 14}deg) rotateX(${-s.cy * 14}deg)` : "";
            s.dirty = false;
          }
          if (s.active) busy = true;
          return;
        }
        s.cx += dx * .14; s.cy += dy * .14; s.lift += dl * .18;
        s.tilter.style.transform =
          `translateY(${s.lift.toFixed(2)}px) rotateY(${(s.cx * 14).toFixed(2)}deg) rotateX(${(-s.cy * 14).toFixed(2)}deg)`;
        s.dirty = true; busy = true;
      });
      if (busy) requestAnimationFrame(step); else running = false;
    }
    cards.forEach((card, i) => {
      const s = state[i];
      card.addEventListener("pointermove", (e) => {
        if (reduceMotion || TUNE) return;
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        s.tx = x - .5; s.ty = y - .5; s.liftT = -6; s.active = true;
        if (s.sheen) { s.sheen.style.setProperty("--mx", (x * 100) + "%"); s.sheen.style.setProperty("--my", (y * 100) + "%"); }
        kick();
      });
      card.addEventListener("pointerleave", () => {
        s.tx = 0; s.ty = 0; s.liftT = 0; s.active = false; s.dirty = true; kick();
      });
    });

    // ── gyroscope tilt on phones (iOS asks permission on first tap)
    function enableGyro() {
      document.body.classList.add("gyro");
      let queued = false, gx = 0, gy = 0;
      addEventListener("deviceorientation", (e) => {
        if (e.gamma == null) return;
        gx = clamp(e.gamma / 40, -.5, .5); gy = clamp((e.beta - 40) / 40, -.5, .5);
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          state.forEach((s) => {
            s.tx = gx; s.ty = gy; s.liftT = -3; s.dirty = true;
            if (s.sheen) { s.sheen.style.setProperty("--mx", ((gx + .5) * 100) + "%"); s.sheen.style.setProperty("--my", ((gy + .5) * 100) + "%"); }
          });
          kick();
        });
      });
    }
    if (!reduceMotion && !TUNE && matchMedia("(hover: none)").matches && "DeviceOrientationEvent" in window) {
      addEventListener("pointerdown", async () => {
        try {
          if (typeof DeviceOrientationEvent.requestPermission === "function") {
            if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return;
          }
          enableGyro();
        } catch (_) {}
      }, { once: true });
    }

    // ── handbook
    const modal = document.getElementById("handbook-modal");
    const openBtn = document.getElementById("handbook-btn");
    const closeBtn = document.getElementById("handbook-close");

    function openHandbook() {
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("locked");
      setTimeout(() => closeBtn.focus({preventScroll:true}), 100);
    }
    function closeHandbook() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("locked");
      openBtn.focus({preventScroll:true});
    }
    openBtn.addEventListener("click", openHandbook);
    closeBtn.addEventListener("click", closeHandbook);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeHandbook();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("open")) {
        closeHandbook();
      }
    });

    // ── live clock
    function clock() {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      document.getElementById("nav-time").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    clock(); setInterval(clock, 1000);
  </script>
</body>
</html>
