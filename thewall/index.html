<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wall — ajchapa</title>
  <meta name="description" content="The Wall. Hand-picked by ajchapa." />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Wall — ajchapa" />
  <meta property="og:description" content="Hand-picked by ajchapa." />
  <meta property="og:image" content="https://ajchapa.com/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Mulish:wght@300;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --border:#ebebeb; --text-main:#111; --text-muted:#888;
      --font:'Mulish',sans-serif;
      --serif:'Instrument Serif',Georgia,serif;
      --mono:Menlo,Monaco,Consolas,monospace;
      --foil:#d9c48f; --gold:#c9a227; --gold-deep:#a8842f; --gold-pale:#f1dfa8;
      --ox1:#9a1826; --ox2:#5a0c15; --ox3:#3b060c;
      --wrap:1100px; --gutter:32px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    ::selection{background:#f3e3b3}
    html{background:#fff}
    body{
      background:radial-gradient(1100px 420px at 50% -10%,rgba(217,196,143,.13),transparent 65%),#fff;
      color:var(--text-main);font-family:var(--font);font-size:14px;line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    body.locked{overflow:hidden}
    a{color:inherit;text-decoration:none}
    #page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip}

    .col{width:100%;max-width:var(--wrap);margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}

    /* nav: full width. back link hugs the far left, clock hugs the far right */
    #nav{height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 24px}
    #nav-back{font-size:13px;color:var(--text-muted);letter-spacing:.02em;transition:color .2s ease}
    #nav-back:hover{color:var(--text-main)}
    #nav-time{font-size:11px;color:var(--text-muted);font-family:var(--mono)}

    /* ================= hero ================= */
    #hero{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:10px}
    h1#title{
      font-family:var(--serif);font-weight:400;
      font-size:clamp(32px,4.2vw,50px);letter-spacing:-.015em;line-height:1;cursor:default;
    }
    .kword{display:inline-block;white-space:nowrap}
    .kmask{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
    .kl{
      display:inline-block;opacity:0;transform:translateY(110%);
      animation:
        kin .9s cubic-bezier(.19,.7,.22,1) forwards var(--d,0ms),
        sweep 11s ease-in-out infinite calc(var(--d,0ms) + 3.5s);
      background:linear-gradient(105deg,#111 42%,#c9a227 50%,#111 58%);
      background-size:280% 100%;background-position:0% 0;
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    @keyframes kin{to{opacity:1;transform:translateY(0)}}
    @keyframes sweep{0%,82%{background-position:0% 0}100%{background-position:100% 0}}

    /* ================= code scroll button ================= */
    #scroll-btn{
      display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
      font-family:var(--serif);font-size:22px;line-height:1;color:var(--text-main);
      opacity:0;transform:translateY(8px);animation:how-in .8s ease .5s forwards;
    }
    @keyframes how-in{to{opacity:1;transform:translateY(0)}}
    #scroll-btn svg{width:38px;height:29px;display:block;filter:drop-shadow(0 5px 7px rgba(90,12,21,.3));transition:transform .45s cubic-bezier(.2,.7,.25,1)}
    #scroll-btn:hover svg{transform:rotate(-6deg) scale(1.1)}
    #scroll-btn .paper{transition:transform .45s cubic-bezier(.2,.7,.25,1);transform-origin:50% 50%}
    #scroll-btn:hover .paper{transform:scaleY(1.08)}
    #scroll-btn:focus-visible{outline:2px solid var(--text-main);outline-offset:6px;border-radius:8px}

    /* ================= the scroll ================= */
    #scroll-modal{
      position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
      background:rgba(24,4,7,.62);
      visibility:hidden;opacity:0;transition:opacity .4s ease,visibility 0s .9s;
    }
    #scroll-modal.open{visibility:visible;opacity:1;transition:opacity .4s ease}
    #scroll{width:100%;max-width:460px}
    .rod{
      position:relative;height:22px;border-radius:11px;
      background:linear-gradient(180deg,var(--ox1),var(--ox2) 55%,var(--ox3));
      border:1px solid var(--gold);box-shadow:0 8px 16px -6px rgba(0,0,0,.5);
    }
    .rod::before,.rod::after{
      content:"";position:absolute;top:-6px;width:16px;height:32px;border-radius:7px;
      background:linear-gradient(90deg,#8a6a1f,#f1dfa8 45%,#c9a227 60%,#8a6a1f);
    }
    .rod::before{left:-9px}
    .rod::after{right:-9px}
    #s-body{
      margin:0 16px;display:grid;grid-template-rows:0fr;
      transition:grid-template-rows .9s cubic-bezier(.5,0,.3,1);
      background:
        linear-gradient(90deg,rgba(120,70,20,.22),transparent 7%,transparent 93%,rgba(120,70,20,.22)),
        linear-gradient(180deg,#f7eccf,#f1e3bd);
      box-shadow:inset 0 10px 14px -10px rgba(80,40,10,.35),inset 0 -10px 14px -10px rgba(80,40,10,.35);
    }
    #scroll-modal.open #s-body{grid-template-rows:1fr;transition:grid-template-rows 1.1s cubic-bezier(.22,.7,.2,1) .15s}
    #s-inner{overflow:hidden;min-height:0}
    #s-content{
      position:relative;padding:38px 34px 34px;max-height:calc(100dvh - 130px);overflow-y:auto;
      text-align:center;color:var(--ox2);
    }
    #s-content::before{content:"";position:absolute;inset:10px;border:1px solid rgba(168,132,47,.4);pointer-events:none}
    #s-close{
      position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
      background:none;border:1px solid rgba(168,132,47,.55);color:var(--ox2);
      font-size:17px;line-height:1;cursor:pointer;z-index:2;transition:background .25s;
    }
    #s-close:hover{background:rgba(168,132,47,.18)}
    #s-close:focus-visible{outline:2px solid var(--ox2);outline-offset:2px}
    .reveal{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
    #scroll-modal.open .reveal{
      opacity:1;transform:none;
      transition:opacity .8s ease calc(.75s + var(--i,0) * .22s),transform .8s ease calc(.75s + var(--i,0) * .22s);
    }
    #s-title{font-family:var(--serif);font-weight:400;font-size:60px;line-height:1;color:var(--ox2)}
    .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 6px;color:var(--gold-deep);font-size:11px}
    .orn::before,.orn::after{content:"";height:1px;width:60px;background:rgba(168,132,47,.5)}
    #s-rules{list-style:none}
    #s-rules li{padding:16px 0}
    #s-rules .roman{display:block;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gold-deep)}
    #s-rules .txt{display:block;font-family:var(--serif);font-size:29px;line-height:1.1;margin-top:2px}

    /* ================= the wall: a gallery wall ================= */
    #body{flex:1;padding-top:18px;padding-bottom:90px}
    #wall{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));
      gap:40px 24px;perspective:1400px;padding-top:50px;align-items:start;
    }
    .card:nth-child(even){margin-top:16px}
    .card:nth-child(3n){margin-top:7px}

    .hang{position:absolute;left:0;right:0;top:-40px;height:40px;pointer-events:none;z-index:0;
      opacity:0;animation:fade .6s ease .6s forwards}
    @keyframes fade{to{opacity:1}}
    .hang svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .hang line{stroke:rgba(var(--ac-rgb),.7);stroke-width:1;vector-effect:non-scaling-stroke}
    .hang i{
      position:absolute;left:50%;top:-4px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff6d4,var(--ac) 55%,var(--ac-deep));
      box-shadow:0 2px 3px rgba(0,0,0,.28);
    }

    .c-gold {--ac:#c9a227;--ac-deep:#a8842f;--ac-pale:#f1dfa8;--ac-rgb:201,162,39;--ac-wash:#fcf7e6;--ac-line:#d9c48f}
    .c-blue {--ac:#2f86ee;--ac-deep:#1d5fb8;--ac-pale:#cfe4ff;--ac-rgb:47,134,238;--ac-wash:#eef5ff;--ac-line:#a9c8f0}
    .c-green{--ac:#21a35a;--ac-deep:#187a43;--ac-pale:#c9eed8;--ac-rgb:33,163,90;--ac-wash:#eefaf2;--ac-line:#a5d9b9}
    .c-pink {--ac:#ff3d9a;--ac-deep:#c2185b;--ac-pale:#ffd1e8;--ac-rgb:255,61,154;--ac-wash:#fff0f7;--ac-line:#f6a8cd}
    /* dlc: the one dark card. it also switches to a mono voice inside the card */
    .c-dlc{
      --ac:#9b6bff;--ac-deep:#c4abff;--ac-pale:#e1d3f7;--ac-rgb:155,107,255;--ac-wash:#1d1233;--ac-line:#3a2a5c;
      --ink:#120a1f;--ink2:#1d1233;--paper:#f4eeff;
      --mono:'Space Mono',Menlo,Monaco,Consolas,monospace;--font:var(--mono);--serif:var(--mono);
    }

    .card{position:relative;aspect-ratio:5/6.7;opacity:0;animation:rise .7s ease forwards;cursor:pointer}
    .card[data-fx="aim"]{cursor:crosshair}
    .card:focus{outline:none}
    .card:focus-visible .face{outline:2px solid var(--text-main);outline-offset:4px}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    .flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.25,1)}
    .card.flipped .flipper{transform:rotateY(180deg)}
    .tilter{position:absolute;inset:0;transform-style:preserve-3d}
    .card:hover .tilter{will-change:transform}

    .face{
      position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
      border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--ac-line);
      box-shadow:0 1px 2px rgba(0,0,0,.05),0 20px 40px -22px rgba(0,0,0,.24);
    }
    .face.back{transform:rotateY(180deg)}
    .keyline{position:absolute;inset:8px;border:1px solid rgba(var(--ac-rgb),.5);border-radius:12px;pointer-events:none;z-index:6}

    .photo-wrap{position:relative;height:67%;overflow:hidden;background:var(--ac-wash)}
    .photo-wrap img{
      width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 25%);display:block;
      transform:scale(var(--zoom,1));transform-origin:var(--pos,50% 25%);
      -webkit-user-drag:none;user-select:none;
    }
    .photo-wrap::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;pointer-events:none;
      background:linear-gradient(to top,rgba(0,0,0,.14),transparent)}
    .sheen{
      position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s ease;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.3),transparent 55%),
        linear-gradient(115deg,transparent calc(var(--mx,50%) - 22%),rgba(var(--ac-rgb),.2) var(--mx,50%),transparent calc(var(--mx,50%) + 22%));
    }
    .card:hover .sheen,body.gyro .sheen{opacity:1}
    .photo-wrap.empty{
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(120% 90% at 50% 20%,#fff,var(--ac-wash));
    }
    .photo-wrap.empty::after{display:none}
    .photo-wrap .initial{font-family:var(--serif);font-style:italic;font-size:110px;line-height:1;color:rgba(var(--ac-rgb),.5)}

    /* ---------- name plate: the same layout on every card ----------
       row 1: name on the left, flip badge on the right
       row 2: title, always one line, never grows past the card
       the padding is lopsided on purpose (a bit more at the bottom) so the
       title sits clear of the keyline instead of crowding the card edge */
    .plate{
      position:relative;height:33%;padding:2px 18px 8px;display:flex;flex-direction:column;justify-content:center;gap:6px;
      background:linear-gradient(180deg,#fff,var(--ac-wash));border-top:1px solid rgba(var(--ac-rgb),.35);
    }
    .plate .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
    .plate .name{font-family:var(--serif);font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .plate .title{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.1;color:var(--ac-deep);
    }
    .plate .title::before{content:"";width:5px;height:5px;background:var(--ac);transform:rotate(45deg);flex-shrink:0}
    .plate .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

    .flip-hint{
      flex-shrink:0;display:flex;align-items:center;gap:5px;
      font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ac-deep);
      opacity:.85;transition:opacity .3s ease,transform .3s ease;
    }
    .flip-hint b{
      display:grid;place-items:center;width:19px;height:19px;border-radius:50%;font-weight:400;font-style:normal;font-size:11px;
      border:1px solid rgba(var(--ac-rgb),.6);background:#fff;animation:nudge 3.6s ease-in-out infinite;
    }
    @keyframes nudge{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(180deg)}}
    .card:hover .flip-hint{opacity:1;transform:translateX(-2px)}

    /* ================= CARD BACK: refined ability layout ================= */

        .face.back {
          display: flex;
          flex-direction: column;
          padding: 19px 17px 16px;
          background:
            radial-gradient(ellipse at 50% 0%, var(--ac-wash), transparent 72%),
            #fff;
        }

        .face.back::before {
          content: "";
          position: absolute;
          inset: 0;
          pointer-events: none;
          background:
            linear-gradient(
              135deg,
              rgba(var(--ac-rgb), .055),
              transparent 42%,
              rgba(var(--ac-rgb), .035)
            );
        }

        /* A single soft sheen when the card is revealed */
        .face.back::after {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 5;
          pointer-events: none;
          opacity: 0;
          background: linear-gradient(
            110deg,
            transparent 25%,
            rgba(255, 255, 255, .5) 45%,
            rgba(var(--ac-rgb), .08) 50%,
            transparent 68%
          );
          transform: translateX(-120%);
        }

        .card.flipped .face.back::after {
          animation: back-sheen .85s ease-out .38s 1 both;
        }

        @keyframes back-sheen {
          0% {
            opacity: 0;
            transform: translateX(-120%);
          }
          20% {
            opacity: .8;
          }
          100% {
            opacity: 0;
            transform: translateX(120%);
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .card.flipped .face.back::after {
            animation: none;
          }
        }

        .face.back > * {
          position: relative;
        }

        .face.back > .keyline {
          position: absolute;
        }

        .b-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          min-width: 0;
        }

        .b-name {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-family: var(--serif);
          font-size: 27px;
          line-height: 1.05;
        }

        .b-hp {
          flex-shrink: 0;
          font-family: var(--mono);
          font-size: 9px;
          color: var(--text-muted);
          letter-spacing: .08em;
          white-space: nowrap;
        }

        .b-hp b {
          font: 700 15px var(--mono);
          color: var(--ac-deep);
          margin-left: 3px;
          letter-spacing: 0;
        }

        .back-title {
          margin-top: 5px;
          font-family: var(--serif);
          font-style: italic;
          font-size: 14px;
          line-height: 1.2;
          color: var(--ac-deep);
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
        }

        .back-rule {
          display: flex;
          align-items: center;
          gap: 8px;
          height: 1px;
          flex-shrink: 0;
          margin: 15px 0 16px;
          background: rgba(var(--ac-rgb), .24);
        }

        /* Three abilities occupy equal vertical space */
        .moves {
          list-style: none;
          display: grid;
          grid-template-rows: repeat(3, minmax(0, 1fr));
          gap: 0;
          flex: 1;
          min-height: 0;
        }

        .moves li {
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-width: 0;
          padding: 9px 0 10px;
          border-bottom: 1px solid rgba(var(--ac-rgb), .13);
        }

        .moves li:last-child {
          border-bottom: 0;
        }

        .m-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          min-width: 0;
        }

        .m-name {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-family: var(--serif);
          font-size: 19px;
          line-height: 1.15;
        }

        /* Long ability names step down a size and may wrap to a second line,
           so the full name always stays inside the card */
        .moves li.long .m-name {
          font-size: 16px;
          white-space: normal;
          line-height: 1.1;
        }

        .m-pow {
          flex-shrink: 0;
          font: 700 13px var(--mono);
          font-variant-numeric: tabular-nums;
          color: var(--text-main);
        }

        /* Clean, contained power meter */
        .m-bar {
          position: relative;
          width: 100%;
          height: 4px;
          flex-shrink: 0;
          margin-top: 9px;
          background: rgba(var(--ac-rgb), .13);
          border-radius: 99px;
          overflow: hidden;
        }

        .m-bar i {
          display: block;
          width: 100%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(
            90deg,
            var(--ac-deep),
            var(--ac),
            var(--ac-pale)
          );
          transform: scaleX(0);
          transform-origin: left center;
          transition: transform .7s cubic-bezier(.2, .7, .25, 1);
        }

        /* Bars fill after the card turns, with a small stagger */
        .card.flipped .m-bar i {
          transform: scaleX(var(--w));
          transition-delay: calc(.48s + var(--k) * .12s);
        }

        /* Maximum power: 100/100 */
        .moves li.max .m-pow {
          color: var(--ac-deep);
        }

        .moves li.max .m-bar i {
          background: linear-gradient(
            90deg,
            var(--ac),
            var(--ac-pale),
            #fff
          );
          box-shadow: 0 0 5px rgba(var(--ac-rgb), .35);
        }

        /* Overpowered ability: reserved red treatment */
        .moves li.over .m-name,
        .moves li.over .m-pow {
          color: #d83c2e;
        }

        .moves li.over .m-bar {
          background: rgba(216, 60, 46, .12);
        }

        .moves li.over .m-bar i {
          background: linear-gradient(90deg, #d83c2e, #ff795b);
          box-shadow: 0 0 8px rgba(216, 60, 46, .22);
        }

        /* Unknown ability: dashed meter and question mark */
        .moves li.mystery .m-name {
          color: var(--text-muted);
          font-style: italic;
        }

        .moves li.mystery .m-pow {
          color: #aaa;
        }

        .moves li.mystery .m-bar {
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: visible;
          background: transparent;
          border: 1px dashed rgba(var(--ac-rgb), .55);
          border-radius: 99px;
        }

        .moves li.mystery .m-bar::after {
          content: "?";
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          padding: 0 5px;
          background: #fff;
          color: var(--ac-deep);
          font: 700 9px var(--mono);
          line-height: 1;
        }

        .moves li.mystery .m-bar i {
          display: none;
        }

        /* Small screens */
        @media (max-width: 640px) {
          .face.back {
            padding: 15px 13px 12px;
          }

          .b-name {
            font-size: 22px;
          }

          .b-hp b {
            font-size: 13px;
          }

          .back-title {
            font-size: 12px;
          }

          .back-rule {
            margin: 11px 0 10px;
          }

          .moves li {
            padding: 7px 0 8px;
          }

          .m-name {
            font-size: 16px;
          }

          .m-pow {
            font-size: 12px;
          }

          .m-bar {
            margin-top: 7px;
            height: 3px;
          }
        }

        /* ================================================================
       PER-CARD EFFECTS: always running. hover makes them react.
       ================================================================ */
    .fx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}

    /* ---------- ajchapa: crown, halo, embers, foil sweep ---------- */
    .crown{
      position:absolute;z-index:8;left:50%;top:-21px;width:54px;height:41px;margin-left:-27px;
      pointer-events:none;filter:drop-shadow(0 6px 8px rgba(120,84,10,.35));
      transition:transform .6s cubic-bezier(.2,.7,.25,1),opacity .3s ease;
      animation:float 4s ease-in-out infinite;
    }
    @keyframes float{50%{margin-top:-4px}}
    .crown svg{width:100%;height:100%;display:block}
    .card:hover .crown{transform:translateY(-8px) rotate(-3deg) scale(1.08)}
    .card.flipped .crown{opacity:0}
    .halo{
      position:absolute;inset:-14px;z-index:-1;pointer-events:none;
      opacity:.9;transform:scale(1);transition:transform .6s cubic-bezier(.2,.7,.25,1);
    }
    .card:hover .halo{transform:scale(1.07)}
    .halo::before{
      content:"";position:absolute;inset:10px;border-radius:30px;
      background:conic-gradient(from 20deg,#fff1bd,#e0a82e,#c9a227,#ffe9a0,#d9a83a,#fff1bd);
      filter:blur(22px);opacity:.42;animation:aura 3.4s ease-in-out infinite;
    }
    @keyframes aura{50%{opacity:.78;transform:scale(1.05)}}
    .ember{
      position:absolute;bottom:4%;left:var(--x);width:4px;height:4px;border-radius:50%;
      background:#f6d77a;box-shadow:0 0 8px 2px rgba(246,215,122,.85);opacity:0;
      animation:ember var(--t) linear infinite;animation-delay:var(--dl);
    }
    @keyframes ember{
      0%{opacity:0;transform:translate(0,0) scale(1)}
      15%{opacity:1}
      100%{opacity:0;transform:translate(var(--dx),-240px) scale(.3)}
    }
    .fx-aura::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 90% at 50% 100%,rgba(255,214,102,.3),transparent 60%);
    }
    .fx-aura .foil{
      position:absolute;top:-10%;bottom:-10%;width:42%;left:-60%;
      background:linear-gradient(100deg,transparent,rgba(255,236,170,.5),transparent);
      transform:skewX(-14deg);animation:foil 5s ease-in-out infinite;
    }
    .card:hover .fx-aura .foil{animation-duration:2.4s}
    @keyframes foil{0%{left:-60%}40%,100%{left:130%}}

    /* ---------- alex: game HUD, auto-playing ---------- */
    .fx-aim .agrid{
      position:absolute;inset:0;
      background-image:
        linear-gradient(rgba(var(--ac-rgb),.5) 1px,transparent 1px),
        linear-gradient(90deg,rgba(var(--ac-rgb),.5) 1px,transparent 1px);
      background-size:30px 30px;
      -webkit-mask-image:radial-gradient(circle 80px at var(--fx,50%) var(--fy,50%),#000 0%,transparent 100%);
      mask-image:radial-gradient(circle 80px at var(--fx,50%) var(--fy,50%),#000 0%,transparent 100%);
    }
    .fx-aim::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 36px rgba(var(--ac-rgb),.4)}
    .reticle{
      position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;
      transition:transform .7s cubic-bezier(.4,0,.2,1);will-change:transform;color:#fff;
      filter:drop-shadow(0 0 3px rgba(var(--ac-rgb),.95));
    }
    .reticle.live{transition:transform .09s linear}
    .reticle svg{width:100%;height:100%;display:block;animation:lock 2.4s ease-in-out infinite}
    @keyframes lock{50%{transform:scale(.86)}}
    .hud{position:absolute;left:12px;right:12px;bottom:12px;display:grid;gap:5px}
    .hud .bar{height:6px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden;transform:skewX(-18deg)}
    .hud .bar i{display:block;height:100%;width:100%;transform-origin:left;animation:fill 1.4s cubic-bezier(.2,.7,.25,1) both}
    .hud .shield i{background:linear-gradient(90deg,#4aa3ff,#9fd0ff)}
    .hud .hp i{background:linear-gradient(90deg,#34c76f,#8ef0b4);animation-delay:.2s}
    @keyframes fill{from{transform:scaleX(0)}}
    .burst{
      position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
      border:2px solid var(--ac);animation:burst .55s ease-out forwards;
    }
    @keyframes burst{to{transform:scale(7);opacity:0}}
    .hit{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;animation:hit .5s ease-out forwards}
    .hit::before,.hit::after{
      content:"";position:absolute;left:50%;top:50%;width:22px;height:2px;margin:-1px 0 0 -11px;
      background:#fff;box-shadow:0 0 5px var(--ac);
    }
    .hit::before{transform:rotate(45deg)}
    .hit::after{transform:rotate(-45deg)}
    @keyframes hit{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
    .feed{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .feed-item{
      font:800 9px var(--font);letter-spacing:.14em;text-transform:uppercase;color:#fff;
      background:rgba(18,56,128,.8);padding:4px 8px;border-left:2px solid #8ec2ff;
      animation:feed 1.8s ease forwards;
    }
    @keyframes feed{
      0%{opacity:0;transform:translateX(18px)}
      12%{opacity:1;transform:none}
      80%{opacity:1}
      100%{opacity:0}
    }

    /* ---------- kush: live spreadsheet, auto-running ---------- */
    .fx-sheet{font-family:var(--mono);font-size:9px;color:var(--ac-deep)}
    .sh-bar{
      position:absolute;left:0;right:0;top:0;height:20px;display:flex;align-items:center;gap:6px;padding:0 6px;
      background:rgba(255,255,255,.86);border-bottom:1px solid rgba(var(--ac-rgb),.5);
    }
    .sh-name{min-width:30px;padding:1px 6px;border:1px solid rgba(var(--ac-rgb),.5);background:#fff;text-align:center;color:#12432a}
    .sh-fxl{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ac-deep)}
    .sh-formula{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#12432a}
    .sh-cols{
      position:absolute;left:20px;right:0;top:20px;height:16px;display:flex;overflow:hidden;
      background:rgba(244,252,247,.78);border-bottom:1px solid rgba(var(--ac-rgb),.5);
    }
    .sh-cols span{flex:0 0 40px;text-align:center;line-height:16px;border-right:1px solid rgba(var(--ac-rgb),.35)}
    .sh-rows{
      position:absolute;left:0;top:20px;bottom:0;width:20px;overflow:hidden;padding-top:16px;
      background:rgba(244,252,247,.78);border-right:1px solid rgba(var(--ac-rgb),.5);
    }
    .sh-rows span{display:block;height:26px;line-height:26px;text-align:center;border-bottom:1px solid rgba(var(--ac-rgb),.35)}
    .sh-cols span.on,.sh-rows span.on{background:var(--ac-pale);color:#0d3a21;font-weight:700}
    .sh-grid{
      position:absolute;left:20px;top:36px;right:0;bottom:0;
      background-image:
        linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
      background-size:40px 26px;
    }
    .sh-sel{
      position:absolute;left:20px;top:36px;width:40px;height:26px;border:2px solid var(--ac);
      background:rgba(var(--ac-rgb),.26);transition:transform .18s ease-out;
    }
    .sh-sel::after{content:"";position:absolute;right:-4px;bottom:-4px;width:6px;height:6px;background:var(--ac);border:1px solid #fff}
    .sh-chart{
      position:absolute;right:8px;bottom:8px;height:42px;display:flex;align-items:flex-end;gap:4px;
      padding:6px 8px;background:rgba(255,255,255,.82);border:1px solid rgba(var(--ac-rgb),.5);border-radius:6px;
    }
    .sh-chart i{
      display:block;width:7px;height:var(--h);background:linear-gradient(180deg,var(--ac),var(--ac-deep));border-radius:2px 2px 0 0;
      transform-origin:bottom;animation:grow 3.2s cubic-bezier(.2,.7,.25,1) infinite;
      animation-delay:calc(var(--k) * .12s);
    }
    @keyframes grow{0%{transform:scaleY(.15)}30%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}

    /* ---------- mae: crafts — glitter, stitching, tape, and a felt orangutan ---------- */
    .c-pink .face{box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 44px -20px rgba(255,61,154,.55),0 0 0 1px rgba(255,255,255,.6) inset}
    .c-pink .plate .name,.c-pink .b-name{
      background:linear-gradient(100deg,#c2185b 0%,#ff3d9a 35%,#ff9bd0 50%,#ff3d9a 65%,#c2185b 100%);
      background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
      animation:pinkflow 5s linear infinite;
    }
    @keyframes pinkflow{to{background-position:-220% 0}}

    .fx-craft::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(120% 80% at 50% 100%,rgba(var(--ac-rgb),.28),transparent 62%);
      box-shadow:inset 0 0 34px rgba(var(--ac-rgb),.28);
    }
    .fx-craft .glit{
      position:absolute;inset:0;
      background-image:
        radial-gradient(circle,#fff 0 1.1px,transparent 1.8px),
        radial-gradient(circle,#ffd1e8 0 1.1px,transparent 1.8px),
        radial-gradient(circle,#fff3bd 0 1.1px,transparent 1.8px);
      background-size:31px 29px,43px 41px,57px 53px;
      background-position:3px 5px,17px 22px,29px 9px;
      animation:glit 2.2s ease-in-out infinite;
    }
    .fx-craft .glit.b{
      background-size:37px 33px,47px 45px,59px 51px;
      background-position:19px 17px,5px 8px,41px 31px;
      animation-delay:-1.1s;
    }
    .card:hover .fx-craft .glit{animation-duration:1s}
    @keyframes glit{0%,100%{opacity:.1}50%{opacity:.85}}
    .fx-craft .dust{
      position:absolute;left:var(--x);top:-4%;width:4px;height:4px;border-radius:50%;
      background:#fff;box-shadow:0 0 6px 2px rgba(255,61,154,.6);opacity:0;
      animation:dust var(--t) linear infinite;animation-delay:var(--dl);
    }
    .fx-craft .dust.gold{box-shadow:0 0 6px 2px rgba(240,190,60,.75);background:#fff6c9}
    @keyframes dust{
      0%{opacity:0;transform:translate(0,0)}
      10%{opacity:1}
      50%{transform:translate(8px,130px)}
      90%{opacity:1}
      100%{opacity:0;transform:translate(-6px,260px)}
    }
    .fx-craft .stitch{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 3px rgba(255,61,154,.8))}
    .fx-craft .stitch rect{
      width:calc(100% - 14px);height:calc(100% - 14px);
      fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 6;
      animation:stitchmove 1.6s linear infinite;
    }
    @keyframes stitchmove{to{stroke-dashoffset:-24}}
    .fx-craft .tape{
      position:absolute;width:74px;height:20px;z-index:4;
      background:repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 5px,rgba(255,61,154,.62) 5px 10px);
      box-shadow:0 2px 4px rgba(120,10,60,.25);
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 4px,#000 calc(100% - 4px),transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 4px,#000 calc(100% - 4px),transparent 100%);
    }
    .fx-craft .tape.t1{top:12px;left:-18px;transform:rotate(-38deg)}
    .fx-craft .tape.t2{bottom:12px;right:-18px;transform:rotate(-38deg)}
    .fx-craft .spk{
      position:absolute;left:var(--x);top:var(--y);
      width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      background:radial-gradient(circle,#fff 0 25%,#ffd1e8 60%,#ff3d9a 100%);
      clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
      pointer-events:none;
    }
    .fx-craft .spk.gold{background:radial-gradient(circle,#fff 0 25%,#fff0b0 55%,#e0a82e 100%)}
    .fx-craft .spk.twinkle{animation:twinkle 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
    .fx-craft .spk.pop{animation:pop .85s ease-out forwards}
    @keyframes pop{
      0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}
      100%{transform:translate(var(--dx,0),var(--dy,18px)) scale(1) rotate(200deg);opacity:0}
    }

    /* the felt orangutan, hanging off the top edge of mae's card */
    .orang{
      position:absolute;z-index:8;top:-6px;right:20px;width:66px;height:89px;pointer-events:none;
      transform-origin:69% 6.5%;
      animation:swing 3.6s ease-in-out infinite;
      filter:drop-shadow(0 8px 7px rgba(120,20,60,.35));
      transition:opacity .3s ease;
    }
    .orang svg{width:100%;height:100%;display:block;overflow:visible}
    .card:hover .orang{animation-duration:1.5s}
    .card.flipped .orang{opacity:0}
    @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .orang .f{fill:#f07a1c;stroke:#a8480b;stroke-width:2.2;stroke-linejoin:round}
    .orang .s{fill:none;stroke:#ffe0b8;stroke-width:1;stroke-dasharray:3 2.6;stroke-linecap:round}
    .orang .belly{fill:#ffa24d;stroke:#ffe0b8;stroke-width:1;stroke-dasharray:3 2.6}
    .orang .fur{stroke:#ffe0b8;stroke-width:1;stroke-linecap:round;fill:none}
    .orang .eye{fill:#3b1a08;transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
    .orang .waveL{transform-origin:28px 62px}
    .card:hover .orang .waveL{animation:wave .55s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
    .orang .legs{transform-origin:42px 90px;animation:kick 3.6s ease-in-out infinite}
    @keyframes kick{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}

    @media (prefers-reduced-motion:reduce){
      .c-pink .plate .name,.c-pink .b-name,.fx-craft .stitch rect,.fx-craft .spk.twinkle,.fx-craft .glit,
      .orang,.orang .eye,.orang .legs,.card:hover .orang .waveL{animation:none}
      .fx-craft .spk.twinkle{transform:none;opacity:1}
      .fx-craft .glit{opacity:.5}
      .fx-craft .dust{display:none}
    }

    /* ================================================================
       GARYBOY: the DLC card. dark, mono, sharp corners, its own species.
       everything here is scoped to .c-dlc so the GOAT cards are untouched.
       ================================================================ */
    .c-dlc .face{
      border-radius:18px;
      background:radial-gradient(120% 70% at 50% 0%,var(--ink2),var(--ink) 70%);
      box-shadow:0 1px 2px rgba(0,0,0,.08),0 26px 44px -22px rgba(60,20,130,.55);
    }

    /* corner brackets instead of a rounded keyline */
    .brk{position:absolute;inset:8px;pointer-events:none;z-index:7}
    .brk i{position:absolute;width:12px;height:12px;border:0 solid rgba(var(--ac-rgb),.85)}
    .brk i:nth-child(1){left:0;top:0;border-width:1px 0 0 1px}
    .brk i:nth-child(2){right:0;top:0;border-width:1px 1px 0 0}
    .brk i:nth-child(3){left:0;bottom:0;border-width:0 0 1px 1px}
    .brk i:nth-child(4){right:0;bottom:0;border-width:0 1px 1px 0}

    /* front: purple-graded photo, fading into the dark plate */
    .c-dlc .photo-wrap{background:var(--ink2)}
    .c-dlc .photo-wrap img{
      filter:saturate(.9) contrast(1.06) drop-shadow(0 0 0 rgba(255,0,120,0)) drop-shadow(0 0 0 rgba(0,200,255,0));
    }
    .c-dlc .photo-wrap::before{
      content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(160deg,rgba(var(--ac-rgb),.55),rgba(50,14,110,.45));mix-blend-mode:soft-light;
    }
    .c-dlc .photo-wrap::after{height:34%;z-index:2;background:linear-gradient(to top,var(--ink),transparent)}
    .c-dlc .sheen{
      z-index:4;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 55%),
        linear-gradient(115deg,transparent calc(var(--mx,50%) - 22%),rgba(var(--ac-rgb),.3) var(--mx,50%),transparent calc(var(--mx,50%) + 22%));
    }
    .c-dlc .photo-wrap.empty{background:radial-gradient(120% 90% at 50% 20%,var(--ac-line),var(--ink))}
    .c-dlc .photo-wrap.empty::before,.c-dlc .photo-wrap.empty::after{display:none}
    .c-dlc .photo-wrap .initial{font-style:normal;color:rgba(var(--ac-rgb),.55)}
    .c-dlc:hover .photo-wrap img{animation:split .5s steps(3) 1}
    @keyframes split{
      0%{filter:saturate(.9) contrast(1.06) drop-shadow(4px 0 0 rgba(255,0,120,.55)) drop-shadow(-4px 0 0 rgba(0,200,255,.55))}
      45%{filter:saturate(.9) contrast(1.06) drop-shadow(-3px 0 0 rgba(255,0,120,.45)) drop-shadow(3px 0 0 rgba(0,200,255,.45))}
      100%{filter:saturate(.9) contrast(1.06) drop-shadow(0 0 0 rgba(255,0,120,0)) drop-shadow(0 0 0 rgba(0,200,255,0))}
    }
    .c-dlc .chip{
      position:absolute;top:15px;left:15px;z-index:5;font:800 9px var(--font);letter-spacing:.16em;text-transform:uppercase;
      padding:4px 8px;line-height:1;background:var(--ac);color:var(--ink);
    }

    /* front: plate */
    .c-dlc .plate{background:none}
    .c-dlc .plate .name{font-size:28px;letter-spacing:-.02em;color:var(--paper);line-height:1.3;padding-bottom:.05em}
    .c-dlc .plate .title{font-style:normal;font-size:10px;letter-spacing:.02em;text-transform:uppercase;line-height:1.2}
    .c-dlc .plate .title::before{transform:none}
    .c-dlc .meta{display:flex;justify-content:flex-end;align-items:center;font:700 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
    .c-dlc .meta .hint{display:flex;align-items:center;gap:5px;color:var(--ac-deep);transition:color .3s ease}
    .c-dlc .meta .hint b{font-weight:700;font-size:10px;display:inline-block;animation:nudge 3.6s ease-in-out infinite}
    .c-dlc:hover .meta .hint{color:#fff}

    /* back: scanlines, mono type, segmented bars */
    .c-dlc .face.back{
      padding:20px 17px 15px;
      background:radial-gradient(120% 70% at 50% 0%,var(--ink2),var(--ink) 70%);
    }
    .c-dlc .face.back::before{background:repeating-linear-gradient(to bottom,rgba(var(--ac-rgb),.05) 0 1px,transparent 1px 3px)}
    .c-dlc .face.back::after{
      background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 45%,rgba(var(--ac-rgb),.18) 50%,transparent 68%);
    }
    .c-dlc .face.back > .brk{position:absolute}
    .c-dlc .b-name{font-size:22px;letter-spacing:-.02em;color:var(--paper);line-height:1.3;padding-bottom:.05em}
    .c-dlc .back-title{margin-top:5px;font-style:normal;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase}
    .c-dlc .back-rule{margin:14px 0 6px;background:rgba(var(--ac-rgb),.3)}
    .c-dlc .moves li{padding:8px 0 9px;border-bottom-color:rgba(var(--ac-rgb),.14)}
    .c-dlc .m-name{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper)}
    .c-dlc .m-name em{
      font:700 7.5px var(--mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle;
      margin-left:8px;padding:2px 5px;color:#ff8fa0;border:1px solid rgba(255,143,160,.55);
    }
    .c-dlc .m-pow{color:var(--paper)}
    .seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:8px}
    .seg i{position:relative;height:5px;background:rgba(var(--ac-rgb),.17)}
    .seg i.on::after{content:"";position:absolute;inset:0;background:var(--ac);opacity:0;transition:opacity .15s ease}
    .card.flipped .seg i.on::after{opacity:1;transition-delay:calc(.5s + var(--k) * .14s + var(--s) * .03s)}
    .c-dlc .moves li.max .m-pow{color:var(--ac-pale)}
    .c-dlc .moves li.max .seg i.on::after{background:var(--ac-pale)}
    .c-dlc .moves li.bug .m-pow{color:#ff8fa0}
    .c-dlc .moves li.bug .seg i.on::after{background:#ff6b81}

    /* ---------- garyboy: purple haze + scanlines, auto-running ---------- */
    .fx-haze{opacity:.9;transition:opacity .5s ease,transform .8s cubic-bezier(.2,.7,.25,1)}
    .fx-haze::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(var(--ac-rgb),.28),transparent 65%);
    }
    .fx-haze .puff{
      position:absolute;left:var(--x);top:var(--y);width:70%;height:50%;border-radius:50%;
      background:radial-gradient(closest-side,rgba(var(--ac-rgb),.7),rgba(var(--ac-rgb),.22) 55%,transparent);
      filter:blur(18px);opacity:.35;mix-blend-mode:screen;
      animation:haze var(--t) ease-in-out infinite;animation-delay:var(--dl);
    }
    @keyframes haze{
      0%,100%{transform:translate(0,0) scale(.9);opacity:.2}
      50%{transform:translate(var(--dx),-14%) scale(1.15);opacity:.6}
    }
    .fx-haze .scan{
      position:absolute;inset:0;
      background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);
    }
    .fx-haze .scan::after{
      content:"";position:absolute;left:0;right:0;top:0;height:28%;
      background:linear-gradient(to bottom,transparent,rgba(var(--ac-rgb),.3),transparent);
      animation:scanmove 6.5s linear infinite;
    }
    @keyframes scanmove{from{transform:translateY(-100%)}to{transform:translateY(380%)}}
    .c-dlc:hover .fx-haze{opacity:1;transform:scale(1.05)}
    .c-dlc:hover .fx-haze .scan::after{animation-duration:2.4s}

    /* ================= tune mode (?tune) ================= */
    body.tune .card{cursor:grab}
    body.tune .fx,body.tune .flip-hint,body.tune .meta,body.tune .chip,body.tune .sheen,body.tune .crown,body.tune .halo,body.tune .orang,body.tune .hang{display:none}
    body.tune .c-dlc .photo-wrap::before,body.tune .c-dlc .photo-wrap::after{display:none}
    body.tune .c-dlc:hover .photo-wrap img{animation:none}
    body.tune .photo-wrap{outline:2px dashed #e5484d;outline-offset:-2px}
    #tuner{
      position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:90;width:min(560px,calc(100vw - 24px));
      background:#111;color:#f4f4f4;border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:12px;
      box-shadow:0 18px 40px -10px rgba(0,0,0,.5);
    }
    #tuner h3{font:400 18px var(--serif);font-style:italic;margin-bottom:8px;color:var(--gold-pale)}
    #tuner p{color:#aaa;margin-bottom:10px;line-height:1.5}
    .t-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #2a2a2a}
    .t-row code{flex:1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .t-row button{background:#2a2a2a;color:#fff;border:0;border-radius:6px;width:26px;height:26px;cursor:pointer;font:700 14px var(--mono)}
    .t-row button:hover{background:#3a3a3a}

    @media (max-width:640px){
      :root{--gutter:18px}
      #nav{padding:0 16px}
      #body{padding-top:14px;padding-bottom:64px}
      #wall{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:34px 14px;padding-top:46px}
      .plate{padding:2px 14px 8px;gap:5px}
      .plate .name{font-size:25px}
      .plate .title{font-size:14px}
      .flip-hint{font-size:12px}
      .flip-hint b{width:17px;height:17px;font-size:10px}
      .crown{width:46px;height:35px;margin-left:-23px;top:-18px}
      #scroll-btn{font-size:19px}
      #s-content{padding:34px 22px 28px}
      #s-title{font-size:48px}
      #s-rules .txt{font-size:25px}
      /* garyboy */
      .c-dlc .plate .name{font-size:23px}
      .c-dlc .plate .title{font-size:8.5px;letter-spacing:.02em}
      .c-dlc .face.back{padding:16px 13px 12px}
      .c-dlc .b-name{font-size:19px}
      .c-dlc .back-title{font-size:8px}
      .c-dlc .back-rule{margin:10px 0 4px}
      .c-dlc .moves li{padding:6px 0 7px}
      .c-dlc .m-name{font-size:12px}
      .seg{margin-top:6px}
    }
    @media (prefers-reduced-motion:reduce){
      .kl{animation:none;opacity:1;transform:none}
      #scroll-btn,.card,.hang{animation-duration:.01s}
      #s-body,#scroll-modal.open #s-body{transition:none}
      .reveal,#scroll-modal.open .reveal{transition:none}
      .halo::before,.ember,.reticle svg,.fx-aura .foil,.crown,.flip-hint b,.sh-chart i{animation:none}
      .ember{display:none}
      .fx-haze .puff{animation:none;opacity:.35}
      .fx-haze .scan::after{animation:none;display:none}
      .fx-haze,.c-dlc:hover .fx-haze{transition:none;transform:none}
      .c-dlc .meta .hint b{animation:none}
      .c-dlc:hover .photo-wrap img{animation:none}
    }
    /* ===== phone fix: stop the front's effects showing through the back ===== */
    .face *{-webkit-backface-visibility:hidden;backface-visibility:hidden}

    /* front: visible until the flip is halfway, then hidden */
    .face.front{visibility:visible;transition:visibility 0s 0s}
    .card.flipped .face.front{visibility:hidden;transition:visibility 0s .12s}

    /* back: hidden until the flip starts, hidden again once flipped back */
    .face.back{visibility:hidden;transition:visibility 0s .12s}
    .card.flipped .face.back{visibility:visible;transition:visibility 0s 0s}

    /* the front effects also sit below the back's content, so taps and hovers never hit them */
    .card.flipped .fx{pointer-events:none}
  </style>
</head>
<body>
  <div id="page">
    <nav id="nav">
      <a id="nav-back" href="https://ajchapa.com/">← ajchapa</a>
      <span id="nav-time">—</span>
    </nav>

    <header id="hero" class="col">
      <h1 id="title" aria-label="The Wall"></h1>

      <button id="scroll-btn" type="button" aria-label="Read the code">
        <svg viewBox="0 0 64 48" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#8a6a1f"/><stop offset=".4" stop-color="#f1dfa8"/><stop offset=".7" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6a1f"/>
            </linearGradient>
            <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9a1826"/><stop offset="1" stop-color="#3b060c"/>
            </linearGradient>
            <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7eccf"/><stop offset="1" stop-color="#ecdcae"/>
            </linearGradient>
          </defs>
          <rect class="paper" x="10" y="9" width="44" height="30" fill="url(#p)" stroke="#c9a227" stroke-width=".8"/>
          <g stroke="#7a0f1a" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round">
            <line x1="19" y1="18" x2="45" y2="18"/><line x1="19" y1="24" x2="45" y2="24"/><line x1="19" y1="30" x2="36" y2="30"/>
          </g>
          <rect x="6" y="3" width="52" height="9" rx="4.5" fill="url(#r)" stroke="#c9a227" stroke-width=".8"/>
          <rect x="6" y="36" width="52" height="9" rx="4.5" fill="url(#r)" stroke="#c9a227" stroke-width=".8"/>
          <rect x="2" y="1" width="6" height="13" rx="3" fill="url(#g)"/><rect x="56" y="1" width="6" height="13" rx="3" fill="url(#g)"/>
          <rect x="2" y="34" width="6" height="13" rx="3" fill="url(#g)"/><rect x="56" y="34" width="6" height="13" rx="3" fill="url(#g)"/>
        </svg>
        <span>Code</span>
      </button>
    </header>

    <div id="body" class="col">
      <main id="wall"></main>
    </div>
  </div>

  <!-- the scroll -->
  <div id="scroll-modal" aria-hidden="true">
    <div id="scroll" role="dialog" aria-modal="true" aria-labelledby="s-title">
      <div class="rod"></div>
      <div id="s-body"><div id="s-inner"><div id="s-content">
        <button id="s-close" type="button" aria-label="Close">×</button>
        <h2 id="s-title" class="reveal" style="--i:0">Code</h2>
        <div class="orn reveal" style="--i:1">◆</div>
        <ol id="s-rules"></ol>
      </div></div></div>
      <div class="rod"></div>
    </div>
  </div>

  <script>
    // ─────────────────────────────
    //  ADD YOUR PEOPLE HERE
    //  photo : exact filename in the repo (case matters!)
    //  pos / zoom : photo placement. Use  yoursite/goats.html?tune  to dial it in.
    //  color : "gold" | "blue" | "green" | "pink" | "dlc"      fx : "aura" | "aim" | "sheet" | "craft" | "haze" | ""
    //  hp    : formula A — the average of the three moves, rounded (ajchapa stays "???")
    //  moves : three  ["Move name", power 1-100]   (placeholders for now)
    // ─────────────────────────────
    const GOATS = [
      { name:"ajchapa", title:"Thee Goat?",
        photo:"/ajchapa.JPG", pos:"50% 25%", zoom:1,
        color:"gold", fx:"aura",
        hp:"???",
        moves:[["Self Glaze", 120], ["Chill", 80], ["Cancer", 0]] },

      { name:"Alex", title:"Goat of Fortnite",
        photo:"/Alex.jpg", pos:"50% 25%", zoom:1,
        color:"blue", fx:"aim",
        hp:63,
        moves:[["Likability", 90], ["Nice Guy", 100], ["1v1 vs ajchapa", 0]] },

      { name:"Kush", title:"Goat of Excel",
        photo:"/5E063B38-E541-412F-B0DE-A586461C325A.jpeg", pos:"50% 25%", zoom:1,
        color:"green", fx:"sheet",
        hp:65,
        moves:[["Handsome", 85], ["Work Life Balance", 30], ["Shopaholic", 80]] },

      { name:"Mae", title:"Goat of Crafts",
        photo:"/Mae.jpg", pos:"52% 22%", zoom:1.6,
        color:"pink", fx:"craft",
        hp:74,
        moves:[["Heart", 101], ["Analytical Reasoning", 90], ["Athleticism", 30]] },

      { name:"GaryBoy", title:"Walking Lunch Money",
        photo:"/Gary.png", pos:"50% 25%", zoom:1,
        color:"dlc", fx:"haze",
        hp:70,
        moves:[["Liver & Lungs", 50], ["Personable", 80], ["Chef", 80]] },
    ];
    const RULES = [
      ["i.",   "Picked by urs truly"],
      ["ii.",  "Any title can change hands"],
      ["iii.", "Made with luh -ajchapa"],
    ];

    const wall = document.getElementById("wall");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const TUNE = new URLSearchParams(location.search).has("tune");
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    if (TUNE) document.body.classList.add("tune");

    // ── HEIC: Safari shows it natively; other browsers get a converter only if needed
    let heicLib = null;
    function loadHeicLib() {
      if (heicLib) return heicLib;
      heicLib = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js";
        s.onload = () => res(window.heic2any); s.onerror = rej;
        document.head.appendChild(s);
      });
      return heicLib;
    }
    async function heicToUrl(src) {
      const [conv, blob] = await Promise.all([loadHeicLib(), fetch(src).then((r) => r.blob())]);
      let out = await conv({ blob, toType: "image/jpeg", quality: 0.88 });
      if (Array.isArray(out)) out = out[0];
      return URL.createObjectURL(out);
    }

    // ── effect markup
    const LETTERS = "ABCDEFGHIJKLMNOP";
    const CROWN = `<div class="crown" aria-hidden="true"><svg viewBox="0 0 64 48">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1bd"/><stop offset=".5" stop-color="#d9a83a"/><stop offset="1" stop-color="#8a6a1f"/></linearGradient></defs>
      <path d="M6 38 L10 14 L22 26 L32 8 L42 26 L54 14 L58 38 Z" fill="url(#cg)" stroke="#8a6a1f" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="6" y="38" width="52" height="6" rx="2" fill="url(#cg)" stroke="#8a6a1f" stroke-width="1.2"/>
      <circle cx="10" cy="14" r="3" fill="#fff1bd" stroke="#8a6a1f"/><circle cx="32" cy="8" r="3.4" fill="#9a1826" stroke="#8a6a1f"/><circle cx="54" cy="14" r="3" fill="#fff1bd" stroke="#8a6a1f"/>
      <circle cx="32" cy="31" r="2.4" fill="#9a1826"/><circle cx="20" cy="33" r="1.8" fill="#fff1bd"/><circle cx="44" cy="33" r="1.8" fill="#fff1bd"/></svg></div>`;

    // the nail and wire the card hangs from
    const HANG = `<div class="hang" aria-hidden="true">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none"><line x1="50" y1="0" x2="14" y2="40"/><line x1="50" y1="0" x2="86" y2="40"/></svg>
      <i></i></div>`;

    // corner brackets (the dlc card uses these instead of the rounded keyline)
    const BRK = `<div class="brk" aria-hidden="true"><i></i><i></i><i></i><i></i></div>`;

    function fxMarkup(kind) {
      if (kind === "aura") return `<div class="fx fx-aura"><div class="foil"></div></div>`;
      if (kind === "aim") return `<div class="fx fx-aim"><div class="agrid"></div>
        <div class="hud"><div class="bar shield"><i></i></div><div class="bar hp"><i></i></div></div>
        <div class="feed"></div>
        <div class="reticle"><svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="28" cy="28" r="15"/>
          <path d="M28 4v14M28 38v14M4 28h14M38 28h14"/>
          <circle cx="28" cy="28" r="1.8" fill="currentColor" stroke="none"/></svg></div></div>`;
      if (kind === "sheet") {
        const cols = [...LETTERS].slice(0, 10).map((l) => `<span>${l}</span>`).join("");
        const rows = Array.from({ length: 12 }, (_, i) => `<span>${i + 1}</span>`).join("");
        const bars = [38, 62, 48, 84, 100].map((h, k) => `<i style="--h:${h}%;--k:${k}"></i>`).join("");
        return `<div class="fx fx-sheet">
          <div class="sh-grid"></div><div class="sh-sel"></div>
          <div class="sh-bar"><span class="sh-name">A1</span><span class="sh-fxl">fx</span><span class="sh-formula">=VLOOKUP(A1,Wall,2,0)</span></div>
          <div class="sh-cols">${cols}</div><div class="sh-rows">${rows}</div>
          <div class="sh-chart">${bars}</div></div>`;
      }
      if (kind === "haze") {
        // x, y (% of photo), drift duration (s), delay (s), horizontal drift
        const puffs = [[-18, 48, 13, 0, "26%"], [30, 8, 17, -5, "-22%"], [-6, 22, 15, -9, "20%"], [38, 55, 19, -3, "-28%"], [8, 62, 14, -11, "24%"]]
          .map(([x, y, t, dl, dx]) => `<i class="puff" style="--x:${x}%;--y:${y}%;--t:${t}s;--dl:${dl}s;--dx:${dx}"></i>`).join("");
        return `<div class="fx fx-haze"><div class="scan"></div>${puffs}</div>`;
      }
      if (kind === "craft") {
        const pts = [
          [12,14,10],[78,10,14],[44,28,8],[88,42,9],[20,52,12],[62,60,8],[34,78,11],[84,80,13],
          [8,86,7],[52,12,9],[26,30,7],[70,36,10],[50,88,9],[92,66,8],[14,70,9],[60,80,7]
        ];
        const twinkles = pts.map(([x, y, s], i) =>
          `<i class="spk twinkle${i % 3 === 0 ? " gold" : ""}" style="--x:${x}%;--y:${y}%;--s:${s}px;--dl:${(i * 0.29).toFixed(2)}s"></i>`).join("");
        const dust = [6,16,28,38,49,58,69,79,88,95].map((x, i) =>
          `<i class="dust${i % 2 ? " gold" : ""}" style="--x:${x}%;--t:${(4.5 + (i * 0.7) % 3).toFixed(2)}s;--dl:${(-(i * 0.9)).toFixed(2)}s"></i>`).join("");
        return `<div class="fx fx-craft">
          <div class="glit"></div><div class="glit b"></div>
          <svg class="stitch" aria-hidden="true"><rect x="7" y="7" rx="12"/></svg>
          <span class="tape t1"></span><span class="tape t2"></span>
          ${twinkles}${dust}</div>`;
      }
      return "";
    }
    function haloMarkup() {
      const spots = [-4, 2, 7, 93, 98, 104, 30, 55, 78];
      const embers = spots.map((x, i) => {
        const t = (4 + (i * 0.53) % 2.6).toFixed(2), dl = (-(i * 0.9) % 5).toFixed(2), dx = (((i % 3) - 1) * 18) + "px";
        return `<i class="ember" style="--x:${x}%;--t:${t}s;--dl:${dl}s;--dx:${dx}"></i>`;
      }).join("");
      return `<div class="halo" aria-hidden="true">${embers}</div>`;
    }

    // mae's felt orangutan (hangs off the card's top edge, like ajchapa's crown)
    function orangMarkup() {
      return `<div class="orang" aria-hidden="true">
        <svg viewBox="0 0 90 122">
          <defs>
            <path id="o-legL"  d="M28 88 C23 100 23 110 27 116 L39 114 C38 106 41 98 42 90 Z"/>
            <path id="o-legR"  d="M44 90 C46 100 48 108 46 115 L58 116 C61 108 59 97 56 88 Z"/>
            <path id="o-body"  d="M42 54 C62 54 66 74 63 88 C60 99 24 99 21 88 C18 74 22 54 42 54 Z"/>
            <path id="o-armL"  d="M28 62 C14 62 7 52 6 40 L16 38 C17 48 22 52 32 54 Z"/>
            <circle id="o-handL" cx="11" cy="38" r="6"/>
            <path id="o-armR"  d="M56 56 C59 40 58 24 57 10 L68 10 C69 26 69 44 66 58 Z"/>
            <circle id="o-handR" cx="62.5" cy="8" r="6.5"/>
            <path id="o-head"  d="M26 44 C22 28 32 18 42 18 C52 18 62 28 58 44 C52 52 32 52 26 44 Z"/>
          </defs>
          <g class="legs">
            <use href="#o-legL" class="f"/><use href="#o-legL" class="s"/>
            <use href="#o-legR" class="f"/><use href="#o-legR" class="s"/>
          </g>
          <g class="waveL">
            <use href="#o-armL" class="f"/><use href="#o-armL" class="s"/>
            <use href="#o-handL" class="f"/><use href="#o-handL" class="s"/>
          </g>
          <use href="#o-body" class="f"/><use href="#o-body" class="s"/>
          <ellipse class="belly" cx="42" cy="78" rx="11" ry="12"/>
          <path class="fur" d="M26 70l4 3M58 70l-4 3M24 84l4 2M60 84l-4 2M34 62l2 4M50 62l-2 4"/>
          <use href="#o-armR" class="f"/><use href="#o-armR" class="s"/>
          <use href="#o-handR" class="f"/><use href="#o-handR" class="s"/>
          <use href="#o-head" class="f"/><use href="#o-head" class="s"/>
          <ellipse cx="42" cy="42" rx="12" ry="11.5" fill="#ffd9b0" stroke="#c8743a" stroke-width="1"/>
          <ellipse cx="42" cy="48" rx="6.5" ry="4.5" fill="#f6b98a"/>
          <circle cx="33" cy="45" r="2.4" fill="#ff7ab8" opacity=".7"/>
          <circle cx="51" cy="45" r="2.4" fill="#ff7ab8" opacity=".7"/>
          <circle class="eye" cx="37.5" cy="40" r="1.7"/>
          <circle class="eye" cx="46.5" cy="40" r="1.7"/>
          <circle cx="40.5" cy="47.5" r=".7" fill="#7a3510"/>
          <circle cx="43.5" cy="47.5" r=".7" fill="#7a3510"/>
          <path d="M39 50.5 Q42 52.8 45 50.5" stroke="#7a3510" stroke-width=".9" fill="none" stroke-linecap="round"/>
        </svg></div>`;
    }

    // ── build the cards
    GOATS.forEach((g, i) => {
      const dlc = g.color === "dlc";
      const card = document.createElement("article");
      card.className = "card c-" + (g.color || "gold");
      card.dataset.fx = g.fx || "";
      card.style.animationDelay = (i * 110) + "ms";
      card.style.setProperty("--pos", g.pos || "50% 25%");
      card.style.setProperty("--zoom", g.zoom || 1);
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", g.name + ", " + g.title + ". Activate to flip.");

      const fx = fxMarkup(g.fx);
      const chip = dlc ? `<span class="chip">DLC</span>` : "";
      const photo = g.photo
        ? `<div class="photo-wrap"><img src="${g.photo}" alt="${g.name}" decoding="async" draggable="false">
             <div class="sheen"></div>${fx}${chip}</div>`
        : `<div class="photo-wrap empty"><div class="initial">${g.name[0]}</div>${fx}${chip}</div>`;

      const moves = (g.moves || []).map(([n, p], k) => {
        const mystery = n === "???";
        const over = !mystery && Number(p) > 100;
        const maximum = !mystery && !over && Number(p) === 100;

        // Keep the displayed number accurate, but never let the bar
        // extend beyond the width of its track.
        const width = clamp(Number(p) || 0, 0, 100);

        const classes = [
          mystery ? "mystery" : "",
          maximum ? "max" : "",
          over ? "over" : "",
          n.length > 17 ? "long" : ""
        ].filter(Boolean).join(" ");

        return `
          <li class="${classes}" style="--k:${k}">
            <div class="m-row">
              <span class="m-name">${n}</span>
              <span class="m-pow">${mystery ? "?" : p}</span>
            </div>
            <div class="m-bar">
              <i style="--w:${width / 100}"></i>
            </div>
          </li>
        `;
      }).join("");

      // dlc moves: 20-block segmented meters, plus a red tag when a stat is 10 or below
      const SEGS = 20;
      const dlcMoves = dlc ? (g.moves || []).map(([n, p], k) => {
        const power = clamp(Number(p) || 0, 0, 100);
        const lit = Math.round(power / 100 * SEGS);
        const bug = power <= 10;
        const cls = [power === 100 ? "max" : "", bug ? "bug" : ""].filter(Boolean).join(" ");
        const segs = Array.from({ length: SEGS }, (_, s) => `<i class="${s < lit ? "on" : ""}" style="--s:${s}"></i>`).join("");
        return `
          <li class="${cls}" style="--k:${k}">
            <div class="m-row"><span class="m-name">${n}${bug ? "<em>known issue</em>" : ""}</span><span class="m-pow">${p}</span></div>
            <div class="seg">${segs}</div>
          </li>`;
      }).join("") : "";

      card.innerHTML = dlc ? `
        <div class="flipper"><div class="tilter">
          <div class="face front">
            ${BRK}${photo}
            <div class="plate">
              <div class="name">${g.name}</div>
              <div class="title"><span>${g.title}</span></div>
              <div class="meta"><span class="hint"><b>↻</b>flip</span></div>
            </div>
          </div>
          <div class="face back">
            ${BRK}
            <div class="b-top"><div class="b-name">${g.name}</div><div class="b-hp">HP<b>${g.hp ?? "—"}</b></div></div>
            <div class="back-title">${g.title}</div>
            <div class="back-rule"></div>
            <ul class="moves">${dlcMoves}</ul>
          </div>
        </div></div>` : `
        ${g.fx === "aura" && !reduceMotion ? haloMarkup() : ""}${g.fx === "craft" && !reduceMotion ? orangMarkup() : ""}
        <div class="flipper"><div class="tilter">
          <div class="face front">
            <div class="keyline"></div>${photo}
            <div class="plate">
              <div class="row">
                <div class="name">${g.name}</div>
                <div class="flip-hint"><b>↻</b>flip</div>
              </div>
              <div class="title"><span>${g.title}</span></div>
            </div>
          </div>
          <div class="face back">
            <div class="keyline"></div>
            <div class="b-top">
              <div class="b-name">${g.name}</div>
              <div class="b-hp">HP<b>${g.hp ?? "—"}</b></div>
            </div>
            <div class="back-title">${g.title}</div>
            <div class="back-rule"></div>
            <ul class="moves">${moves}</ul>
          </div>
        </div></div>`;

      const img = card.querySelector(".photo-wrap img");
      if (img) {
        let tried = false;
        const giveUp = () => {
          img.parentElement.classList.add("empty");
          img.replaceWith(Object.assign(document.createElement("div"), { className: "initial", textContent: g.name[0] }));
        };
        img.addEventListener("error", async () => {
          if (!tried && /\.heic$/i.test(g.photo)) {
            tried = true;
            try { img.src = await heicToUrl(g.photo); return; } catch (_) {}
          }
          giveUp();
        });
      }

      const flip = () => { if (!TUNE) card.classList.toggle("flipped"); };
      card.addEventListener("click", flip);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      wall.appendChild(card);
      if (!TUNE) bindFx(card, g.fx);
    });

    // ── effects: they run on their own, and take over when you hover
    const FEED = ["Eliminated", "Headshot", "Clutch", "Victory"];
    function bindFx(card, kind) {
      const wrap = card.querySelector(".photo-wrap");
      const fx = card.querySelector(".fx");
      if (!fx || reduceMotion) return;

      if (kind === "aim") {
        const ret = fx.querySelector(".reticle");
        const feed = fx.querySelector(".feed");
        let hovering = false, n = 0, lx = 0, ly = 0;
        const move = (x, y) => {
          lx = x; ly = y;
          ret.style.transform = `translate(${x}px,${y}px)`;
          fx.style.setProperty("--fx", x + "px");
          fx.style.setProperty("--fy", y + "px");
        };
        const shoot = (x, y) => {
          ["burst", "hit"].forEach((cls) => {
            const b = document.createElement("i");
            b.className = cls; b.style.left = x + "px"; b.style.top = y + "px";
            fx.appendChild(b);
            b.addEventListener("animationend", () => b.remove());
          });
          const item = document.createElement("div");
          item.className = "feed-item";
          item.textContent = FEED[n++ % FEED.length];
          feed.appendChild(item);
          while (feed.children.length > 3) feed.firstChild.remove();
          item.addEventListener("animationend", () => item.remove());
        };
        const size = () => wrap.getBoundingClientRect();
        let t = 0;
        move(size().width * .5, size().height * .4);
        setInterval(() => {
          if (hovering || document.hidden) return;
          const r = size(); t++;
          move(r.width * (.2 + Math.random() * .6), r.height * (.2 + Math.random() * .55));
          if (t % 2 === 0) setTimeout(() => { if (!hovering) shoot(lx, ly); }, 750);
        }, 1700);

        wrap.addEventListener("pointerenter", () => { hovering = true; ret.classList.add("live"); });
        wrap.addEventListener("pointerleave", () => { hovering = false; ret.classList.remove("live"); });
        wrap.addEventListener("pointermove", (e) => {
          const r = size(); move(e.clientX - r.left, e.clientY - r.top);
        });
        wrap.addEventListener("click", (e) => {
          const r = size(); shoot(e.clientX - r.left, e.clientY - r.top);
        });
      }

      if (kind === "sheet") {
        const sel = fx.querySelector(".sh-sel");
        const nameEl = fx.querySelector(".sh-name");
        const formula = fx.querySelector(".sh-formula");
        const colEls = [...fx.querySelectorAll(".sh-cols span")];
        const rowEls = [...fx.querySelectorAll(".sh-rows span")];
        let lc = -1, lr = -1, hovering = false;
        const setCell = (c, rw) => {
          if (c === lc && rw === lr) return;
          if (lc >= 0) { colEls[lc].classList.remove("on"); rowEls[lr].classList.remove("on"); }
          lc = c; lr = rw;
          colEls[c].classList.add("on"); rowEls[rw].classList.add("on");
          sel.style.transform = `translate(${c * 40}px,${rw * 26}px)`;
          const addr = LETTERS[c] + (rw + 1);
          nameEl.textContent = addr;
          formula.textContent = `=VLOOKUP(${addr},Wall,2,0)`;
        };
        const dims = () => {
          const r = wrap.getBoundingClientRect();
          return { r, maxC: Math.max(1, Math.floor((r.width - 20) / 40)), maxR: Math.max(1, Math.floor((r.height - 36) / 26)) };
        };
        setCell(1, 1);
        setInterval(() => {
          if (hovering || document.hidden) return;
          const { maxC, maxR } = dims();
          setCell(Math.floor(Math.random() * maxC), Math.floor(Math.random() * maxR));
        }, 1000);

        wrap.addEventListener("pointerenter", () => { hovering = true; });
        wrap.addEventListener("pointerleave", () => { hovering = false; });
        wrap.addEventListener("pointermove", (e) => {
          const { r, maxC, maxR } = dims();
          setCell(
            clamp(Math.floor((e.clientX - r.left - 20) / 40), 0, maxC - 1),
            clamp(Math.floor((e.clientY - r.top - 36) / 26), 0, maxR - 1)
          );
        });
      }

      if (kind === "craft") {
        const orang = card.querySelector(".orang");
        const rnd = (a, b) => a + Math.random() * (b - a);
        const sparkle = (x, y, o) => {
          const el = document.createElement("i");
          el.className = "spk pop" + (o.gold ? " gold" : "");
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--s", o.s + "px");
          el.style.setProperty("--dx", o.dx + "px");
          el.style.setProperty("--dy", o.dy + "px");
          fx.appendChild(el);
          el.addEventListener("animationend", () => el.remove());
        };
        let last = 0;
        wrap.addEventListener("pointermove", (e) => {
          const now = performance.now();
          if (now - last < 45) return;
          last = now;
          const r = wrap.getBoundingClientRect();
          sparkle(e.clientX - r.left, e.clientY - r.top,
            { s: rnd(6, 13), dx: rnd(-12, 12), dy: rnd(14, 30), gold: Math.random() < .35 });
        });
        wrap.addEventListener("click", (e) => {
          const r = wrap.getBoundingClientRect();
          for (let i = 0; i < 16; i++) {
            sparkle(e.clientX - r.left, e.clientY - r.top,
              { s: rnd(9, 21), dx: rnd(-60, 60), dy: rnd(-60, 60), gold: Math.random() < .4 });
          }
        });
        card.addEventListener("click", () => {
          if (!orang) return;
          const pr = wrap.getBoundingClientRect();
          const or = orang.getBoundingClientRect();
          const ox = or.left - pr.left + or.width / 2;
          const oy = or.top - pr.top + or.height * .55;
          for (let i = 0; i < 18; i++) {
            sparkle(ox + rnd(-16, 16), oy + rnd(-8, 12),
              { s: rnd(7, 15), dx: rnd(-40, 40), dy: rnd(70, 190), gold: Math.random() < .5 });
          }
        });
      }
    }

    // ── tune mode: drag a photo to place it, scroll or +/- to zoom
    if (TUNE) {
      const panel = document.createElement("div");
      panel.id = "tuner";
      panel.innerHTML = `<h3>photo tuner</h3>
        <p>drag a photo to position it. use − / + (or scroll) to zoom. when it looks right, copy the line into your GOATS list.</p>
        <div id="t-rows"></div>`;
      document.body.appendChild(panel);
      const rowsEl = panel.querySelector("#t-rows");
      const cardEls = [...document.querySelectorAll(".card")];

      GOATS.forEach((g, i) => {
        const card = cardEls[i];
        const wrap = card.querySelector(".photo-wrap");
        let [px, py] = (g.pos || "50% 25%").split(" ").map((v) => parseFloat(v));
        let z = g.zoom || 1;
        const row = document.createElement("div");
        row.className = "t-row";
        row.innerHTML = `<button data-d="-1" aria-label="zoom out">−</button><button data-d="1" aria-label="zoom in">+</button><code></code>`;
        rowsEl.appendChild(row);
        const code = row.querySelector("code");
        const apply = () => {
          card.style.setProperty("--pos", `${px.toFixed(0)}% ${py.toFixed(0)}%`);
          card.style.setProperty("--zoom", z.toFixed(2));
          code.textContent = `${g.name}: pos:"${px.toFixed(0)}% ${py.toFixed(0)}%", zoom:${z.toFixed(2)}`;
        };
        apply();

        let drag = null;
        wrap.addEventListener("pointerdown", (e) => {
          drag = { x: e.clientX, y: e.clientY, px, py };
          wrap.setPointerCapture(e.pointerId);
          card.style.cursor = "grabbing";
        });
        wrap.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const r = wrap.getBoundingClientRect();
          px = clamp(drag.px - ((e.clientX - drag.x) / r.width) * 100, 0, 100);
          py = clamp(drag.py - ((e.clientY - drag.y) / r.height) * 100, 0, 100);
          apply();
        });
        const end = () => { drag = null; card.style.cursor = ""; };
        wrap.addEventListener("pointerup", end);
        wrap.addEventListener("pointercancel", end);
        wrap.addEventListener("wheel", (e) => {
          e.preventDefault();
          z = clamp(z - e.deltaY * 0.002, 1, 3); apply();
        }, { passive: false });
        row.addEventListener("click", (e) => {
          const d = e.target.dataset && e.target.dataset.d;
          if (!d) return;
          z = clamp(z + Number(d) * 0.1, 1, 3); apply();
        });
      });
    }

    // ── kinetic title
    const titleEl = document.getElementById("title");
    ["The", "Wall"].forEach((w, wi) => {
      const word = document.createElement("span");
      word.className = "kword";
      word.setAttribute("aria-hidden", "true");
      [...w].forEach((ch, ci) => {
        const mask = document.createElement("span"); mask.className = "kmask";
        const l = document.createElement("span"); l.className = "kl"; l.textContent = ch;
        l.style.setProperty("--d", ((wi * 4 + ci) * 55) + "ms");
        mask.appendChild(l); word.appendChild(mask);
      });
      titleEl.appendChild(word);
      titleEl.appendChild(document.createTextNode(" "));
    });

    // ── card tilt: one rAF loop that only runs while something is moving
    const cards = [...document.querySelectorAll(".card")];
    const state = cards.map((c) => ({
      tx:0, ty:0, cx:0, cy:0, lift:0, liftT:0, active:false,
      tilter: c.querySelector(".tilter"), sheen: c.querySelector(".sheen"), dirty:false
    }));
    let running = false;
    function kick() { if (!running) { running = true; requestAnimationFrame(step); } }
    function step() {
      let busy = false;
      state.forEach((s) => {
        const dx = s.tx - s.cx, dy = s.ty - s.cy, dl = s.liftT - s.lift;
        if (Math.abs(dx) < .0008 && Math.abs(dy) < .0008 && Math.abs(dl) < .03) {
          if (s.dirty) {
            s.cx = s.tx; s.cy = s.ty; s.lift = s.liftT;
            s.tilter.style.transform = s.liftT || s.tx || s.ty
              ? `translateY(${s.lift}px) rotateY(${s.cx * 14}deg) rotateX(${-s.cy * 14}deg)` : "";
            s.dirty = false;
          }
          if (s.active) busy = true;
          return;
        }
        s.cx += dx * .14; s.cy += dy * .14; s.lift += dl * .18;
        s.tilter.style.transform =
          `translateY(${s.lift.toFixed(2)}px) rotateY(${(s.cx * 14).toFixed(2)}deg) rotateX(${(-s.cy * 14).toFixed(2)}deg)`;
        s.dirty = true; busy = true;
      });
      if (busy) requestAnimationFrame(step); else running = false;
    }
    cards.forEach((card, i) => {
      const s = state[i];
      card.addEventListener("pointermove", (e) => {
        if (reduceMotion || TUNE) return;
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        s.tx = x - .5; s.ty = y - .5; s.liftT = -6; s.active = true;
        if (s.sheen) { s.sheen.style.setProperty("--mx", (x * 100) + "%"); s.sheen.style.setProperty("--my", (y * 100) + "%"); }
        kick();
      });
      card.addEventListener("pointerleave", () => {
        s.tx = 0; s.ty = 0; s.liftT = 0; s.active = false; s.dirty = true; kick();
      });
    });

    // ── gyroscope tilt on phones (iOS asks permission on first tap)
    function enableGyro() {
      document.body.classList.add("gyro");
      let queued = false, gx = 0, gy = 0;
      addEventListener("deviceorientation", (e) => {
        if (e.gamma == null) return;
        gx = clamp(e.gamma / 40, -.5, .5); gy = clamp((e.beta - 40) / 40, -.5, .5);
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          state.forEach((s) => {
            s.tx = gx; s.ty = gy; s.liftT = -3; s.dirty = true;
            if (s.sheen) { s.sheen.style.setProperty("--mx", ((gx + .5) * 100) + "%"); s.sheen.style.setProperty("--my", ((gy + .5) * 100) + "%"); }
          });
          kick();
        });
      });
    }
    if (!reduceMotion && !TUNE && matchMedia("(hover: none)").matches && "DeviceOrientationEvent" in window) {
      addEventListener("pointerdown", async () => {
        try {
          if (typeof DeviceOrientationEvent.requestPermission === "function") {
            if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return;
          }
          enableGyro();
        } catch (_) {}
      }, { once: true });
    }

    // ── the scroll
    const modal = document.getElementById("scroll-modal");
    const openBtn = document.getElementById("scroll-btn");
    const closeBtn = document.getElementById("s-close");
    const rulesEl = document.getElementById("s-rules");

    RULES.forEach(([roman, text], ri) => {
      const li = document.createElement("li");
      li.className = "reveal";
      li.style.setProperty("--i", ri + 2);
      li.innerHTML = `<span class="roman">${roman}</span><span class="txt">${text}</span>`;
      rulesEl.appendChild(li);
    });

    function openScroll() {
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("locked");
      setTimeout(() => closeBtn.focus({ preventScroll: true }), 80);
    }
    function closeScroll() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("locked");
      openBtn.focus({ preventScroll: true });
    }
    openBtn.addEventListener("click", openScroll);
    closeBtn.addEventListener("click", closeScroll);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeScroll(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeScroll(); });

    // ── live clock
    function clock() {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      document.getElementById("nav-time").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    clock(); setInterval(clock, 1000);
  </script>
</body>
</html>
