<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goats — ajchapa</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============ goats — ajchapa.com/goats.html ============
       same theme as the rest of the site: white, hairlines,
       Mulish. to add a goat, copy an entry in the GOATS
       array at the bottom of this file.                     */

    :root {
      --bg:         #ffffff;
      --border:     #ebebeb;
      --text-main:  #000000;
      --text-muted: #888888;
      --font:       'Mulish', sans-serif;
      --mono:       Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    #page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* same nav as index */
    #nav {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    #nav-back { font-size: 12px; color: var(--text-muted); letter-spacing: .04em; }
    #nav-back:hover { color: var(--text-main); }
    #nav-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

    #body {
      flex: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }

    h1#title {
      font-weight: 800;
      font-size: clamp(34px, 5vw, 52px);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    #count {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--mono);
      letter-spacing: .06em;
    }

    /* ---------- the grid ---------- */
    #wall {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 40px 28px;
    }

    .goat { opacity: 0; animation: rise .6s ease forwards; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .goat-photo {
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #fafafa;
    }
    .goat-photo img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      filter: saturate(.88);
      transform: scale(1);
      transition: transform .8s cubic-bezier(.16, 1, .3, 1), filter .5s ease;
    }
    .goat:hover .goat-photo img { transform: scale(1.04); filter: saturate(1.05); }
    .goat-photo.soon {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 12px; letter-spacing: .08em;
    }

    .goat-meta {
      display: flex;
      gap: 14px;
      padding-top: 14px;
    }
    .goat-index {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      padding-top: 3px;
    }
    .goat-name { font-weight: 700; font-size: 15px; }
    .goat-title { color: var(--text-muted); font-size: 13px; margin-top: 1px; }

    footer {
      border-top: 1px solid var(--border);
      padding: 18px 24px;
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--text-muted); font-family: var(--mono);
    }

    @media (max-width: 640px) {
      #body { padding: 40px 16px 56px; }
      #nav { padding: 0 16px; }
      #wall { gap: 32px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="page">

    <nav id="nav">
      <a id="nav-back" href="/">← ajchapa</a>
      <span id="nav-time">—</span>
    </nav>

    <div id="body">
      <h1 id="title">goats</h1>
      <div id="count">—</div>
      <main id="wall"><!-- rendered by the script below --></main>
    </div>

    <footer>
      <span>ajchapa.com/goats</span>
      <span id="foot-year">2026</span>
    </footer>

  </div>

  <script>
    // ─────────────────────────────
    //  ADD YOUR GOATS HERE
    //  copy a line, change name / title / photo.
    //  photo = a filename in this repo (e.g. "photo2.jpg").
    //  photo: "" shows a quiet placeholder tile.
    // ─────────────────────────────
    const GOATS = [
      { id: "ajchapa", name: "ajchapa", title: "the goat",         photo: "photo2.jpg" },
      { id: "alex",    name: "alex",    title: "goat of fortnite", photo: ""           },
    ];

    const wall = document.getElementById("wall");

    GOATS.forEach((g, i) => {
      const el = document.createElement("article");
      el.className = "goat";
      el.style.animationDelay = (i * 90) + "ms";

      const photo = g.photo
        ? `<div class="goat-photo"><img src="${g.photo}" alt="${g.name}" loading="lazy"></div>`
        : `<div class="goat-photo soon"><span>soon</span></div>`;

      el.innerHTML = `
        ${photo}
        <div class="goat-meta">
          <span class="goat-index">${String(i + 1).padStart(2, "0")}</span>
          <div>
            <div class="goat-name">${g.name}</div>
            <div class="goat-title">${g.title}</div>
          </div>
        </div>`;
      wall.appendChild(el);
    });

    document.getElementById("count").textContent =
      String(GOATS.length).padStart(2, "0") + " certified";

    // same live clock as the index page
    function tick() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      document.getElementById("nav-time").textContent =
        p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    tick(); setInterval(tick, 1000);
    document.getElementById("foot-year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
