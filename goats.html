<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wall of Goats — ajchapa</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============ wall of goats — ajchapa.com/goats.html ============
       white minimal page (same theme as the rest of the site).
       the cards are where the craft lives: layered foil/holo
       gradients, lerped 3D tilt + hover lift, click/enter to flip.
       to add a goat, copy an entry in the GOATS array below.   */

    :root {
      --bg:         #ffffff;
      --border:     #ebebeb;
      --text-main:  #000000;
      --text-muted: #888888;
      --font:       'Mulish', sans-serif;
      --mono:       Menlo, Monaco, Consolas, monospace;
      --foil:       #d9c48f;   /* champagne hairline */
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: #f3e3b3; }

    html { background: #fff; }
    body {
      /* whisper of warmth at the top, fading to pure white —
         barely there, but the page doesn't feel sterile */
      background:
        radial-gradient(1100px 520px at 50% -8%, rgba(217, 196, 143, .13), transparent 65%),
        #ffffff;
      color: var(--text-main);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    #page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

    /* same nav as the rest of the site */
    #nav {
      height: 52px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; flex-shrink: 0;
    }
    #nav-back { font-size: 12px; color: var(--text-muted); letter-spacing: .04em; }
    #nav-back:hover { color: var(--text-main); }
    #nav-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

    #body { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 48px 24px 88px; }

    /* editorial title lockup: uppercase display, mono eyebrow */
    #eyebrow {
      font-family: var(--mono); font-size: 11px;
      letter-spacing: .32em; text-transform: uppercase;
      color: var(--text-muted);
    }
    h1#title {
      margin-top: 12px;
      font-weight: 800;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: -0.02em;
      line-height: 1;
      text-transform: uppercase;
    }

    /* ================= the wall ================= */
    #wall {
      margin-top: 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 240px));
      gap: 40px 28px;
      justify-content: center;
      perspective: 1400px;
    }

    .card { aspect-ratio: 5 / 6.9; opacity: 0; animation: rise .7s ease forwards; cursor: pointer; }
    .card:focus { outline: none; }
    .card:focus-visible .face { outline: 2px solid var(--text-main); outline-offset: 4px; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .flipper {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.2, .7, .25, 1);
    }
    .card.flipped .flipper { transform: rotateY(180deg); }

    .tilter {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 20px; overflow: hidden;
      background: #fff;
      border: 1px solid var(--foil);
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 18px 44px -20px rgba(0,0,0,.18);
      transition: box-shadow .35s ease;
    }
    .card:hover .face {
      box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 34px 70px -22px rgba(0,0,0,.28);
    }
    .face.back { transform: rotateY(180deg); }

    /* thin inner foil keyline — the premium detail */
    .keyline {
      position: absolute; inset: 9px;
      border: 1px solid rgba(217, 196, 143, .5);
      border-radius: 13px; pointer-events: none; z-index: 5;
    }

    /* ---------- front ---------- */
    .photo-wrap { position: relative; height: 60%; overflow: hidden; background: #f7f7f7; }
    .photo-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: saturate(.94);
    }
    .photo-wrap.soon { display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 12px; letter-spacing: .1em; }

    /* -- light layers. all driven by --mx/--my set in JS -- */
    .glare, .holo, .sparkle { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
    .card:hover .glare, .card:hover .holo, .card:hover .sparkle { opacity: 1; }

    /* tight moving highlight — this is what reads as "foil" */
    .glare {
      background: radial-gradient(
        farthest-corner circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,.85) 0%, rgba(255,255,255,.28) 28%, transparent 62%);
      mix-blend-mode: overlay;
    }
    /* iridescent wash */
    .holo {
      background: conic-gradient(from 210deg at var(--mx, 50%) var(--my, 50%),
        rgba(255,119,168,.20), rgba(255,210,63,.20), rgba(120,255,190,.20),
        rgba(120,170,255,.20), rgba(200,120,255,.20), rgba(255,119,168,.20));
      mix-blend-mode: soft-light;
    }
    /* sparkle dust clustered near the cursor */
    .sparkle {
      background-image: radial-gradient(rgba(255,255,255,.95) 1px, transparent 1.7px);
      background-size: 9px 9px;
      mix-blend-mode: overlay;
      -webkit-mask-image: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), black 0%, transparent 52%);
      mask-image: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), black 0%, transparent 52%);
    }

    .stamp {
      position: absolute; top: 16px; right: 16px; z-index: 6;
      font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
      background: rgba(255,255,255,.88); backdrop-filter: blur(4px);
      border: 1px solid var(--border); border-radius: 99px;
      padding: 4px 10px; color: var(--text-main);
    }

    .plate { position: relative; height: 40%; padding: 16px 18px 14px;
             display: flex; flex-direction: column; background: #fff; }
    .plate .kicker { font-size: 10px; font-weight: 800; letter-spacing: .3em;
                     text-transform: uppercase; color: var(--text-muted); }
    .plate .name { font-size: 20px; font-weight: 800; letter-spacing: .02em;
                   text-transform: uppercase; margin-top: 5px; }
    .plate .goat-of { color: var(--text-muted); font-size: 12.5px; margin-top: 1px; }

    /* spec-sheet stats: hairline rows, tabular numerals — nothing to misalign */
    .stats { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
    .stat {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 6px 0; border-bottom: 1px solid #f3f3f3;
      font-size: 12px;
    }
    .stat:last-child { border-bottom: 0; }
    .stat .label { color: var(--text-muted); letter-spacing: .05em; }
    .stat .num { font-family: var(--mono); font-weight: 700;
                 font-variant-numeric: tabular-nums; }

    /* ---------- back ---------- */
    .face.back { display: flex; flex-direction: column; padding: 24px 22px; background: #fff; }
    .back-num { font-size: 72px; font-weight: 800; letter-spacing: -0.04em; line-height: 1;
                font-variant-numeric: tabular-nums; }
    .back-name { font-size: 18px; font-weight: 800; letter-spacing: .03em;
                 text-transform: uppercase; margin-top: 12px; }
    .back-title { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
    .back-rule { height: 1px; background: var(--border); margin: 16px 0; }
    .back-stats { display: grid; gap: 10px; margin-top: 2px; }
    .back-stat { display: flex; justify-content: space-between; align-items: baseline; }
    .back-stat .bl { font-size: 12px; color: var(--text-muted); letter-spacing: .05em; }
    .back-stat .bv { font-family: var(--mono); font-size: 20px; font-weight: 700;
                     font-variant-numeric: tabular-nums; }
    .back-foot { margin-top: auto; font-size: 10px; letter-spacing: .22em;
                 text-transform: uppercase; color: var(--text-muted); }

    @media (max-width: 640px) {
      #body { padding: 36px 16px 64px; }
      #nav { padding: 0 16px; }
      #wall { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 28px 18px; }
    }
  </style>
</head>
<body>
  <div id="page">
    <nav id="nav">
      <a id="nav-back" href="/">← ajchapa</a>
      <span id="nav-time">—</span>
    </nav>

    <div id="body">
      <div id="eyebrow">ajchapa · 003</div>
      <h1 id="title">Wall of Goats</h1>
      <main id="wall"></main>
    </div>
  </div>

  <script>
    // ─────────────────────────────
    //  ADD YOUR GOATS HERE
    //  copy a line, change name / title / photo / stats.
    //  photo = a filename in this repo. photo: "" = placeholder.
    // ─────────────────────────────
    const GOATS = [
      { id: "ajchapa", name: "ajchapa", title: "the goat",
        photo: "photo2.jpg",
        stats: [["aura", 99], ["hustle", 97], ["flips", 94]] },
      { id: "alex", name: "alex", title: "goat of fortnite",
        photo: "",
        stats: [["builds", 99], ["clutch", 96], ["aim", 93]] },
      { id: "kush", name: "kush", title: "goat of excel",
        photo: "",
        stats: [["formulas", 99], ["pivot tables", 97], ["vlookup speed", 95]] },
    ];

    const wall = document.getElementById("wall");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    GOATS.forEach((g, i) => {
      const card = document.createElement("article");
      card.className = "card";
      card.style.animationDelay = (i * 110) + "ms";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", g.name + ", " + g.title + ". Activate to flip.");

      const photo = g.photo
        ? `<div class="photo-wrap"><img src="${g.photo}" alt="${g.name}" loading="lazy">
             <div class="glare"></div><div class="holo"></div><div class="sparkle"></div></div>`
        : `<div class="photo-wrap soon"><span>soon</span></div>`;

      const stats = g.stats.map(([l, v]) => `
        <div class="stat"><span class="label">${l}</span><span class="num">${v}</span></div>`).join("");

      const backStats = g.stats.map(([l, v]) => `
        <div class="back-stat"><span class="bl">${l}</span><span class="bv">${v}</span></div>`).join("");

      card.innerHTML = `
        <div class="flipper"><div class="tilter">
          <div class="face front">
            <div class="keyline"></div>
            <div class="stamp">${String(i + 1).padStart(3, "0")}</div>
            ${photo}
            <div class="plate">
              <div class="kicker">goat</div>
              <div class="name">${g.name}</div>
              <div class="goat-of">${g.title}</div>
              <div class="stats">${stats}</div>
            </div>
          </div>
          <div class="face back">
            <div class="keyline"></div>
            <div class="back-num">${String(i + 1).padStart(2, "0")}</div>
            <div class="back-name">${g.name}</div>
            <div class="back-title">${g.title}</div>
            <div class="back-rule"></div>
            <div class="back-stats">${backStats}</div>
            <div class="back-foot">wall of goats</div>
          </div>
        </div></div>`;

      const flip = () => card.classList.toggle("flipped");
      card.addEventListener("click", flip);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      wall.appendChild(card);
    });

    // — buttery tilt + hover lift: one rAF loop, lerped toward the
    //   cursor. the slight delay is what makes it feel like an
    //   object, not a control. (calm when reduced-motion is on)
    const cards = [...document.querySelectorAll(".card")];
    const state = cards.map(() => ({ tx: 0, ty: 0, cx: 0, cy: 0, lift: 0, liftT: 0, active: false }));

    cards.forEach((card, i) => {
      const tilter = card.querySelector(".tilter");
      card.addEventListener("pointermove", (e) => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        state[i].tx = x - 0.5;
        state[i].ty = y - 0.5;
        state[i].liftT = -6;
        state[i].active = true;
        card.style.setProperty("--mx", (x * 100) + "%");
        card.style.setProperty("--my", (y * 100) + "%");
      });
      card.addEventListener("pointerleave", () => {
        state[i].tx = 0; state[i].ty = 0; state[i].liftT = 0; state[i].active = false;
      });
      card._tilter = tilter;
    });

    if (!reduceMotion) (function loop() {
      cards.forEach((card, i) => {
        const s = state[i];
        s.cx += (s.tx - s.cx) * 0.12;
        s.cy += (s.ty - s.cy) * 0.12;
        s.lift += (s.liftT - s.lift) * 0.16;
        if (Math.abs(s.cx) > 0.001 || Math.abs(s.cy) > 0.001 ||
            Math.abs(s.lift) > 0.05 || s.active) {
          card._tilter.style.transform =
            `translateY(${s.lift.toFixed(2)}px) ` +
            `rotateY(${(s.cx * 14).toFixed(2)}deg) ` +
            `rotateX(${(-s.cy * 14).toFixed(2)}deg)`;
        }
      });
      requestAnimationFrame(loop);
    })();

    // same live clock as the rest of the site
    function tick() {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      document.getElementById("nav-time").textContent =
        p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
