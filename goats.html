<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Undeniables — ajchapa</title>
  <meta name="description" content="undeniable at one thing. hand-picked. the wall is final." />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Undeniables — ajchapa" />
  <meta property="og:description" content="undeniable at one thing. hand-picked. the wall is final." />
  <meta property="og:image" content="https://ajchapa.com/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Mulish:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --border:#ebebeb; --text-main:#111; --text-muted:#888;
      --font:'Mulish',sans-serif;
      --serif:'Instrument Serif',Georgia,serif;
      --mono:Menlo,Monaco,Consolas,monospace;
      --foil:#d9c48f; --gold:#c9a227; --gold-deep:#a8842f; --gold-pale:#f1dfa8;
      --ox1:#9a1826; --ox2:#5a0c15; --ox3:#3b060c;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    ::selection{background:#f3e3b3}
    html{background:#fff}
    body{
      background:radial-gradient(1100px 520px at 50% -8%,rgba(217,196,143,.13),transparent 65%),#fff;
      color:var(--text-main);font-family:var(--font);font-size:14px;line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    body.locked{overflow:hidden}
    a{color:inherit;text-decoration:none}
    #page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

    #nav{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
    #nav-back{font-size:12px;color:var(--text-muted);letter-spacing:.04em}
    #nav-back:hover{color:var(--text-main)}
    #nav-right{display:flex;align-items:center;gap:18px}
    #nav-time{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
    #sound{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--text-muted)}
    #sound:hover{color:var(--text-main)}

    #body{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:56px 24px 96px}

    /* ================= hero ================= */
    #hero{display:flex;justify-content:space-between;align-items:flex-end;gap:48px}
    #eyebrow{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold-deep)}
    h1#title{
      margin-top:6px;font-family:var(--serif);font-weight:400;
      font-size:clamp(52px,8vw,96px);letter-spacing:-.015em;line-height:1;cursor:default;
    }
    .kword{display:inline-block;white-space:nowrap}
    .kmask{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
    .kl{
      display:inline-block;opacity:0;transform:translateY(110%);
      animation:kin .9s cubic-bezier(.19,.7,.22,1) forwards;animation-delay:var(--d,0ms);
      background:linear-gradient(105deg,#111 42%,#c9a227 50%,#111 58%);
      background-size:280% 100%;background-position:0% 0;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      transition:background-position 1.1s ease;
    }
    @keyframes kin{to{opacity:1;transform:translateY(0)}}
    h1#title:hover .kl{background-position:100% 0}
    #tagline{
      margin-top:16px;font-family:var(--serif);font-style:italic;font-size:21px;color:var(--text-muted);
      opacity:0;animation:fade .8s ease 1s forwards;
    }
    @keyframes fade{to{opacity:1}}

    /* ================= the seal button ================= */
    #seal-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:10px;
      opacity:0;transform:translateY(14px);animation:how-in .8s ease .55s forwards}
    @keyframes how-in{to{opacity:1;transform:translateY(0)}}
    #seal{
      position:relative;width:108px;height:108px;border-radius:50%;border:0;padding:0;cursor:pointer;
      background:none;overflow:hidden;box-shadow:0 10px 20px -6px rgba(122,15,26,.45);
      transition:transform .5s cubic-bezier(.2,.7,.25,1);
    }
    #seal:hover{transform:scale(1.07) rotate(-4deg)}
    #seal:focus-visible{outline:2px solid var(--text-main);outline-offset:5px}
    #seal svg{width:100%;height:100%;display:block}
    #seal .ring{transform-origin:60px 60px;animation:spin 40s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #seal::after{
      content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
      background:linear-gradient(110deg,transparent 38%,rgba(255,244,205,.7) 50%,transparent 62%);
      transform:translateX(-130%);animation:shine 5.5s ease-in-out 1.6s infinite;
    }
    @keyframes shine{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
    #seal-name{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1;color:var(--text-main)}
    #seal-hint{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--text-muted)}

    /* ================= the scroll ================= */
    #scroll-modal{
      position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
      background:rgba(24,4,7,.62);
      visibility:hidden;opacity:0;transition:opacity .4s ease,visibility 0s .9s;
    }
    #scroll-modal.open{visibility:visible;opacity:1;transition:opacity .4s ease}
    #scroll{width:100%;max-width:480px}

    .rod{
      position:relative;height:22px;border-radius:11px;
      background:linear-gradient(180deg,var(--ox1),var(--ox2) 55%,var(--ox3));
      border:1px solid var(--gold);box-shadow:0 8px 16px -6px rgba(0,0,0,.5);
    }
    .rod::before,.rod::after{
      content:"";position:absolute;top:-6px;width:16px;height:32px;border-radius:7px;
      background:linear-gradient(90deg,#8a6a1f,#f1dfa8 45%,#c9a227 60%,#8a6a1f);
    }
    .rod::before{left:-9px}
    .rod::after{right:-9px}

    #s-body{
      margin:0 16px;display:grid;grid-template-rows:0fr;
      transition:grid-template-rows .9s cubic-bezier(.5,0,.3,1);
      background:
        linear-gradient(90deg,rgba(120,70,20,.22),transparent 7%,transparent 93%,rgba(120,70,20,.22)),
        linear-gradient(180deg,#f7eccf,#f1e3bd);
      box-shadow:inset 0 10px 14px -10px rgba(80,40,10,.35),inset 0 -10px 14px -10px rgba(80,40,10,.35);
    }
    #scroll-modal.open #s-body{grid-template-rows:1fr;transition:grid-template-rows 1.15s cubic-bezier(.22,.7,.2,1) .15s}
    #s-inner{overflow:hidden;min-height:0}
    #s-content{
      position:relative;padding:34px 34px 30px;max-height:calc(100dvh - 130px);overflow-y:auto;
      text-align:center;color:var(--ox2);
    }
    #s-content::before{
      content:"";position:absolute;inset:10px;border:1px solid rgba(168,132,47,.4);pointer-events:none;
    }
    #s-close{
      position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
      background:none;border:1px solid rgba(168,132,47,.55);color:var(--ox2);
      font-size:17px;line-height:1;cursor:pointer;z-index:2;transition:background .25s;
    }
    #s-close:hover{background:rgba(168,132,47,.18)}
    #s-close:focus-visible{outline:2px solid var(--ox2);outline-offset:2px}

    .reveal{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
    #scroll-modal.open .reveal{
      opacity:1;transform:none;
      transition:opacity .8s ease calc(.75s + var(--i,0) * .22s),transform .8s ease calc(.75s + var(--i,0) * .22s);
    }
    #s-eyebrow{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold-deep)}
    #s-title{font-family:var(--serif);font-weight:400;font-size:50px;line-height:1.02;margin-top:2px;color:var(--ox2)}
    .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 8px;color:var(--gold-deep);font-size:11px}
    .orn::before,.orn::after{content:"";height:1px;width:60px;background:rgba(168,132,47,.5)}
    #s-rules{list-style:none;margin-top:6px}
    #s-rules li{padding:15px 0}
    #s-rules .roman{display:block;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gold-deep)}
    #s-rules .txt{display:block;font-family:var(--serif);font-size:29px;line-height:1.1;margin-top:2px}
    #s-sign{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
    .wax{
      width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 35% 30%,#b5222f,#7a0f1a 60%,#4a0810);
      box-shadow:0 5px 10px -3px rgba(60,6,12,.6),inset 0 0 0 3px rgba(255,255,255,.05);
      font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold-pale);
    }
    #s-sign span{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ox2)}

    /* ================= the wall ================= */
    #wall{
      margin-top:64px;display:grid;
      grid-template-columns:repeat(auto-fill,minmax(210px,240px));gap:44px 30px;
      justify-content:center;perspective:1400px;
    }
    .card{aspect-ratio:5/6.7;opacity:0;animation:rise .7s ease forwards;cursor:pointer}
    .card:focus{outline:none}
    .card:focus-visible .face{outline:2px solid var(--text-main);outline-offset:4px}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    .flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.25,1)}
    .card.flipped .flipper{transform:rotateY(180deg)}
    .tilter{position:absolute;inset:0;transform-style:preserve-3d}
    .card:hover .tilter{will-change:transform}

    .face{
      position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
      border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--foil);
      box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 44px -22px rgba(0,0,0,.24);
    }
    .face.back{transform:rotateY(180deg)}
    .keyline{position:absolute;inset:9px;border:1px solid rgba(217,196,143,.55);border-radius:13px;pointer-events:none;z-index:6}

    /* front */
    .photo-wrap{position:relative;height:70%;overflow:hidden;background:#f4f4f4}
    .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .scrim{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,.14) 36%,transparent 60%)}
    .photo-title{
      position:absolute;z-index:4;left:22px;right:22px;bottom:16px;
      font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.1;
      color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.45);pointer-events:none;
    }

    /* one light layer: soft glare + a champagne sheen, no blend modes */
    .sheen{
      position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s ease;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.4),transparent 55%),
        linear-gradient(115deg,transparent calc(var(--mx,50%) - 22%),rgba(255,226,150,.3) var(--mx,50%),transparent calc(var(--mx,50%) + 22%));
    }
    .card:hover .sheen,body.gyro .sheen{opacity:1}

    /* no photo yet: soft gold gradient + initial */
    .photo-wrap.empty{
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(120% 90% at 50% 20%,#fffaf0,#f6ecd0);
    }
    .photo-wrap.empty .initial{font-family:var(--serif);font-style:italic;font-size:120px;line-height:1;color:rgba(201,162,39,.5);margin-bottom:14px}
    .photo-wrap.empty .photo-title{color:var(--gold-deep);text-shadow:none}

    .plate{position:relative;height:30%;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#fff,#fcf7e6)}
    .plate .kicker{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--text-muted)}
    .plate .name{font-family:var(--serif);font-size:34px;line-height:1;margin-top:4px}

    /* back */
    .face.back{display:flex;flex-direction:column;padding:28px 26px;background:#fff}
    .face.back::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background-image:
        repeating-linear-gradient(45deg,rgba(168,132,47,.06) 0 1px,transparent 1px 14px),
        repeating-linear-gradient(-45deg,rgba(168,132,47,.06) 0 1px,transparent 1px 14px);
    }
    .face.back>*{position:relative}
    .face.back>.keyline{position:absolute}
    .back-name{font-family:var(--serif);font-size:38px;line-height:1}
    .back-title{font-family:var(--serif);font-style:italic;font-size:21px;margin-top:6px;color:var(--gold-deep)}
    .back-rule{height:1px;background:var(--border);margin:20px 0 16px}
    .back-label{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--text-muted);margin-bottom:12px}
    .back-known{list-style:none;display:grid;gap:12px}
    .back-known li{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:22px;line-height:1}
    .back-known li::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}
    .back-foot{margin-top:auto;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text-muted)}

    @media (max-width:760px){
      #hero{flex-direction:column;align-items:flex-start;gap:28px}
      #seal-wrap{flex-direction:row;gap:16px}
      #seal{width:88px;height:88px}
      #seal-text{display:flex;flex-direction:column;gap:4px}
    }
    @media (max-width:640px){
      #body{padding:40px 16px 72px}
      #nav{padding:0 16px}
      #wall{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:30px 18px}
      .photo-title{font-size:19px;left:16px;right:16px;bottom:13px}
      .plate .name{font-size:28px}
      #s-content{padding:30px 22px 26px}
      #s-title{font-size:42px}
      #s-rules .txt{font-size:25px}
    }
    @media (prefers-reduced-motion:reduce){
      .kl{animation:none;opacity:1;transform:none}
      #seal .ring,#seal::after{animation:none}
      #seal-wrap,.card,#tagline{animation-duration:.01s}
      #s-body,#scroll-modal.open #s-body{transition:none}
      .reveal,#scroll-modal.open .reveal{transition:none}
    }
  </style>
</head>
<body>
  <div id="page">
    <nav id="nav">
      <a id="nav-back" href="/">← ajchapa</a>
      <div id="nav-right">
        <button id="sound" type="button" aria-pressed="false">sound: off</button>
        <span id="nav-time">—</span>
      </div>
    </nav>

    <div id="body">
      <header id="hero">
        <div id="hero-left">
          <div id="eyebrow">ajchapa presents</div>
          <h1 id="title" aria-label="The Undeniables"></h1>
          <div id="tagline">undeniable at one thing. the wall is final.</div>
        </div>

        <div id="seal-wrap">
          <button id="seal" type="button" aria-label="Read the goat code: how it works">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <defs>
                <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#f6e7b4"/><stop offset=".5" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6a1f"/>
                </linearGradient>
                <radialGradient id="ox" cx=".4" cy=".3" r=".9">
                  <stop offset="0" stop-color="#9a1826"/><stop offset="1" stop-color="#3b060c"/>
                </radialGradient>
                <path id="circ" d="M60,60 m-41,0 a41,41 0 1,1 82,0 a41,41 0 1,1 -82,0"/>
              </defs>
              <circle cx="60" cy="60" r="58" fill="url(#gold)"/>
              <circle cx="60" cy="60" r="54" fill="url(#ox)"/>
              <circle cx="60" cy="60" r="51" fill="none" stroke="#d9c48f" stroke-opacity=".6" stroke-width=".8"/>
              <g class="ring">
                <text font-family="Menlo,Consolas,monospace" font-size="8" font-weight="700" fill="#f1dfa8">
                  <textPath href="#circ" textLength="256" lengthAdjust="spacing">the goat code · click to read · </textPath>
                </text>
              </g>
              <circle cx="60" cy="60" r="27" fill="none" stroke="#c9a227" stroke-width=".8"/>
              <text x="60" y="70" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="30" fill="url(#gold)">AJ</text>
            </svg>
          </button>
          <div id="seal-text">
            <div id="seal-name">the goat code</div>
            <div id="seal-hint">how it works →</div>
          </div>
        </div>
      </header>

      <main id="wall"></main>
    </div>
  </div>

  <!-- the scroll -->
  <div id="scroll-modal" aria-hidden="true">
    <div id="scroll" role="dialog" aria-modal="true" aria-labelledby="s-title">
      <div class="rod"></div>
      <div id="s-body"><div id="s-inner"><div id="s-content">
        <button id="s-close" type="button" aria-label="Close">×</button>
        <div id="s-eyebrow" class="reveal" style="--i:0">by order of ajchapa</div>
        <h2 id="s-title" class="reveal" style="--i:1">the goat code</h2>
        <div class="orn reveal" style="--i:2">◆</div>
        <ol id="s-rules"></ol>
        <div id="s-sign" class="reveal" style="--i:7">
          <div class="wax">AJ</div>
          <span>signed, ajchapa</span>
        </div>
      </div></div></div>
      <div class="rod"></div>
    </div>
  </div>

  <script>
    // ─────────────────────────────
    //  ADD YOUR GOATS HERE
    //  photo: a filename in this repo. leave "" and the card
    //  shows a soft gold gradient with their initial.
    //  known: what they're known for (shown on the back).
    // ─────────────────────────────
    const GOATS = [
      { name:"ajchapa", title:"the goat", photo:"photo2.jpg",
        known:["aura","hustle","flips"] },
      { name:"alex", title:"goat of fortnite", photo:"",
        known:["builds","clutch","aim"] },
      { name:"kush", title:"goat of excel", photo:"",
        known:["formulas","pivot tables","vlookup speed"] },
    ];
    const RULES = [
      ["i.",   "undeniable at one thing"],
      ["ii.",  "hand-picked by ajchapa"],
      ["iii.", "the wall is final"],
    ];

    const wall = document.getElementById("wall");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    // ── flip sound (off by default)
    let soundOn = false, ac;
    const soundBtn = document.getElementById("sound");
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = "sound: " + (soundOn ? "on" : "off");
      soundBtn.setAttribute("aria-pressed", soundOn);
      tick();
    });
    function tick() {
      if (!soundOn) return;
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(1900, t);
      o.frequency.exponentialRampToValueAtTime(700, t + .05);
      g.gain.setValueAtTime(.05, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .07);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + .08);
    }

    // ── build the cards
    GOATS.forEach((g, i) => {
      const card = document.createElement("article");
      card.className = "card";
      card.style.animationDelay = (i * 110) + "ms";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", g.name + ", " + g.title + ". Activate to flip.");

      const photo = g.photo
        ? `<div class="photo-wrap"><img src="${g.photo}" alt="${g.name}" loading="lazy" decoding="async">
             <div class="scrim"></div><div class="sheen"></div>
             <div class="photo-title">${g.title}</div></div>`
        : `<div class="photo-wrap empty"><div class="initial">${g.name[0]}</div>
             <div class="photo-title">${g.title}</div></div>`;

      const known = g.known.map((k) => `<li>${k}</li>`).join("");

      card.innerHTML = `
        <div class="flipper"><div class="tilter">
          <div class="face front">
            <div class="keyline"></div>${photo}
            <div class="plate">
              <div class="kicker">goat</div>
              <div class="name">${g.name}</div>
            </div>
          </div>
          <div class="face back">
            <div class="keyline"></div>
            <div class="back-name">${g.name}</div>
            <div class="back-title">${g.title}</div>
            <div class="back-rule"></div>
            <div class="back-label">known for</div>
            <ul class="back-known">${known}</ul>
            <div class="back-foot">the undeniables</div>
          </div>
        </div></div>`;

      const flip = () => { card.classList.toggle("flipped"); tick(); };
      card.addEventListener("click", flip);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      wall.appendChild(card);
    });

    // ── kinetic title (entrance + gold sweep on hover; no per-frame work)
    const titleEl = document.getElementById("title");
    ["The", "Undeniables"].forEach((w, wi) => {
      const word = document.createElement("span");
      word.className = "kword";
      word.setAttribute("aria-hidden", "true");
      [...w].forEach((ch, ci) => {
        const mask = document.createElement("span"); mask.className = "kmask";
        const l = document.createElement("span"); l.className = "kl"; l.textContent = ch;
        l.style.setProperty("--d", ((wi * 4 + ci) * 50) + "ms");
        mask.appendChild(l); word.appendChild(mask);
      });
      titleEl.appendChild(word);
      titleEl.appendChild(document.createTextNode(" "));
    });

    // ── card tilt: one rAF loop that only runs while something is moving
    const cards = [...document.querySelectorAll(".card")];
    const state = cards.map((c) => ({
      tx:0, ty:0, cx:0, cy:0, lift:0, liftT:0, active:false,
      tilter: c.querySelector(".tilter"), sheen: c.querySelector(".sheen"), dirty:false
    }));
    let running = false;
    function kick() { if (!running) { running = true; requestAnimationFrame(step); } }
    function step() {
      let busy = false;
      state.forEach((s) => {
        const dx = s.tx - s.cx, dy = s.ty - s.cy, dl = s.liftT - s.lift;
        if (Math.abs(dx) < .0008 && Math.abs(dy) < .0008 && Math.abs(dl) < .03) {
          if (s.dirty) {
            s.cx = s.tx; s.cy = s.ty; s.lift = s.liftT;
            s.tilter.style.transform = s.liftT || s.tx || s.ty
              ? `translateY(${s.lift}px) rotateY(${s.cx * 14}deg) rotateX(${-s.cy * 14}deg)` : "";
            s.dirty = false;
          }
          if (s.active) busy = true;
          return;
        }
        s.cx += dx * .14; s.cy += dy * .14; s.lift += dl * .18;
        s.tilter.style.transform =
          `translateY(${s.lift.toFixed(2)}px) rotateY(${(s.cx * 14).toFixed(2)}deg) rotateX(${(-s.cy * 14).toFixed(2)}deg)`;
        s.dirty = true; busy = true;
      });
      if (busy) requestAnimationFrame(step); else running = false;
    }
    cards.forEach((card, i) => {
      const s = state[i];
      card.addEventListener("pointermove", (e) => {
        if (reduceMotion) return;
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        s.tx = x - .5; s.ty = y - .5; s.liftT = -6; s.active = true;
        if (s.sheen) { s.sheen.style.setProperty("--mx", (x * 100) + "%"); s.sheen.style.setProperty("--my", (y * 100) + "%"); }
        kick();
      });
      card.addEventListener("pointerleave", () => {
        s.tx = 0; s.ty = 0; s.liftT = 0; s.active = false; s.dirty = true; kick();
      });
    });

    // ── gyroscope tilt on phones (iOS asks permission on first tap)
    function enableGyro() {
      document.body.classList.add("gyro");
      let queued = false, gx = 0, gy = 0;
      addEventListener("deviceorientation", (e) => {
        if (e.gamma == null) return;
        gx = clamp(e.gamma / 40, -.5, .5); gy = clamp((e.beta - 40) / 40, -.5, .5);
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          state.forEach((s) => {
            s.tx = gx; s.ty = gy; s.liftT = -3; s.dirty = true;
            if (s.sheen) { s.sheen.style.setProperty("--mx", ((gx + .5) * 100) + "%"); s.sheen.style.setProperty("--my", ((gy + .5) * 100) + "%"); }
          });
          kick();
        });
      });
    }
    if (!reduceMotion && matchMedia("(hover: none)").matches && "DeviceOrientationEvent" in window) {
      addEventListener("pointerdown", async () => {
        try {
          if (typeof DeviceOrientationEvent.requestPermission === "function") {
            if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return;
          }
          enableGyro();
        } catch (_) {}
      }, { once: true });
    }

    // ── the scroll
    const modal = document.getElementById("scroll-modal");
    const seal = document.getElementById("seal");
    const closeBtn = document.getElementById("s-close");
    const rulesEl = document.getElementById("s-rules");

    RULES.forEach(([roman, text], ri) => {
      const li = document.createElement("li");
      li.className = "reveal";
      li.style.setProperty("--i", ri + 3);
      li.innerHTML = `<span class="roman">${roman}</span><span class="txt">${text}</span>`;
      rulesEl.appendChild(li);
    });

    function openScroll() {
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("locked");
      tick();
      setTimeout(() => closeBtn.focus({ preventScroll: true }), 80);
    }
    function closeScroll() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("locked");
      seal.focus({ preventScroll: true });
    }
    seal.addEventListener("click", openScroll);
    closeBtn.addEventListener("click", closeScroll);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeScroll(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeScroll(); });

    // ── live clock
    function clock() {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      document.getElementById("nav-time").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    clock(); setInterval(clock, 1000);
  </script>
</body>
</html>
